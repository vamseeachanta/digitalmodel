# Data pointers for bulky engineering artifacts moved out of git.
#
# On 2026-09-22 the repository was slimmed (~2.87 GB -> ~0.30 GB at HEAD).
# The files below were relocated to canonical archive storage; this file
# records where they live and how to verify them. Nothing here is fetched
# automatically — copy what you need from the archive host.
#
# Full per-file SHA-256 manifest:
#   ace-linux-1:/mnt/ace/digitalmodel/MANIFEST.sha256.tsv
# (tab-separated: sha256, bytes, repo-relative path)

archive:
  host: ace-linux-1
  root: /mnt/ace/digitalmodel
  # Paths under root mirror the repo-relative paths from the slim commit's parent.

slim:
  date: "2026-09-22"
  parent_commit: 7e71d6b26eb863e95ae3f0ec9957b081d85dea28
  backup_bundle: /mnt/ace/_transfer/digitalmodel-pre-slim-20260922.bundle  # on ace-linux-1; verified complete history
  document_map: DOCUMENT-MAP.md  # repo root; full class inventory

classes:
  - name: solver-inputs
    description: >-
      AQWA/OrcaFlex solver inputs (.dat, .lis, .qtf) and OrcaWave results
      (.owr), OrcaFlex models (.sim), CAD/mesh (.igs, .stl, .dwg, .dxf),
      plus large vessel-RAO YAML and CSV inputs (>1 MB).
    files: 1180
    bytes: 2220000000  # ~2.22 GB
    extensions: [dat, lis, qtf, sim, owr, igs, stl, dwg, dxf, yml, yaml, csv, engd, scdoc, gz, tif]
    note: >-
      Solver tests that consumed these fixtures now skip cleanly when the
      files are absent; see tests/hydrodynamics/diffraction/conftest.py and
      tests/solvers/orcaflex/reporting/test_fixture_snapshot.py.

  - name: html-report-renders
    description: >-
      Rendered HTML analysis reports (examples/reporting, OrcaWave benchmark
      pages, docs renders). Regenerable from code + inputs; archived, not deleted.
    files: 562
    bytes: 720400000  # ~720 MB
    extensions: [html]
    note: >-
      Runtime test fixtures (*.report.snapshot.html, fixtures/golden/*.html)
      were explicitly kept in git; only report renders moved.

  - name: documentation-images
    description: >-
      Documentation images (wave 2 of the 2026-09-22 slim): .png/.jpg/.gif/.svg
      illustrations under docs/ and examples/. Theme-critical UI assets were kept.
    files: 1292
    bytes: 335000000  # ~335 MB
    extensions: [png, jpg, jpeg, gif, svg, bmp, jfif]

  - name: office-documents
    description: >-
      Engineering documents (.pptx, .docx, .pdf) superseded by or duplicated in
      the docs/ knowledge base; archived for reference.
    files: 117
    bytes: 97000000  # ~97 MB
    extensions: [pptx, ppt, docx, doc, pdf]

verification: >-
  To verify a file: sha256sum the archive copy and compare against
  MANIFEST.sha256.tsv. To restore: copy ace-linux-1:/mnt/ace/digitalmodel/<path>
  back to <path> in a checkout (paths mirror the pre-slim tree).
