# Canonical ship-dimensions template.
#
# Provenance: This YAML is adopted directly as the canonical artifact under #461.
# Phase 1 uses manual curation. Add entries by hand following the schema in
# src/digitalmodel/naval_architecture/ship_dimensions.py.
#
# Superseded generator (not canonical): workspace-hub
#   scripts/data/doc-intelligence/generate-ship-dimension-template.py
#   scripts/data/doc_intelligence/generate_ship_dimension_template.py
# Migration to this schema: entries -> vessels; flatten dimensions: per entry;
# length_overall_ft -> loa_ft; speed_kts -> speed_kt; retain depth_ft.
# Generator hull_number is an integer or null; hull_code holds the type letters.
# For numbered hulls, create a string identifier:
#   hull_id = upper(hull_code) + '-' + str(hull_number)
#   {hull_code: bb, hull_number: 34} -> {hull_id: "BB-34"}
# Do not copy the integer into the hull_number alias (it requires a full string).
# For null hull_number, resolve the identifier from the source before migration.
# Map source_plan -> source, and add name.
# Map entry_status: pending -> draft; verification requires a separate check.
# The generator output is not a drop-in replacement for this template.
#
# Canonical template: data/ship_dimensions_template.yaml
# Loader: digitalmodel.naval_architecture.ship_dimensions.load_dimension_template()
# Validator: digitalmodel.naval_architecture.ship_dimensions.validate_vessel_entry()
#
# Required by the validator:
#   hull_id (str): stable vessel identifier; hull_number is an alias for hull_id
#   name (str): vessel or class name
#   loa_ft, beam_ft, draft_ft (positive float)
#
# Complete manual entry (not enforced by the validator):
#   loa_ft, beam_ft, draft_ft, depth_ft, displacement_lt, speed_kt
#   depth_ft (positive float); displacement_lt (positive float)
#   speed_kt (positive float): design speed in knots; cite the basis in source.
#   Do not substitute trial or maximum speed for design speed.
#   Leave unknown values blank; depth_ft and speed_kt are not validated.
#
# Dimension basis for manual curation:
#   displacement_lt: total ship weight at the source-stated design condition (LT).
#   Record standard, lightship or full-load explicitly in source, including the
#   included payload and consumables; no one condition is assumed from the key.
#   Do not substitute deadweight for displacement or mix loading conditions.
#   draft_ft: mean molded design draft at that same loading condition (ft),
#   from the molded baseline to the design waterline; record trim in source.
#   depth_ft: molded baseline to the uppermost continuous deck at side (ft),
#   measured amidships; identify that deck and the molded datum in source.
#   lwl_ft: waterline length at draft_ft and the same loading condition (ft).
#   The molded datum and deck above are curation conventions; the references
#   define the underlying waterline, keel-to-deck and ship-weight concepts.
#   Cite the loading condition, water density, datum and deck in source.
#   Leave a value blank when its basis is unknown; compare only matched bases.
#   full_load_lt denotes total ship weight with full payload and consumables.
#   Equality with displacement_lt is allowed when its cited basis is full-load;
#   the >= constraint alone does not establish a different loading condition.
#   The validator does not check loading condition or dimension basis.
#   Existing entries are not qualified to these bases; source checks remain #463.
#   Definitions: USNA EN400, Ch. 2, sections 2.3.2 and 2.5.1 (waterlines, depth,
#   draft); Ch. 3, section 3.1.1.1 (displacement as total ship weight):
#   https://www.usna.edu/NAOE/_files/documents/Courses/EN400/02.02%20Chapter%202.pdf
#   https://www.usna.edu/NAOE/_files/documents/Courses/EN400/02.03%20Chapter%203.pdf
#
# Optional fields (not required by the validator):
#   lwl_ft (positive float): waterline length; not required for completeness
#   source (str): dimension references, loading condition, datum and deck
#   full_load_lt (positive float, optional): >= displacement_lt when both are set
#   kg_ft, km_ft, gm_ft (positive float, optional)
#   cb (float, optional): block coefficient, 0 < cb <= 1
#
# Optional manual-curation metadata (not enforced by the validator):
#   entry_status (str): "draft" | "verified"
#   verification_source (str): reference checked before marking an entry verified
# Existing entries retain their source labels; verification is recorded separately.
#
# Fill in principal dimensions from ship plan PDFs.
# Sources: USNA ship plan collection, Jane's Fighting Ships
# Units: feet (ft), long tons (LT), and knots (kt)
