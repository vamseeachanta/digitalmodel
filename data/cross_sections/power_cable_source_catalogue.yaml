  static_versus_dynamic:
    statement: dynamic has torsional balance, greater axial strength, fatigue resistance, bend stiffness, weight and diameter; static is lighter, coilable, with a smaller minimum bend radius.
    source_id: 4
    locator: Table 3.2-1, p. 22
  working_load_limit_ratios:
    statement: Working load limit ratios "at least 5:1" for dynamic against 4:1 for static are quoted on the same page.
    source_id: 4
    locator: Table 3.2-1, p. 22
stiffness_derivation_summary:
- statement: 'Axisymmetric step: each helix element contributes to a layer stiffness; the assembled model gives axial stiffness, torsional stiffness (which differs by twist direction) and tension-torsion coupling. Friction is disregarded in this step.'
  source_id: 5
  locator: sections 2 to 4
  source_ids: [5, 6]
- statement: 'Bending step: a stick-slip model based on the contact forces from the axisymmetric solution. Elements are assumed to follow the supporting cylinder and slip only axially (loxodromic assumption); friction between elements in the same layer is neglected.'
  source_id: 5
  locator: sections 2 to 4
  source_ids: [5, 6]
- statement: 'Consequences for global analysis: bending stiffness is high before slip and low after, giving a hysteretic moment-curvature relation; the white paper notes that this stick-slip mechanism is a highly nonlinear source of damping in vortex-induced vibration and governs friction stress for fatigue, increasingly so at deep-water contact pressures.'
  source_id: 5
  locator: sections 2 to 4
  source_ids: [5, 6]
- statement: 'Outputs listed: axial, bending and torsion stiffness; fatigue stresses in helix elements; capacity curves for the whole section.'
  source_id: 5
  locator: sections 2 to 4
  source_ids: [5, 6]
- statement: 'Validation stated: an industry project compared the loxodromic assumption with bending tests at high and low tension.'
  source_id: 5
  locator: sections 2 to 4
  source_ids: [5, 6]
- statement: 'Tools named on pages read: Helica (the white paper); UFLEX version 2.8.9 (record of Janocha et al. 2024).'
  source_id: 5
  locator: sections 2 to 4
  source_ids: [5, 7]
