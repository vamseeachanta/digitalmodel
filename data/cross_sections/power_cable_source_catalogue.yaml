      typical_materials: Galvanised or stainless steel wires; one layer on static cable; an even number of contra-helical layers on dynamic cable for torque balance
      source_id: 1
      source_ids: *id001
      locator: pages B.1.1, B.1.1.1, B.1.1.2; COREWIND D3.1, section 3
    - order: 9
