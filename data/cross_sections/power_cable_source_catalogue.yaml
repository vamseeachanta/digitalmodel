    locator: pages B.1.1, B.1.1.1, B.1.1.2; COREWIND D3.1, section 3
    layers:
    - order: 1
      layer: Conductor
      function: Carries power
      typical_materials: Stranded copper or aluminium; 150 to 800 mm2 at 66 kV; copper preferred for fatigue in dynamic sections; longitudinally water-blocked
      source_id: 1
