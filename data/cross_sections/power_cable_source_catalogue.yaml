schema_version: 1
slice: 'first slice: power cables and what was read'
source_of_entries: research note on the issue
checked: '2026-10-11'
limits:
- this pass is strong on offshore-wind power cables, adequate on property derivation, and thin on umbilicals and unbonded flexible pipe, where the manufacturer brochures and the public handbook were found but could not be read. Rigid pipelines were not researched in this pass. Sixteen source entries are recorded (section 6), eleven read and five opened but unreadable or refused; the "at least 12 across all four asset families" criterion is therefore not yet met for umbilicals, flexible pipe and rigid pipe.
- 'Could not verify: any bending stiffness, torsional stiffness or minimum bend radius value for any family; any range for single-core AC, DC export, umbilical, unbonded flexible pipe or bonded hose; layer build-up for umbilicals and unbonded flexible pipe from a read page; the seed anchors named in the issue (manufacturer 66 kV cable document, society umbilical presentation, power and optical umbilical document) were not found by search in this pass; rigid pipelines were out of this pass.'
