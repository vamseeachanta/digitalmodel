exclusions:
- hull: DeepCwind / OC4 and VolturnUS-S semi-submersibles
  reason: The existing station profile cannot represent disconnected columns and pontoons.
    Open source meshes are not HullProfile definitions.
- hull: OC3-Hywind spar
  source: https://www.osti.gov/servlets/purl/979456
  page_table: NREL definition report, printed page 4, Table 3-1
  reason: Primary particulars were reopened. The station representation would require
    zero half-breadth outside the upper tapered radius, which is inferred to create
    centreplane curtains in the existing generator. No equivalent qualified station
    mesh is established.
- hull: WAMIT TEST03, TEST20 and TEST07 FPSO
  source: https://www.wamit.com/manual7.x/html/wamit_v75manualap1.html
  reason: Shaped ends are not defined by principal dimensions; a rectangular substitute
    would not reproduce the published geometry. Demo files are restricted.
- hull: KCS, KVLCC2, DTMB 5415, JBC and ONRT
  reason: Research note reports unstated geometry reuse terms. No source geometry
    is redistributed and no independently qualified station profile is established.
- hull: Series 60, Wigley, S-175 and DTC
  reason: The research note does not verify a complete usable hull definition. No
    dimensions from unverified cells are used.
- hull: Supply vessel and jack-up
  reason: No openly published complete definition verified in this bounded seed scope.
