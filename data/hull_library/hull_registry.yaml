units:
  length_bp: m
  beam: m
  draft: m
  block_coefficient: dimensionless
  displacement: t
  analytic_volume_m3: m^3
conventions:
  'null': not established; never assumed zero
  paths: repository-relative
  profile_loading: HullCatalog(data/hull_library/profiles)
  mesh_scope: Full hull; x=0 at aft extent, x increases toward the forward extent;
    y=0 at centerplane; z=0 at waterline, z negative below waterline.
  qualification: geometry only; quality checks do not establish solver validation
  gdf_header: GDFHandler.write uses the unit length and gravity from tests/hydrodynamics/bemrosetta/test_mesh.py::TestGDFHandler
    fixtures; this export convention is not the WAMIT benchmark run gravity.
  panel_normals: Outward into the fluid; panel vertices counter-clockwise when viewed
    from outside.
  cylinder_axis: The rebuilt cylinder axis is at x=R, y=0; the cited benchmark axis
    is at the origin.
  mesh_digests: Digests identify the committed generator exports; regenerate every
    export and refresh its digest when generator output changes.
rights:
  terms_url: https://www.wamit.com/demo.htm
  demo_geometry_restriction: Data in the geometric data files may not be modified
    nor may additional data be added to those files
  disposition: No demonstration geometry or source document is redistributed. Only
    dimensions from the public manual are rebuilt.
