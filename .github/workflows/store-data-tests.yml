name: Content store tests

"on":
  pull_request:
    paths:
      - ".gitignore"
      - ".github/workflows/store-data-tests.yml"
      - "scripts/data/fetch.py"
      - "data/MANIFEST.tsv"
      - "tests/data/**"
      - "docs/domains/orcaflex/risers/production/slwr/**"
      - "tests/conftest.py"
      - "pytest.ini"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  content-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest pytest-asyncio
      - name: Test retrieval and manifest
        run: python -m pytest tests/data
