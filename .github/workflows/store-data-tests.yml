name: Content store tests

"on":
  pull_request:
    paths:
      - ".gitignore"
      - ".github/workflows/store-data-tests.yml"
      - "scripts/data/fetch.py"
      - "scripts/data/qualify.py"
      - "docs/data/content-qualification.md"
      - "data/MANIFEST.tsv"
      - "tests/data/**"
      - "docs/domains/orcaflex/risers/production/slwr/**"
      - "tests/conftest.py"
      - "pytest.ini"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        # Match the project [test] constraints, including the async plugin pin.
        run: python -m pip install 'pytest>=7.4.3,<9.0.0' 'pytest-asyncio==0.21.1'
      - name: Test retrieval and manifest
        run: python -m pytest tests/data
