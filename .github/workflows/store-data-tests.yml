name: Content store tests

"on":
  pull_request:
    paths:
      - ".gitignore"
      - ".github/workflows/store-data-tests.yml"
      - "scripts/data/fetch.py"
      - "data/MANIFEST.tsv"
      - "tests/data/**"
      - "docs/domains/orcaflex/risers/production/slwr/**"
      - "tests/conftest.py"
      - "pytest.ini"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# PR_GATE_RUNNER accepts self-hosted-arm64; unset/unknown values keep hosted defaults.
# Fork pull requests always stay on hosted runners.
jobs:
  content-store:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.PR_GATE_RUNNER == 'self-hosted-arm64' && fromJSON('["self-hosted","Linux","ARM64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest pytest-asyncio
      - name: Test retrieval and manifest
        run: python -m pytest tests/data
