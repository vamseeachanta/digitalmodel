name: Content store tests

"on":
  pull_request:
    paths:
      - ".gitignore"
      - ".github/workflows/store-data-tests.yml"
      - "scripts/data/fetch.py"
      - "data/MANIFEST.tsv"
      - "tests/data/**"
      - "docs/domains/orcaflex/risers/production/slwr/**"
      - "tests/conftest.py"
      - "pytest.ini"
      - "pyproject.toml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  content-store:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","Linux"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest pytest-asyncio
      - name: Test retrieval and manifest
        run: python -m pytest tests/data
