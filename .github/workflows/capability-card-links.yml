name: Capability card links

# Network check of the public capability page. Runs inside the daily
# "Main full run" (full-matrix-sweep.yml, dispatched by our own cron) and on
# demand; no GitHub schedule trigger (maintainer ruling, 28 Oct 2026).
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  card-links:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","Linux"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - name: Verify public page and section anchors
        env:
          CAPABILITY_NETWORK_CHECK: '1'
        run: >-
          uv run --no-project --with pytest --with pytest-asyncio
          python -m pytest tests/capabilities/test_onepager_html.py
          -m network -q
