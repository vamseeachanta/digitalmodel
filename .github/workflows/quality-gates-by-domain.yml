            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow "$HEAD_REPOSITORY_URL" "$PR_HEAD_SHA"
            fi
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow "$BASE_REPOSITORY_URL" "$tip"
            fi
          fi
          if ! git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
            echo "::error::No merge base between the current base tip and pull request head"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --detach "$tip"
          if ! git merge --no-ff --no-edit "$PR_HEAD_SHA"; then
            echo "::error::Cannot merge the pull request head into the current base tip"
            git merge --abort
            exit 1
          fi
          tested=$(git rev-parse HEAD)
          parent_text=$(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p' | tr '\n' ' ')
          read -r -a parents <<< "$parent_text"
          if [ "${#parents[@]}" -ne 2 ] || [ "${parents[0]:-missing}" != "$tip" ] || \
             [ "${parents[1]:-missing}" != "$PR_HEAD_SHA" ]; then
            echo "::error::Local merge must have exactly the current tip and pull request head as parents"
            exit 1
          fi
          tree=$(git rev-parse 'HEAD^{tree}')
          printf 'tested=%s first_parent=%s second_parent=%s tip=%s event_base=%s tree=%s\n' \
            "$tested" "${parents[0]}" "${parents[1]}" "$tip" "$EVENT_BASE_SHA" "$tree"
          printf 'tip=%s\n' "$tip" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Gmsh runtime libraries
        if: matrix.domain == 'solver-smoke' || matrix.domain == 'specialized'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libglu1-mesa

      - name: Create reports directory
        run: mkdir -p reports

      - name: Read domain gate command
        id: gate
        env:
          GATE_NAME: tests-${{ matrix.domain }}
        run: |
          command=$(uv run --no-sources --with pyyaml==6.0.2 python - <<'PY'
          import os
          import yaml

          with open(".claude/quality-gates.yaml", encoding="utf-8") as handle:
              gates = yaml.safe_load(handle)["gates"]
          print(gates[os.environ["GATE_NAME"]]["command"])
          PY
          )
          {
            echo "command<<EOF"
            echo "$command"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Select trusted register
        if: matrix.domain == 'orcaflex'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python scripts/ci/ci_baseline.py register --out "$RUNNER_TEMP/flaky-register.yml"

      - name: Run domain gate
        id: domain-gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          if [ "${{ matrix.domain }}" = "orcaflex" ]; then
            uv run --no-sources --with pyyaml==6.0.2 python scripts/ci/run_shard.py --register "$RUNNER_TEMP/flaky-register.yml" --mode report --shard ${{ matrix.domain }} --junit reports/junit-${{ matrix.domain }}.xml --max-retry-ids 20 -- ${{ steps.gate.outputs.command }} --junitxml=reports/junit-${{ matrix.domain }}.xml -o junit_family=xunit2
          else
            ${{ steps.gate.outputs.command }} --junitxml=reports/junit-${{ matrix.domain }}.xml -o junit_family=xunit2
          fi
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Run geotechnical solver benchmarks
        if: matrix.domain == 'specialized'
        run: >-
          PYTHONPATH=src uv run --no-sources --with-editable '.[test]'
          --with 'xslope==1.0.3' --with 'gmsh>=4.15'
          python -m pytest tests/geotechnical -q -rA -p no:cacheprovider

      - name: Extract shard result
        if: always()
        env:
          SHARD: ${{ matrix.domain }}
          SHARD_CONCLUSION: ${{ steps.domain-gate.outcome }}
          SHARD_EXIT_CODE: ${{ steps.domain-gate.outputs.code }}
        run: |
          python scripts/ci/ci_baseline.py extract \
            --junit "reports/junit-${SHARD}.xml" --shard "$SHARD" \
            --sha "$GITHUB_SHA" --run "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --conclusion "$SHARD_CONCLUSION" \
            --exit-code "${SHARD_EXIT_CODE:--1}" \
            --out "reports/result-${SHARD}.json"

      - name: Upload domain artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-${{ matrix.domain }}
          path: |
            reports/
            coverage.json
          if-no-files-found: ignore
          retention-days: 30

  domain-tests-required:
    name: Domain test aggregate
    needs: [detect-domains, ci-harness-tests, domain-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report scope of this result
        # States what this check actually covered, so a green aggregate cannot be
        # read as "all shards passed" when only a subset was dispatched (#1863).
        continue-on-error: true
        env:
          SCOPE_LINE: ${{ needs.detect-domains.outputs.scope-line }}
          SELECTED_COUNT: ${{ needs.detect-domains.outputs.selected-count }}
          TOTAL_COUNT: ${{ needs.detect-domains.outputs.total-count }}
          SKIPPED_COUNT: ${{ needs.detect-domains.outputs.skipped-count }}
          SKIPPED_DOMAINS: ${{ needs.detect-domains.outputs.skipped-domains }}
        run: |
          scope="${SCOPE_LINE:-Shard scope: unavailable (scope reporting did not run).}"
          echo "$scope"
          {
            echo "## Scope of this result"
            echo
            echo "$scope"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$SKIPPED_DOMAINS" ]; then
            echo "Shards NOT run in this check: $SKIPPED_DOMAINS"
            {
              echo "A pass here means **${SELECTED_COUNT:-?} of ${TOTAL_COUNT:-?} shards**"
              echo "passed. The other ${SKIPPED_COUNT:-?} were not executed by this run;"
              echo "they run in full on every push to \`main\` and nightly via the"
              echo "\`Full Matrix Sweep\` workflow."
              echo
              echo "Not run: \`${SKIPPED_DOMAINS}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$TOTAL_COUNT" ]; then
            echo "All ${TOTAL_COUNT} shards were dispatched in this run."
            echo "All ${TOTAL_COUNT} shards were dispatched: a pass here covers the whole matrix." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Shard scope could not be determined for this run."
            echo "Shard scope could not be determined for this run; treat a pass as scoped." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout baseline tools
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build and guard local pull request merge
        id: build_merge
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPOSITORY_URL: ${{ github.event.pull_request.base.repo.clone_url }}
          HEAD_REPOSITORY_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git config gc.auto 0
          git config maintenance.auto false
          if [ "$(git rev-parse HEAD)" != "$PR_HEAD_SHA" ]; then
            echo "::error::Checkout does not match the pull request head"
            exit 1
          fi
          base_ref="refs/remotes/base/${BASE_REF}"
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --depth=50 "$BASE_REPOSITORY_URL" "+refs/heads/${BASE_REF}:${base_ref}"
          else
            git fetch --no-tags "$BASE_REPOSITORY_URL" "+refs/heads/${BASE_REF}:${base_ref}"
          fi
          tip=$(git rev-parse "$base_ref")
          for depth in 50 100 200; do
            if git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
              break
            fi
            if [ "$(git rev-parse --is-shallow-repository)" != true ]; then
              break
            fi
            git fetch --no-tags --deepen="$depth" "$HEAD_REPOSITORY_URL" "$PR_HEAD_SHA"
            git fetch --no-tags --deepen="$depth" "$BASE_REPOSITORY_URL" "$tip"
          done
          if ! git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow "$HEAD_REPOSITORY_URL" "$PR_HEAD_SHA"
            fi
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow "$BASE_REPOSITORY_URL" "$tip"
            fi
          fi
          if ! git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
            echo "::error::No merge base between the current base tip and pull request head"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --detach "$tip"
          if ! git merge --no-ff --no-edit "$PR_HEAD_SHA"; then
            echo "::error::Cannot merge the pull request head into the current base tip"
            git merge --abort
            exit 1
          fi
          tested=$(git rev-parse HEAD)
          parent_text=$(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p' | tr '\n' ' ')
          read -r -a parents <<< "$parent_text"
          if [ "${#parents[@]}" -ne 2 ] || [ "${parents[0]:-missing}" != "$tip" ] || \
             [ "${parents[1]:-missing}" != "$PR_HEAD_SHA" ]; then
            echo "::error::Local merge must have exactly the current tip and pull request head as parents"
            exit 1
          fi
          tree=$(git rev-parse 'HEAD^{tree}')
          printf 'tested=%s first_parent=%s second_parent=%s tip=%s event_base=%s tree=%s\n' \
            "$tested" "${parents[0]}" "${parents[1]}" "$tip" "$EVENT_BASE_SHA" "$tree"
          printf 'tip=%s\n' "$tip" >> "$GITHUB_OUTPUT"

      - name: Download domain results
        if: needs.detect-domains.outputs.has-domains == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: quality-gate-*
          path: baseline-results

      - name: Set up comparison runtime
        if: needs.detect-domains.outputs.has-domains == 'true'
        uses: astral-sh/setup-uv@v5

      - name: Enforce required domain result
        if: always()
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          CI_BASELINE_MODE: report
          GH_TOKEN: ${{ github.token }}
          HAS_DOMAINS: ${{ needs.detect-domains.outputs.has-domains }}
          DETECT_RESULT: ${{ needs.detect-domains.result }}
          HARNESS_RESULT: ${{ needs.ci-harness-tests.result }}
          DOMAIN_RESULT: ${{ needs.domain-tests.result }}
        run: |
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "Domain detection did not succeed: $DETECT_RESULT"
            exit 1
          fi

          if [ "$HARNESS_RESULT" != "success" ]; then
            echo "CI harness detector tests did not succeed: $HARNESS_RESULT"
            exit 1
          fi

          if [ "$HAS_DOMAINS" = "true" ]; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              comparison=1
              if python scripts/ci/ci_baseline.py register --out "$RUNNER_TEMP/flaky-register.yml" &&
                uv run --no-project --with pyyaml==6.0.2 python - <<'PYTHON'
          import os
          from pathlib import Path
          from scripts.ci.ci_baseline import download_baseline, gh_json, instant, reconcile_results

          repository = os.environ["GITHUB_REPOSITORY"]
          run = os.environ["GITHUB_RUN_ID"]
          attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          jobs = gh_json(f"repos/{repository}/actions/runs/{run}/attempts/{attempt}/jobs?per_page=100")["jobs"]
          reconcile_results(Path("baseline-results"), jobs, "tests-", os.environ["GITHUB_SHA"], run, attempt)
          aggregate = next(job for job in jobs if job["name"] == "Domain test aggregate")
          Path("baseline-time.txt").write_text(aggregate["started_at"])
          download_baseline(repository, Path("baseline.json"), require_latest=True,
                            now=instant(aggregate["started_at"]))
          PYTHON
              then
                if uv run --no-project --with pyyaml==6.0.2 python scripts/ci/ci_baseline.py compare \
                  --baseline baseline.json --results baseline-results --max-age-hours 24 \
                  --register "$RUNNER_TEMP/flaky-register.yml" \
                  --summary baseline-summary.md --verdict baseline-verdict.json --now "$(cat baseline-time.txt)"; then
                  comparison=0
                else
                  comparison=$?
                fi
                if [ -f baseline-summary.md ]; then
                  cat baseline-summary.md >> "$GITHUB_STEP_SUMMARY"
                fi
              else
                if [ "$CI_BASELINE_MODE" = "report" ]; then
                  echo "baseline unavailable (report mode)"
                fi
              fi
              if [ "$CI_BASELINE_MODE" = "report" ]; then
                echo "Report mode: comparison=$comparison; failed shards still fail the gate."
              elif [ "$CI_BASELINE_MODE" = "enforce" ]; then
                exit "$comparison"
              fi
            fi
            if [ "$DOMAIN_RESULT" != "success" ]; then
              echo "At least one required domain test job failed: $DOMAIN_RESULT"
              exit 1
            fi
          fi

          echo "Required domain test jobs passed."

      - name: Upload baseline comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-comparison
          path: |
            baseline-verdict.json
            baseline-summary.md
          if-no-files-found: ignore
          retention-days: 14
