# Quality Gates by Domain
#
# This workflow is the FAST, touched-domain-gated lane: pull requests and pushes
# dispatch only the shards their diff touches. That scoping is deliberate, but it
# means a green result here says "the shards we ran passed", not "all shards
# passed" (issue #1863). Two things keep that honest:
#
#   1. Every run reports its own scope -- how many shards ran, how many did not,
#      and which -- in the "Detect touched test domains" and "Domain test
#      aggregate" job summaries.
#   2. `.github/workflows/full-matrix-sweep.yml` runs EVERY shard on every push
#      to `main` and nightly, under its own distinct check names. The nightly
#      cron formerly lived here; it moved there so that a full-sweep failure is
#      never posted under the same check names as the gated pull-request lane.
name: Quality Gates by Domain

"on":
  pull_request:
    # All edits rerun gates: filtering jobs to base edits could mask failures with skips.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

jobs:
  detect-domains:
    name: Detect touched test domains
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has-domains: ${{ steps.detect.outputs.has_domains }}
      selected-count: ${{ steps.scope.outputs.selected-count }}
      total-count: ${{ steps.scope.outputs.total-count }}
      skipped-count: ${{ steps.scope.outputs.skipped-count }}
      skipped-domains: ${{ steps.scope.outputs.skipped-domains }}
      scope-line: ${{ steps.scope.outputs.scope-line }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Build and guard local pull request merge
        id: build_merge
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPOSITORY_URL: ${{ github.event.pull_request.base.repo.clone_url }}
          HEAD_REPOSITORY_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git config gc.auto 0
          git config maintenance.auto false
          if [ "$(git rev-parse HEAD)" != "$PR_HEAD_SHA" ]; then
            echo "::error::Checkout does not match the pull request head"
            exit 1
          fi
          base_ref="refs/remotes/base/${BASE_REF}"
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --depth=50 "$BASE_REPOSITORY_URL" "+refs/heads/${BASE_REF}:${base_ref}"
          else
            git fetch --no-tags "$BASE_REPOSITORY_URL" "+refs/heads/${BASE_REF}:${base_ref}"
          fi
          tip=$(git rev-parse "$base_ref")
          for depth in 50 100 200; do
            if git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
              break
            fi
            if [ "$(git rev-parse --is-shallow-repository)" != true ]; then
              break
            fi
            git fetch --no-tags --deepen="$depth" "$HEAD_REPOSITORY_URL" "$PR_HEAD_SHA"
            git fetch --no-tags --deepen="$depth" "$BASE_REPOSITORY_URL" "$tip"
          done
          if ! git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow "$HEAD_REPOSITORY_URL" "$PR_HEAD_SHA"
            fi
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow "$BASE_REPOSITORY_URL" "$tip"
            fi
          fi
          if ! git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
            echo "::error::No merge base between the current base tip and pull request head"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --detach "$tip"
          if ! git merge --no-ff --no-edit "$PR_HEAD_SHA"; then
            echo "::error::Cannot merge the pull request head into the current base tip"
            git merge --abort
            exit 1
          fi
          tested=$(git rev-parse HEAD)
          parent_text=$(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p' | tr '\n' ' ')
          read -r -a parents <<< "$parent_text"
          if [ "${#parents[@]}" -ne 2 ] || [ "${parents[0]:-missing}" != "$tip" ] || \
             [ "${parents[1]:-missing}" != "$PR_HEAD_SHA" ]; then
            echo "::error::Local merge must have exactly the current tip and pull request head as parents"
            exit 1
          fi
          tree=$(git rev-parse 'HEAD^{tree}')
          printf 'tested=%s first_parent=%s second_parent=%s tip=%s event_base=%s tree=%s\n' \
            "$tested" "${parents[0]}" "${parents[1]}" "$tip" "$EVENT_BASE_SHA" "$tree"
          printf 'tip=%s\n' "$tip" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Detect matrix
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ steps.build_merge.outputs.tip }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            matrix=$(uv run --no-sources python scripts/ci/detect_touched_domains.py \
              --mode touched \
              --base "$PR_BASE_SHA" \
              --head "$PR_HEAD_SHA" \
              --domains-file tests/DOMAINS.md \
              --output-format json-matrix)
          elif [ "$EVENT_NAME" = "push" ]; then
            # Route push like PR: touched-domain-only. github.event.before is the
            # all-zero SHA on branch-create and may be pruned after a force-push;
            # --on-missing-base full makes the detector fail SAFE to the full sweep
            # rather than silently skipping every leg.
            matrix=$(uv run --no-sources python scripts/ci/detect_touched_domains.py \
              --mode touched \
              --base "$PUSH_BEFORE_SHA" \
              --head "$PUSH_AFTER_SHA" \
              --on-missing-base full \
              --domains-file tests/DOMAINS.md \
              --output-format json-matrix)
          else
            # workflow_dispatch runs the full sweep on demand. The nightly cron
            # now lives in full-matrix-sweep.yml.
            matrix=$(uv run --no-sources python scripts/ci/detect_touched_domains.py \
              --mode full \
              --domains-file tests/DOMAINS.md \
              --output-format json-matrix)
          fi

          has_domains=$(uv run --no-sources python -c 'import json,sys; print("true" if json.loads(sys.argv[1])["include"] else "false")' "$matrix")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has_domains=$has_domains" >> "$GITHUB_OUTPUT"

      - name: Report shard scope
        id: scope
        # Reporting only -- never gates. Everything new lives inside this step,
        # behind continue-on-error, so scope reporting can never fail a PR or
        # change which shards run. The second detector call (--mode full) is the
        # denominator: the shards that exist, versus the ones dispatched above.
        continue-on-error: true
        env:
          SELECTED_MATRIX: ${{ steps.detect.outputs.matrix }}
          SCOPE_EVENT: ${{ github.event_name }}
        run: |
          FULL_MATRIX=$(uv run --no-sources python scripts/ci/detect_touched_domains.py \
            --mode full \
            --domains-file tests/DOMAINS.md \
            --output-format json-matrix)
          export FULL_MATRIX
          uv run --no-sources python scripts/ci/report_shard_scope.py

  ci-harness-tests:
    name: CI harness and compliance tests
    needs: detect-domains
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build and guard local pull request merge
        id: build_merge
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPOSITORY_URL: ${{ github.event.pull_request.base.repo.clone_url }}
          HEAD_REPOSITORY_URL: ${{ github.event.pull_request.head.repo.clone_url }}
