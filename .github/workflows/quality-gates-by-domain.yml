            fi
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow "$BASE_REPOSITORY_URL" "$tip"
            fi
          fi
          if ! git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
            echo "::error::No merge base between the current base tip and pull request head"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --detach "$tip"
          if ! git merge --no-ff --no-edit "$PR_HEAD_SHA"; then
            echo "::error::Cannot merge the pull request head into the current base tip"
            git merge --abort
            exit 1
          fi
          tested=$(git rev-parse HEAD)
          parent_text=$(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p' | tr '\n' ' ')
          read -r -a parents <<< "$parent_text"
          if [ "${#parents[@]}" -ne 2 ] || [ "${parents[0]:-missing}" != "$tip" ] || \
             [ "${parents[1]:-missing}" != "$PR_HEAD_SHA" ]; then
            echo "::error::Local merge must have exactly the current tip and pull request head as parents"
            exit 1
          fi
          tree=$(git rev-parse 'HEAD^{tree}')
          printf 'tested=%s first_parent=%s second_parent=%s tip=%s event_base=%s tree=%s\n' \
            "$tested" "${parents[0]}" "${parents[1]}" "$tip" "$EVENT_BASE_SHA" "$tree"
          printf 'tip=%s\n' "$tip" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run harness tests
        run: |
          uv run --no-sources --with-editable '.[test]' python -m pytest \
            tests/scripts/test_detect_touched_domains.py \
            tests/scripts/test_reporting_ci_registration.py \
            tests/reporting/test_lifting_lug_module_report.py \
            tests/docs/test_implementation_map.py \
            tests/docs/test_implementation_map_search.py \
            tests/scripts/test_ci_baseline.py \
            tests/scripts/test_run_shard.py \
            tests/contracts/test_flaky_register_schema.py \
            tests/workflows/automation/test_quality_gates.py \
            tests/workflows/test_durable_workflows.py \
            tests/workflows/test_ci_triggers.py \
            -q --tb=line

      - name: Report implementation map staleness
        run: uv run --no-sources python scripts/generate_implementation_map.py

  domain-tests:
    name: tests-${{ matrix.domain }}
    needs: detect-domains
    if: needs.detect-domains.outputs.has-domains == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-domains.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Citation checks read source and map revisions recorded in packs;
          # subsea also verifies a manifest pinned to an older commit.
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build and guard local pull request merge
        id: build_merge
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPOSITORY_URL: ${{ github.event.pull_request.base.repo.clone_url }}
          HEAD_REPOSITORY_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git config gc.auto 0
          git config maintenance.auto false
          if [ "$(git rev-parse HEAD)" != "$PR_HEAD_SHA" ]; then
            echo "::error::Checkout does not match the pull request head"
            exit 1
          fi
          base_ref="refs/remotes/base/${BASE_REF}"
