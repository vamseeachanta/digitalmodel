# Quality Gates by Domain
#
# This workflow is the FAST, touched-domain-gated lane: pull requests and pushes
# dispatch only the shards their diff touches. That scoping is deliberate, but it
# means a green result here says "the shards we ran passed", not "all shards
# passed" (issue #1863). Two things keep that honest:
#
#   1. Every run reports its own scope -- how many shards ran, how many did not,
#      and which -- in the "Detect touched test domains" and "Domain test
#      aggregate" job summaries.
#   2. `.github/workflows/full-matrix-sweep.yml` runs EVERY shard nightly and
#      on manual dispatch, under its own distinct check names. A push to `main`
#      runs the touched domains here. The nightly
#      cron formerly lived here; it moved there so that a full-sweep failure is
#      never posted under the same check names as the gated pull-request lane.
name: Quality Gates by Domain

"on":
  pull_request:
    # "edited" is the only event sent for a base change, which changes the tree
    # under test, so it starts the gates. It also fires on every title or
    # description edit; no gate reads either, and for those every job below is
    # skipped under another name (docs/ci/rerun-rules.md, R2).
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  # A title or description edit gets a group of its own, so its no-op run cancels nothing.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}${{ (github.event.action == 'edited' && !github.event.changes.base) && format('-metadata-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

jobs:
  detect-domains:
    name: "${{ (github.event.action == 'edited' && !github.event.changes.base) && 'Not run for a metadata edit - Detect touched test domains' || 'Detect touched test domains' }}"
    # Draft pull requests wait: detection is skipped, so every job that needs it is
    # skipped too, and the gates start when the pull request is marked ready.
    # A title or description edit ("edited" without a base change) runs no job. The job then
    # takes another name, so its skipped check does not stand in for an earlier result.
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !(github.event.action == 'edited' && !github.event.changes.base) }}
    # Light job on a hosted runner: it only selects shards, and on the self-hosted pool it queued behind them.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has-domains: ${{ steps.detect.outputs.has_domains }}
      selected-count: ${{ steps.scope.outputs.selected-count }}
      total-count: ${{ steps.scope.outputs.total-count }}
      skipped-count: ${{ steps.scope.outputs.skipped-count }}
      skipped-domains: ${{ steps.scope.outputs.skipped-domains }}
      scope-line: ${{ steps.scope.outputs.scope-line }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Build and guard local pull request merge
        id: build_merge
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPOSITORY_URL: ${{ github.event.pull_request.base.repo.clone_url }}
          HEAD_REPOSITORY_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git config gc.auto 0
          git config maintenance.auto false
          if [ "$(git rev-parse HEAD)" != "$PR_HEAD_SHA" ]; then
            echo "::error::Checkout does not match the pull request head"
            exit 1
          fi
          base_ref="refs/remotes/base/${BASE_REF}"
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --depth=50 "$BASE_REPOSITORY_URL" "+refs/heads/${BASE_REF}:${base_ref}"
          else
            git fetch --no-tags "$BASE_REPOSITORY_URL" "+refs/heads/${BASE_REF}:${base_ref}"
          fi
          tip=$(git rev-parse "$base_ref")
          for depth in 50 100 200; do
            if git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
              break
            fi
            if [ "$(git rev-parse --is-shallow-repository)" != true ]; then
              break
            fi
            git fetch --no-tags --deepen="$depth" "$HEAD_REPOSITORY_URL" "$PR_HEAD_SHA"
            git fetch --no-tags --deepen="$depth" "$BASE_REPOSITORY_URL" "$tip"
          done
          if ! git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow "$HEAD_REPOSITORY_URL" "$PR_HEAD_SHA"
            fi
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow "$BASE_REPOSITORY_URL" "$tip"
            fi
          fi
          if ! git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
            echo "::error::No merge base between the current base tip and pull request head"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --detach "$tip"
          if ! git merge --no-ff --no-edit "$PR_HEAD_SHA"; then
            echo "::error::Cannot merge the pull request head into the current base tip"
            git merge --abort
            exit 1
          fi
          tested=$(git rev-parse HEAD)
          parent_text=$(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p' | tr '\n' ' ')
          read -r -a parents <<< "$parent_text"
          if [ "${#parents[@]}" -ne 2 ] || [ "${parents[0]:-missing}" != "$tip" ] || \
             [ "${parents[1]:-missing}" != "$PR_HEAD_SHA" ]; then
            echo "::error::Local merge must have exactly the current tip and pull request head as parents"
            exit 1
          fi
          tree=$(git rev-parse 'HEAD^{tree}')
          printf 'tested=%s first_parent=%s second_parent=%s tip=%s event_base=%s tree=%s\n' \
            "$tested" "${parents[0]}" "${parents[1]}" "$tip" "$EVENT_BASE_SHA" "$tree"
          printf 'tip=%s\n' "$tip" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Detect matrix
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ steps.build_merge.outputs.tip }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Compare from the fork point. Comparing the base tip with the head
            # directly also lists everything the base gained since the fork, so
            # one source merge on the base dispatched every shard for every
            # pull request behind it. The jobs still test the merged tree.
            matrix=$(uv run --no-sources python scripts/ci/detect_touched_domains.py \
              --mode touched \
              --diff-from merge-base \
              --base "$PR_BASE_SHA" \
              --head "$PR_HEAD_SHA" \
              --domains-file tests/DOMAINS.md \
              --output-format json-matrix)
          elif [ "$EVENT_NAME" = "push" ]; then
            # Route push like PR: touched-domain-only. github.event.before is the
            # all-zero SHA on branch-create and may be pruned after a force-push;
            # --on-missing-base full makes the detector fail SAFE to the full sweep
            # rather than silently skipping every leg.
            matrix=$(uv run --no-sources python scripts/ci/detect_touched_domains.py \
              --mode touched \
              --base "$PUSH_BEFORE_SHA" \
              --head "$PUSH_AFTER_SHA" \
              --on-missing-base full \
              --domains-file tests/DOMAINS.md \
              --output-format json-matrix)
          else
            # workflow_dispatch runs the full sweep on demand. The nightly cron
            # now lives in full-matrix-sweep.yml.
            matrix=$(uv run --no-sources python scripts/ci/detect_touched_domains.py \
              --mode full \
              --domains-file tests/DOMAINS.md \
              --output-format json-matrix)
          fi

          has_domains=$(uv run --no-sources python -c 'import json,sys; print("true" if json.loads(sys.argv[1])["include"] else "false")' "$matrix")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has_domains=$has_domains" >> "$GITHUB_OUTPUT"

      - name: Report shard scope
        id: scope
        # Reporting only -- never gates. Everything new lives inside this step,
        # behind continue-on-error, so scope reporting can never fail a PR or
        # change which shards run. The second detector call (--mode full) is the
        # denominator: the shards that exist, versus the ones dispatched above.
        continue-on-error: true
        env:
          SELECTED_MATRIX: ${{ steps.detect.outputs.matrix }}
          SCOPE_EVENT: ${{ github.event_name }}
        run: |
          FULL_MATRIX=$(uv run --no-sources python scripts/ci/detect_touched_domains.py \
            --mode full \
            --domains-file tests/DOMAINS.md \
            --output-format json-matrix)
          export FULL_MATRIX
          uv run --no-sources python scripts/ci/report_shard_scope.py

  ci-harness-tests:
    name: "${{ (github.event.action == 'edited' && !github.event.changes.base) && 'Not run for a metadata edit - CI harness and compliance tests' || 'CI harness and compliance tests' }}"
    # For a title or description edit this job is skipped with the job it needs, and
    # takes another name so that its skipped check replaces no earlier result.
    needs: detect-domains
    # Pull requests run on a GitHub-hosted runner (the repository is public, so the minutes are free);
    # pushes and schedules stay on our own runners. Setting the repository variable
    # DM_PR_RUNNER to self-hosted routes same-repository pull requests back to them.
    runs-on: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && vars.DM_PR_RUNNER == 'self-hosted')) && fromJSON('["self-hosted","Linux"]') || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build and guard local pull request merge
        id: build_merge
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPOSITORY_URL: ${{ github.event.pull_request.base.repo.clone_url }}
          HEAD_REPOSITORY_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git config gc.auto 0
          git config maintenance.auto false
          if [ "$(git rev-parse HEAD)" != "$PR_HEAD_SHA" ]; then
            echo "::error::Checkout does not match the pull request head"
            exit 1
          fi
          base_ref="refs/remotes/base/${BASE_REF}"
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --depth=50 "$BASE_REPOSITORY_URL" "+refs/heads/${BASE_REF}:${base_ref}"
          else
            git fetch --no-tags "$BASE_REPOSITORY_URL" "+refs/heads/${BASE_REF}:${base_ref}"
          fi
          tip=$(git rev-parse "$base_ref")
          for depth in 50 100 200; do
            if git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
              break
            fi
            if [ "$(git rev-parse --is-shallow-repository)" != true ]; then
              break
            fi
            git fetch --no-tags --deepen="$depth" "$HEAD_REPOSITORY_URL" "$PR_HEAD_SHA"
            git fetch --no-tags --deepen="$depth" "$BASE_REPOSITORY_URL" "$tip"
          done
          if ! git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow "$HEAD_REPOSITORY_URL" "$PR_HEAD_SHA"
            fi
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow "$BASE_REPOSITORY_URL" "$tip"
            fi
          fi
          if ! git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
            echo "::error::No merge base between the current base tip and pull request head"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --detach "$tip"
          if ! git merge --no-ff --no-edit "$PR_HEAD_SHA"; then
            echo "::error::Cannot merge the pull request head into the current base tip"
            git merge --abort
            exit 1
          fi
          tested=$(git rev-parse HEAD)
          parent_text=$(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p' | tr '\n' ' ')
          read -r -a parents <<< "$parent_text"
          if [ "${#parents[@]}" -ne 2 ] || [ "${parents[0]:-missing}" != "$tip" ] || \
             [ "${parents[1]:-missing}" != "$PR_HEAD_SHA" ]; then
            echo "::error::Local merge must have exactly the current tip and pull request head as parents"
            exit 1
          fi
          tree=$(git rev-parse 'HEAD^{tree}')
          printf 'tested=%s first_parent=%s second_parent=%s tip=%s event_base=%s tree=%s\n' \
            "$tested" "${parents[0]}" "${parents[1]}" "$tip" "$EVENT_BASE_SHA" "$tree"
          printf 'tip=%s\n' "$tip" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run harness tests
        run: |
          uv run --no-sources --with-editable '.[test]' python -m pytest \
            tests/scripts/test_detect_touched_domains.py \
            tests/scripts/test_src_domain_routes.py \
            tests/scripts/test_select_family_tests.py \
            tests/scripts/test_reporting_ci_registration.py \
            tests/docs/test_implementation_map.py \
            tests/docs/test_implementation_map_search.py \
            tests/scripts/test_ci_baseline.py \
            tests/scripts/test_step_timings.py \
            tests/scripts/test_coverage_gate.py \
            tests/scripts/test_closure_selection.py \
            tests/scripts/test_orphan_tests.py \
            tests/scripts/test_run_shard.py \
            tests/scripts/test_trust_report.py \
            tests/contracts/test_flaky_register_schema.py \
            tests/contracts/test_vba_credit.py \
            tests/workflows/automation/test_quality_gates.py \
            tests/workflows/test_durable_workflows.py \
            tests/workflows/test_ci_triggers.py \
            tests/workflows/test_sweep_parity.py \
            tests/workflows/test_light_checkout.py \
            tests/riser_bom/test_ci.py \
            -q --tb=line

      - name: Report implementation map staleness
        run: uv run --no-sources python scripts/generate_implementation_map.py

  domain-tests:
    name: "${{ (github.event.action == 'edited' && !github.event.changes.base) && 'Not run for a metadata edit - tests' || format('tests-{0}', matrix.domain) }}"
    needs: detect-domains
    # For a title or description edit this job is skipped with the job it needs, and
    # takes another name so that its skipped check replaces no earlier result.
    if: needs.detect-domains.outputs.has-domains == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-domains.outputs.matrix) }}
    steps:
      - name: Choose checkout scope
        id: checkout-scope
        env:
          SHARD: ${{ matrix.domain }}
        run: |
          # docs/domains holds about 1.3 GB of built HTML and solver files. Shards
          # whose tests read no docs/domains path leave it out of the work tree and
          # fetch file contents on demand. Every other shard, and any new one, keeps
          # the full checkout. tests/workflows/test_light_checkout.py checks the list.
          case "$SHARD" in
            citations|field-development|infrastructure-core|misc)
              echo "filter=blob:none" >> "$GITHUB_OUTPUT"
              printf 'sparse-checkout<<EOF\n/*\n!/docs/domains/\nEOF\n' >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Citation checks read source and map revisions recorded in packs;
          # subsea also verifies a manifest pinned to an older commit.
          fetch-depth: 0
          # Empty for a full shard, which leaves the checkout defaults in place.
          filter: ${{ steps.checkout-scope.outputs.filter }}
          sparse-checkout: ${{ steps.checkout-scope.outputs.sparse-checkout }}
          sparse-checkout-cone-mode: false
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build and guard local pull request merge
        id: build_merge
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPOSITORY_URL: ${{ github.event.pull_request.base.repo.clone_url }}
          HEAD_REPOSITORY_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git config gc.auto 0
          git config maintenance.auto false
          if [ "$(git rev-parse HEAD)" != "$PR_HEAD_SHA" ]; then
            echo "::error::Checkout does not match the pull request head"
            exit 1
          fi
          base_ref="refs/remotes/base/${BASE_REF}"
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --depth=50 "$BASE_REPOSITORY_URL" "+refs/heads/${BASE_REF}:${base_ref}"
          else
            git fetch --no-tags "$BASE_REPOSITORY_URL" "+refs/heads/${BASE_REF}:${base_ref}"
          fi
          tip=$(git rev-parse "$base_ref")
          for depth in 50 100 200; do
            if git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
              break
            fi
            if [ "$(git rev-parse --is-shallow-repository)" != true ]; then
              break
            fi
            git fetch --no-tags --deepen="$depth" "$HEAD_REPOSITORY_URL" "$PR_HEAD_SHA"
            git fetch --no-tags --deepen="$depth" "$BASE_REPOSITORY_URL" "$tip"
          done
          if ! git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow "$HEAD_REPOSITORY_URL" "$PR_HEAD_SHA"
            fi
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow "$BASE_REPOSITORY_URL" "$tip"
            fi
          fi
          if ! git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
            echo "::error::No merge base between the current base tip and pull request head"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --detach "$tip"
          if ! git merge --no-ff --no-edit "$PR_HEAD_SHA"; then
            echo "::error::Cannot merge the pull request head into the current base tip"
            git merge --abort
            exit 1
          fi
          tested=$(git rev-parse HEAD)
          parent_text=$(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p' | tr '\n' ' ')
          read -r -a parents <<< "$parent_text"
          if [ "${#parents[@]}" -ne 2 ] || [ "${parents[0]:-missing}" != "$tip" ] || \
             [ "${parents[1]:-missing}" != "$PR_HEAD_SHA" ]; then
            echo "::error::Local merge must have exactly the current tip and pull request head as parents"
            exit 1
          fi
          tree=$(git rev-parse 'HEAD^{tree}')
          printf 'tested=%s first_parent=%s second_parent=%s tip=%s event_base=%s tree=%s\n' \
            "$tested" "${parents[0]}" "${parents[1]}" "$tip" "$EVENT_BASE_SHA" "$tree"
          printf 'tip=%s\n' "$tip" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Node for source locator formatter
        if: matrix.domain == 'contracts'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Provision source locator formatter
        if: matrix.domain == 'contracts'
        run: |
          npm install --prefix "$RUNNER_TEMP/source-locators-formatter" \
            --cache "$RUNNER_TEMP/source-locators-npm-cache" \
            --no-save --no-package-lock --no-audit --no-fund "prettier@4.0.0-alpha.8"
          echo "SOURCE_LOCATORS_PRETTIER=$RUNNER_TEMP/source-locators-formatter/node_modules/.bin/prettier" >> "$GITHUB_ENV"

      - name: Install Gmsh runtime libraries
        if: matrix.domain == 'solver-smoke' || matrix.domain == 'specialized'
        run: dpkg -s libglu1-mesa >/dev/null 2>&1 || (sudo -n apt-get update -qq && sudo -n apt-get install -y -qq libglu1-mesa)

      - name: Create reports directory
        run: mkdir -p reports

      - name: Read domain gate command
        id: gate
        env:
          GATE_NAME: tests-${{ matrix.domain }}
        run: |
          command=$(uv run --no-sources --with pyyaml==6.0.2 python - <<'PY'
          import os
          import yaml

          with open(".claude/quality-gates.yaml", encoding="utf-8") as handle:
              gates = yaml.safe_load(handle)["gates"]
          print(gates[os.environ["GATE_NAME"]]["command"])
          PY
          )
          {
            echo "command<<EOF"
            echo "$command"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Select trusted register
        if: matrix.domain == 'orcaflex'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python scripts/ci/ci_baseline.py register --out "$RUNNER_TEMP/flaky-register.yml"

      - name: Run domain gate
        id: domain-gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          if [ "${{ matrix.domain }}" = "orcaflex" ]; then
            uv run --no-sources --with pyyaml==6.0.2 python scripts/ci/run_shard.py --register "$RUNNER_TEMP/flaky-register.yml" --mode report --shard ${{ matrix.domain }} --junit reports/junit-${{ matrix.domain }}.xml --max-retry-ids 20 -- ${{ steps.gate.outputs.command }} --junitxml=reports/junit-${{ matrix.domain }}.xml -o junit_family=xunit2
          else
            ${{ steps.gate.outputs.command }} --junitxml=reports/junit-${{ matrix.domain }}.xml -o junit_family=xunit2
          fi
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Run geotechnical solver benchmarks
        if: matrix.domain == 'specialized'
        run: bash tests/geotechnical/run_solver_benchmarks.sh

      - name: Extract shard result
        if: always()
        env:
          SHARD: ${{ matrix.domain }}
          SHARD_CONCLUSION: ${{ steps.domain-gate.outcome }}
          SHARD_EXIT_CODE: ${{ steps.domain-gate.outputs.code }}
        run: |
          python scripts/ci/ci_baseline.py extract \
            --junit "reports/junit-${SHARD}.xml" --shard "$SHARD" \
            --sha "$GITHUB_SHA" --run "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --conclusion "$SHARD_CONCLUSION" \
            --exit-code "${SHARD_EXIT_CODE:--1}" \
            --out "reports/result-${SHARD}.json"

      - name: Upload domain artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-${{ matrix.domain }}
          path: |
            reports/
            coverage.json
          if-no-files-found: ignore
          retention-days: 30

  domain-tests-required:
    name: "${{ (github.event.action == 'edited' && !github.event.changes.base) && 'Not run for a metadata edit - Domain test aggregate' || 'Domain test aggregate' }}"
    needs: [detect-domains, ci-harness-tests, domain-tests]
    # A title or description edit ("edited" without a base change) runs no job. The job then
    # takes another name, so its skipped check does not stand in for an earlier result.
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !(github.event.action == 'edited' && !github.event.changes.base) }}
    # Light job on a hosted runner: it reads the results of the jobs above.
    runs-on: ubuntu-latest
    steps:
      - name: Report scope of this result
        # States what this check actually covered, so a green aggregate cannot be
        # read as "all shards passed" when only a subset was dispatched (#1863).
        continue-on-error: true
        env:
          SCOPE_LINE: ${{ needs.detect-domains.outputs.scope-line }}
          SELECTED_COUNT: ${{ needs.detect-domains.outputs.selected-count }}
          TOTAL_COUNT: ${{ needs.detect-domains.outputs.total-count }}
          SKIPPED_COUNT: ${{ needs.detect-domains.outputs.skipped-count }}
          SKIPPED_DOMAINS: ${{ needs.detect-domains.outputs.skipped-domains }}
        run: |
          scope="${SCOPE_LINE:-Shard scope: unavailable (scope reporting did not run).}"
          echo "$scope"
          {
            echo "## Scope of this result"
            echo
            echo "$scope"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$SKIPPED_DOMAINS" ]; then
            echo "Shards NOT run in this check: $SKIPPED_DOMAINS"
            {
              echo "A pass here means **${SELECTED_COUNT:-?} of ${TOTAL_COUNT:-?} shards**"
              echo "passed. The other ${SKIPPED_COUNT:-?} were not executed by this run;"
              echo "every shard runs nightly and on manual dispatch in the"
              echo "\`Full Matrix Sweep\` workflow."
              echo
              echo "Not run: \`${SKIPPED_DOMAINS}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$TOTAL_COUNT" ]; then
            echo "All ${TOTAL_COUNT} shards were dispatched in this run."
            echo "All ${TOTAL_COUNT} shards were dispatched: a pass here covers the whole matrix." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Shard scope could not be determined for this run."
            echo "Shard scope could not be determined for this run; treat a pass as scoped." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout baseline tools
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build and guard local pull request merge
        id: build_merge
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPOSITORY_URL: ${{ github.event.pull_request.base.repo.clone_url }}
          HEAD_REPOSITORY_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git config gc.auto 0
          git config maintenance.auto false
          if [ "$(git rev-parse HEAD)" != "$PR_HEAD_SHA" ]; then
            echo "::error::Checkout does not match the pull request head"
            exit 1
          fi
          base_ref="refs/remotes/base/${BASE_REF}"
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --depth=50 "$BASE_REPOSITORY_URL" "+refs/heads/${BASE_REF}:${base_ref}"
          else
            git fetch --no-tags "$BASE_REPOSITORY_URL" "+refs/heads/${BASE_REF}:${base_ref}"
          fi
          tip=$(git rev-parse "$base_ref")
          for depth in 50 100 200; do
            if git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
              break
            fi
            if [ "$(git rev-parse --is-shallow-repository)" != true ]; then
              break
            fi
            git fetch --no-tags --deepen="$depth" "$HEAD_REPOSITORY_URL" "$PR_HEAD_SHA"
            git fetch --no-tags --deepen="$depth" "$BASE_REPOSITORY_URL" "$tip"
          done
          if ! git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow "$HEAD_REPOSITORY_URL" "$PR_HEAD_SHA"
            fi
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow "$BASE_REPOSITORY_URL" "$tip"
            fi
          fi
          if ! git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
            echo "::error::No merge base between the current base tip and pull request head"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --detach "$tip"
          if ! git merge --no-ff --no-edit "$PR_HEAD_SHA"; then
            echo "::error::Cannot merge the pull request head into the current base tip"
            git merge --abort
            exit 1
          fi
          tested=$(git rev-parse HEAD)
          parent_text=$(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p' | tr '\n' ' ')
          read -r -a parents <<< "$parent_text"
          if [ "${#parents[@]}" -ne 2 ] || [ "${parents[0]:-missing}" != "$tip" ] || \
             [ "${parents[1]:-missing}" != "$PR_HEAD_SHA" ]; then
            echo "::error::Local merge must have exactly the current tip and pull request head as parents"
            exit 1
          fi
          tree=$(git rev-parse 'HEAD^{tree}')
          printf 'tested=%s first_parent=%s second_parent=%s tip=%s event_base=%s tree=%s\n' \
            "$tested" "${parents[0]}" "${parents[1]}" "$tip" "$EVENT_BASE_SHA" "$tree"
          printf 'tip=%s\n' "$tip" >> "$GITHUB_OUTPUT"

      - name: Download domain results
        if: needs.detect-domains.outputs.has-domains == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: quality-gate-*
          path: baseline-results

      - name: Set up comparison runtime
        if: needs.detect-domains.outputs.has-domains == 'true'
        uses: astral-sh/setup-uv@v5

      - name: Enforce required domain result
        if: always()
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          CI_BASELINE_MODE: report
          GH_TOKEN: ${{ github.token }}
          HAS_DOMAINS: ${{ needs.detect-domains.outputs.has-domains }}
          DETECT_RESULT: ${{ needs.detect-domains.result }}
          HARNESS_RESULT: ${{ needs.ci-harness-tests.result }}
          DOMAIN_RESULT: ${{ needs.domain-tests.result }}
        run: |
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "Domain detection did not succeed: $DETECT_RESULT"
            exit 1
          fi

          if [ "$HARNESS_RESULT" != "success" ]; then
            echo "CI harness detector tests did not succeed: $HARNESS_RESULT"
            exit 1
          fi

          if [ "$HAS_DOMAINS" = "true" ]; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              comparison=1
              if python scripts/ci/ci_baseline.py register --out "$RUNNER_TEMP/flaky-register.yml" &&
                uv run --no-project --with pyyaml==6.0.2 python - <<'PYTHON'
          import os
          from pathlib import Path
          from scripts.ci.ci_baseline import download_baseline, gh_json, instant, reconcile_results

          repository = os.environ["GITHUB_REPOSITORY"]
          run = os.environ["GITHUB_RUN_ID"]
          attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          jobs = gh_json(f"repos/{repository}/actions/runs/{run}/attempts/{attempt}/jobs?per_page=100")["jobs"]
          reconcile_results(Path("baseline-results"), jobs, "tests-", os.environ["GITHUB_SHA"], run, attempt)
          aggregate = next(job for job in jobs if job["name"] == "Domain test aggregate")
          Path("baseline-time.txt").write_text(aggregate["started_at"])
          download_baseline(repository, Path("baseline.json"), require_latest=True,
                            now=instant(aggregate["started_at"]))
          PYTHON
              then
                if uv run --no-project --with pyyaml==6.0.2 python scripts/ci/ci_baseline.py compare \
                  --baseline baseline.json --results baseline-results --max-age-hours 24 \
                  --register "$RUNNER_TEMP/flaky-register.yml" \
                  --summary baseline-summary.md --verdict baseline-verdict.json --now "$(cat baseline-time.txt)"; then
                  comparison=0
                else
                  comparison=$?
                fi
                if [ -f baseline-summary.md ]; then
                  cat baseline-summary.md >> "$GITHUB_STEP_SUMMARY"
                fi
              else
                if [ "$CI_BASELINE_MODE" = "report" ]; then
                  echo "baseline unavailable (report mode)"
                fi
              fi
              if [ "$CI_BASELINE_MODE" = "report" ]; then
                echo "Report mode: comparison=$comparison; failed shards still fail the gate."
              elif [ "$CI_BASELINE_MODE" = "enforce" ]; then
                exit "$comparison"
              fi
            fi
            if [ "$DOMAIN_RESULT" != "success" ]; then
              echo "At least one required domain test job failed: $DOMAIN_RESULT"
              exit 1
            fi
          fi

          echo "Required domain test jobs passed."

      - name: Upload baseline comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-comparison
          path: |
            baseline-verdict.json
            baseline-summary.md
          if-no-files-found: ignore
          retention-days: 14

  # Fast gate in shadow (decision A3). Advisory: no job needs it except the
  # agreement record below, and no required check names it. The test step
  # records the verdict instead of failing, so a test failure does not turn the
  # job red. The job can neither block nor pass a pull request.
  # Selection: scripts/ci/fast_gate.py and tests/OWNERS.toml.
  fast-gate-shadow:
    name: "${{ (github.event.action == 'edited' && !github.event.changes.base) && 'Not run for a metadata edit - fast-gate (shadow)' || 'fast-gate (shadow)' }}"
    # Skipped with the job it needs for drafts and for title or description edits.
    needs: detect-domains
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build and guard local pull request merge
        id: build_merge
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPOSITORY_URL: ${{ github.event.pull_request.base.repo.clone_url }}
          HEAD_REPOSITORY_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git config gc.auto 0
          git config maintenance.auto false
          if [ "$(git rev-parse HEAD)" != "$PR_HEAD_SHA" ]; then
            echo "::error::Checkout does not match the pull request head"
            exit 1
          fi
          base_ref="refs/remotes/base/${BASE_REF}"
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --depth=50 "$BASE_REPOSITORY_URL" "+refs/heads/${BASE_REF}:${base_ref}"
          else
            git fetch --no-tags "$BASE_REPOSITORY_URL" "+refs/heads/${BASE_REF}:${base_ref}"
          fi
          tip=$(git rev-parse "$base_ref")
          for depth in 50 100 200; do
            if git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
              break
            fi
            if [ "$(git rev-parse --is-shallow-repository)" != true ]; then
              break
            fi
            git fetch --no-tags --deepen="$depth" "$HEAD_REPOSITORY_URL" "$PR_HEAD_SHA"
            git fetch --no-tags --deepen="$depth" "$BASE_REPOSITORY_URL" "$tip"
          done
          if ! git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow "$HEAD_REPOSITORY_URL" "$PR_HEAD_SHA"
            fi
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow "$BASE_REPOSITORY_URL" "$tip"
            fi
          fi
          if ! git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
            echo "::error::No merge base between the current base tip and pull request head"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --detach "$tip"
          if ! git merge --no-ff --no-edit "$PR_HEAD_SHA"; then
            echo "::error::Cannot merge the pull request head into the current base tip"
            git merge --abort
            exit 1
          fi
          tested=$(git rev-parse HEAD)
          parent_text=$(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p' | tr '\n' ' ')
          read -r -a parents <<< "$parent_text"
          if [ "${#parents[@]}" -ne 2 ] || [ "${parents[0]:-missing}" != "$tip" ] || \
             [ "${parents[1]:-missing}" != "$PR_HEAD_SHA" ]; then
            echo "::error::Local merge must have exactly the current tip and pull request head as parents"
            exit 1
          fi
          tree=$(git rev-parse 'HEAD^{tree}')
          printf 'tested=%s first_parent=%s second_parent=%s tip=%s event_base=%s tree=%s\n' \
            "$tested" "${parents[0]}" "${parents[1]}" "$tip" "$EVENT_BASE_SHA" "$tree"
          printf 'tip=%s\n' "$tip" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        if: github.event_name == 'pull_request'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Select test files from tests/OWNERS.toml
        id: select
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ steps.build_merge.outputs.tip }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p reports/fast-gate
          uv run --no-project --with pyyaml==6.0.2 python scripts/ci/fast_gate.py select \
            --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" --out reports/fast-gate/selection.json

      - name: Set up Node for source locator formatter
        if: steps.select.outputs.node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Provision source locator formatter
        if: steps.select.outputs.node == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/source-locators-formatter" \
            --cache "$RUNNER_TEMP/source-locators-npm-cache" \
            --no-save --no-package-lock --no-audit --no-fund "prettier@4.0.0-alpha.8"
          echo "SOURCE_LOCATORS_PRETTIER=$RUNNER_TEMP/source-locators-formatter/node_modules/.bin/prettier" >> "$GITHUB_ENV"

      - name: Install Gmsh runtime libraries
        if: steps.select.outputs.gmsh == 'true'
        run: dpkg -s libglu1-mesa >/dev/null 2>&1 || (sudo -n apt-get update -qq && sudo -n apt-get install -y -qq libglu1-mesa)

      - name: Run selected test files in one job
        if: github.event_name == 'pull_request'
        env:
          EXTRAS: ${{ steps.select.outputs.extras }}
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-sources --with "assetutilities @ git+https://github.com/${GITHUB_REPOSITORY%/*}/assetutilities.git@main" \
            --with-editable ".[${EXTRAS}]" python scripts/ci/fast_gate.py run \
            --selection reports/fast-gate/selection.json \
            --junit reports/fast-gate/junit.xml --out reports/fast-gate/result.json

      - name: Upload fast gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-gate-shadow
          path: reports/fast-gate/
          if-no-files-found: ignore
          retention-days: 30

  fast-gate-shadow-agreement:
    name: "${{ (github.event.action == 'edited' && !github.event.changes.base) && 'Not run for a metadata edit - fast-gate (shadow) agreement' || 'fast-gate (shadow) agreement' }}"
    # Records the fast gate's verdict beside the domain matrix's verdict for the same
    # head. Advisory like the job above; nothing needs this job.
    needs: [detect-domains, domain-tests, fast-gate-shadow]
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && !(github.event.action == 'edited' && !github.event.changes.base) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shadow tools
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: scripts/ci

      - name: Build and guard local pull request merge
        id: build_merge
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPOSITORY_URL: ${{ github.event.pull_request.base.repo.clone_url }}
          HEAD_REPOSITORY_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git config gc.auto 0
          git config maintenance.auto false
          if [ "$(git rev-parse HEAD)" != "$PR_HEAD_SHA" ]; then
            echo "::error::Checkout does not match the pull request head"
            exit 1
          fi
          base_ref="refs/remotes/base/${BASE_REF}"
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --depth=50 "$BASE_REPOSITORY_URL" "+refs/heads/${BASE_REF}:${base_ref}"
          else
            git fetch --no-tags "$BASE_REPOSITORY_URL" "+refs/heads/${BASE_REF}:${base_ref}"
          fi
          tip=$(git rev-parse "$base_ref")
          for depth in 50 100 200; do
            if git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
              break
            fi
            if [ "$(git rev-parse --is-shallow-repository)" != true ]; then
              break
            fi
            git fetch --no-tags --deepen="$depth" "$HEAD_REPOSITORY_URL" "$PR_HEAD_SHA"
            git fetch --no-tags --deepen="$depth" "$BASE_REPOSITORY_URL" "$tip"
          done
          if ! git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow "$HEAD_REPOSITORY_URL" "$PR_HEAD_SHA"
            fi
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow "$BASE_REPOSITORY_URL" "$tip"
            fi
          fi
          if ! git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
            echo "::error::No merge base between the current base tip and pull request head"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --detach "$tip"
          if ! git merge --no-ff --no-edit "$PR_HEAD_SHA"; then
            echo "::error::Cannot merge the pull request head into the current base tip"
            git merge --abort
            exit 1
          fi
          tested=$(git rev-parse HEAD)
          parent_text=$(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p' | tr '\n' ' ')
          read -r -a parents <<< "$parent_text"
          if [ "${#parents[@]}" -ne 2 ] || [ "${parents[0]:-missing}" != "$tip" ] || \
             [ "${parents[1]:-missing}" != "$PR_HEAD_SHA" ]; then
            echo "::error::Local merge must have exactly the current tip and pull request head as parents"
            exit 1
          fi
          tree=$(git rev-parse 'HEAD^{tree}')
          printf 'tested=%s first_parent=%s second_parent=%s tip=%s event_base=%s tree=%s\n' \
            "$tested" "${parents[0]}" "${parents[1]}" "$tip" "$EVENT_BASE_SHA" "$tree"
          printf 'tip=%s\n' "$tip" >> "$GITHUB_OUTPUT"

      - name: Download fast gate result
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: fast-gate-shadow
          path: fast-gate

      - name: Record verdict agreement
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FAST_RESULT: ${{ needs.fast-gate-shadow.result }}
          MATRIX_RESULT: ${{ needs.domain-tests.result }}
          HAS_DOMAINS: ${{ needs.detect-domains.outputs.has-domains }}
          MATRIX: ${{ needs.detect-domains.outputs.matrix }}
        run: |
          python3 scripts/ci/fast_gate.py agree \
            --selection fast-gate/selection.json --result fast-gate/result.json \
            --event "$EVENT_NAME" --pull-request "$PR_NUMBER" --head-sha "$PR_HEAD_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --fast-result "$FAST_RESULT" --matrix-result "$MATRIX_RESULT" \
            --has-domains "$HAS_DOMAINS" --matrix "$MATRIX" \
            --out fast-gate/shadow-verdict.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload verdict agreement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-gate-shadow-verdict
          path: fast-gate/shadow-verdict.json
          if-no-files-found: ignore
          retention-days: 30
