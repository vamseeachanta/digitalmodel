# Full Matrix Sweep (issue #1863)
#
# `Quality Gates by Domain` dispatches only the shards a change touches, so an
# untouched-but-broken shard reports nothing rather than red and `main` can show
# green indefinitely. This workflow is the counterweight: it runs EVERY domain
# shard, ignoring touched-domain detection entirely, on
#
#   * every push to `main`  -> main's green is earned, not assumed
#   * a nightly cron        -> drift is caught within a day even without merges
#   * manual dispatch       -> on-demand "what is the true state of the matrix?"
#
# Job names here are deliberately distinct from the PR-gating workflow's
# (`sweep-tests-*` / `Full matrix sweep result` vs `tests-*` / `Domain test
# aggregate`) so a diagnostic sweep failure is never confused with, and can
# never be mistaken for, a required pull-request context.
name: Full Matrix Sweep

"on":
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # Each sweep keeps a separate group because cancelled runs publish no baseline.
  group: full-matrix-sweep-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  full-matrix:
    name: Build full shard matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      total: ${{ steps.matrix.outputs.total }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build matrix
        id: matrix
        run: |
          matrix=$(uv run --no-sources python scripts/ci/detect_touched_domains.py \
            --mode full \
            --domains-file tests/DOMAINS.md \
            --output-format json-matrix)
          total=$(uv run --no-sources python -c 'import json,sys; print(len(json.loads(sys.argv[1])["include"]))' "$matrix")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          {
            echo "## Full matrix sweep"
            echo
            echo "Dispatching all $total domain shards (no touched-domain gating)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the matrix is empty
        env:
          TOTAL: ${{ steps.matrix.outputs.total }}
        run: |
          if [ "$TOTAL" -lt 1 ]; then
            echo "Full matrix is empty; tests/DOMAINS.md parsed to zero domains."
            exit 1
          fi
          echo "Full matrix contains $TOTAL shards."

  sweep-tests:
    name: sweep-tests-${{ matrix.domain }}
    needs: full-matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.full-matrix.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Citation checks read source and map revisions recorded in packs;
          # subsea also verifies a manifest pinned to an older commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Gmsh runtime libraries
        if: matrix.domain == 'solver-smoke'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libglu1-mesa

      - name: Create reports directory
        run: mkdir -p reports

      - name: Read domain gate command
        id: gate
        env:
          GATE_NAME: tests-${{ matrix.domain }}
        run: |
          command=$(uv run --no-sources --with pyyaml==6.0.2 python - <<'PY'
          import os
          import yaml

          with open(".claude/quality-gates.yaml", encoding="utf-8", newline="\n") as handle:
              gates = yaml.safe_load(handle)["gates"]
          command = gates[os.environ["GATE_NAME"]]["command"]
          if os.environ["GATE_NAME"] == "tests-infrastructure-core" and "tests/uncertainty/" not in command.split():
              command += " tests/uncertainty/"
          print(command)
          PY
          )
          {
            echo "command<<EOF"
            echo "$command"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Select trusted register
        if: matrix.domain == 'orcaflex'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python scripts/ci/ci_baseline.py register --out "$RUNNER_TEMP/flaky-register.yml"

      - name: Run domain gate
        id: domain-gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          if [ "${{ matrix.domain }}" = "orcaflex" ]; then
            uv run --no-sources --with pyyaml==6.0.2 python scripts/ci/run_shard.py --register "$RUNNER_TEMP/flaky-register.yml" --mode report --shard ${{ matrix.domain }} --junit reports/junit-${{ matrix.domain }}.xml --max-retry-ids 20 -- ${{ steps.gate.outputs.command }} --junitxml=reports/junit-${{ matrix.domain }}.xml -o junit_family=xunit2
          else
            ${{ steps.gate.outputs.command }} --junitxml=reports/junit-${{ matrix.domain }}.xml -o junit_family=xunit2
          fi
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Extract shard result
        if: always()
        env:
          SHARD: ${{ matrix.domain }}
          SHARD_CONCLUSION: ${{ steps.domain-gate.outcome }}
          SHARD_EXIT_CODE: ${{ steps.domain-gate.outputs.code }}
        run: |
          python scripts/ci/ci_baseline.py extract \
            --junit "reports/junit-${SHARD}.xml" --shard "$SHARD" \
            --sha "$GITHUB_SHA" --run "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --conclusion "$SHARD_CONCLUSION" \
            --exit-code "${SHARD_EXIT_CODE:--1}" \
            --out "reports/result-${SHARD}.json"

      - name: Upload domain artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-sweep-${{ matrix.domain }}
          path: |
            reports/
            coverage.json
          if-no-files-found: ignore
          retention-days: 30

  sweep-result:
    name: Full matrix sweep result
    needs: [full-matrix, sweep-tests]
    permissions:
      contents: read
      actions: read
      issues: write
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize shard results
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TOTAL: ${{ needs.full-matrix.outputs.total }}
        run: |
          {
            echo "## Full matrix sweep result"
            echo
            echo "Every shard in tests/DOMAINS.md was dispatched ($TOTAL total)."
            echo
            echo "| Shard | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          # tee so the per-shard table is in the job log too, not only the
          # rendered summary -- `gh run view` then shows the true matrix state.
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | select(.name | startswith("sweep-tests-")) | "| \(.name) | \(.conclusion // .status) |"' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Checkout baseline tools
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v4

      - name: Download sweep results
        if: github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v4
        with:
          pattern: full-sweep-*
          path: baseline-results

      - name: Publish main baseline
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          from scripts.ci.ci_baseline import download_baseline, gh_json, publish, reconcile_results

          repository = os.environ["GITHUB_REPOSITORY"]
          run = os.environ["GITHUB_RUN_ID"]
          attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          jobs = gh_json(f"repos/{repository}/actions/runs/{run}/attempts/{attempt}/jobs?per_page=100")["jobs"]
          results = Path("baseline-results")
          reconcile_results(results, jobs, "sweep-tests-", os.environ["GITHUB_SHA"], run, attempt)
          previous = Path("previous-baseline.json")
          found = download_baseline(repository, previous)
          publish(results, str(previous) if found else "none", Path("baseline.json"))
          PYTHON

      - name: Upload main baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: main-baseline
          path: baseline.json
          if-no-files-found: error
          retention-days: 14

      - name: Update main health
        continue-on-error: true
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            function healthWriteOrder(body, runNumber) {
              const marker = (body || '').match(/^<!-- main-health-order: run_number=(\d+) run_id=\d+ sha=[0-9a-f]+ -->$/m);
              const storedRunNumber = marker ? Number(marker[1]) : null;
              return {storedRunNumber, skip: storedRunNumber !== null && storedRunNumber > runNumber};
            }
            const fs = require('fs');
            const baseline = JSON.parse(fs.readFileSync('baseline.json', 'utf8'));
            const previous = fs.existsSync('previous-baseline.json')
              ? JSON.parse(fs.readFileSync('previous-baseline.json', 'utf8'))
              : {tests: {}};
            const {owner, repo} = context.repo;
            const title = `main-health: ${repo}`;
            const issues = await github.paginate(github.rest.issues.listForRepo,
              {owner, repo, state: 'all', labels: 'main-health', per_page: 100});
            const issue = issues.find(item => item.title === title && !item.pull_request);
            const order = healthWriteOrder(issue?.body, context.runNumber);
            if (order.skip) {
              core.notice(`Skipping main-health update for run ${context.runNumber}; stored run ${order.storedRunNumber} is newer.`);
              return;
            }
            const active = Object.entries(baseline.tests);
            const resolved = Object.entries(previous.tests).filter(([id, row]) =>
              !baseline.tests[id] && baseline.shards[row.shard]?.parsed === true &&
              ['success', 'failure'].includes(baseline.shards[row.shard]?.conclusion));
            const cell = value => String(value).replaceAll('|', '&#124;').replaceAll('\n', ' ');
            const lines = [`<!-- main-health-order: run_number=${context.runNumber} run_id=${context.runId} sha=${context.sha} -->`,
              'Main test failures by exact test id.', '',
              '| Test id | Shard | First seen run | Last seen run | Status |',
              '| --- | --- | --- | --- | --- |'];
            for (const [id, row] of active.slice(0, 200)) {
              lines.push(`| ${cell(id)} | ${cell(row.shard)} | ${row.first_seen_run} | ${row.run_id} | Open |`);
            }
            for (const [id, row] of resolved.slice(0, Math.max(0, 200 - active.length))) {
              lines.push(`| ${cell(id)} | ${cell(row.shard)} | ${row.first_seen_run} | ${row.run_id} | Resolved |`);
            }
            lines.push('', `Showing at most 200 of ${active.length + resolved.length} failure records.`);
            const uncertain = Object.entries(baseline.shards).filter(([id, row]) =>
              row.parsed !== true || !['success', 'failure'].includes(row.conclusion) ||
              (row.conclusion === 'failure' && !active.some(([node, record]) => record.shard === id)));
            if (uncertain.length) lines.push('', 'Incomplete shard evidence: ' + uncertain.map(([id]) => cell(id)).join(', '));
            const state = active.length || uncertain.length ? 'open' : 'closed';
            const body = lines.join('\n');
            if (issue) {
              await github.rest.issues.update({owner, repo, issue_number: issue.number, body, state});
            } else if (state === 'open') {
              const labels = await github.paginate(github.rest.issues.listLabelsForRepo, {owner, repo, per_page: 100});
              if (!labels.some(label => label.name === 'main-health')) {
                await github.rest.issues.createLabel({owner, repo, name: 'main-health', color: 'b60205'});
              }
              await github.rest.issues.create({owner, repo, title, body, labels: ['main-health']});
            }

      - name: Enforce full sweep result
        env:
          MATRIX_RESULT: ${{ needs.full-matrix.result }}
          SWEEP_RESULT: ${{ needs.sweep-tests.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "Full matrix construction did not succeed: $MATRIX_RESULT"
            exit 1
          fi

          if [ "$SWEEP_RESULT" != "success" ]; then
            echo "At least one shard failed in the full sweep: $SWEEP_RESULT"
            echo "See the per-shard table in this job's summary."
            exit 1
          fi

          echo "All domain shards passed the full sweep."
