# Quality Gates CI/CD Workflow
name: Quality Gates

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: full-quality-gates-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality-gates-aggregate:
    name: Run Quality Gates
    permissions: {}
    needs: quality-gates
    if: always()
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","Linux"]') }}
    steps:
      - name: Verify matrix result
        env:
          QUALITY_GATES_RESULT: ${{ needs.quality-gates.result }}
        run: test "$QUALITY_GATES_RESULT" = success

  quality-gates:
    name: Quality Gates (Python ${{ matrix.python-version }})
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","Linux"]') }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0  # need history so the abs-path guard can diff vs base

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        id: install_dependencies
        run: |
          uv venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          UV_NO_SOURCES=true uv pip install -e .
          uv pip install pytest pytest-cov ruff bandit pyyaml loguru click

      - name: Check engineering register changes
        # Full runs cover prose from every commit since the previous batch.
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          python scripts/enforcement/check-engineering-register.py docs/ src/ | tee reports/engineering-register.log

      # Preserve quality evidence after prose failure without running after failed setup.
      - name: Create reports directory
        if: ${{ !cancelled() && steps.install_dependencies.outcome == 'success' }}
        run: mkdir -p reports

      - name: Run Quality Gates
        if: ${{ !cancelled() && steps.install_dependencies.outcome == 'success' }}
        run: |
          set +e
          python -m digitalmodel.workflows.automation.quality_gates_cli check --json
          gate_status=$?
          # Retain every lint location, beyond the summary report's first ten.
          ruff check src/ --output-format=json > reports/ruff_report.json
          lint_status=$?
          if [ "$lint_status" -gt 1 ]; then
            exit "$lint_status"
          fi
          exit "$gate_status"
        continue-on-error: false

      - name: Upload quality gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-results-${{ matrix.python-version }}
          path: |
            reports/quality_gates_results.json
            reports/engineering-register.log
            reports/ruff_report.json
            reports/bandit_report.json
            reports/quality-gates-pytest-full.log
            coverage.json
          retention-days: 30

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
          retention-days: 30
