# Quality Gates CI/CD Workflow
name: Quality Gates

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.run_id) || github.event_name == 'schedule' && format('-{0}', github.run_id) || github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  quality-gates-aggregate:
    name: Run Quality Gates
    permissions: {}
    needs: quality-gates
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify matrix result
        env:
          QUALITY_GATES_RESULT: ${{ needs.quality-gates.result }}
        run: test "$QUALITY_GATES_RESULT" = success

  quality-gates:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Quality Gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0  # need history so the abs-path guard can diff vs base

      - name: Build and guard local pull request merge
        id: build_merge
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPOSITORY_URL: ${{ github.event.pull_request.base.repo.clone_url }}
          HEAD_REPOSITORY_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git config gc.auto 0
          git config maintenance.auto false
          if [ "$(git rev-parse HEAD)" != "$PR_HEAD_SHA" ]; then
            echo "::error::Checkout does not match the pull request head"
            exit 1
          fi
          base_ref="refs/remotes/base/${BASE_REF}"
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --depth=50 "$BASE_REPOSITORY_URL" "+refs/heads/${BASE_REF}:${base_ref}"
          else
            git fetch --no-tags "$BASE_REPOSITORY_URL" "+refs/heads/${BASE_REF}:${base_ref}"
          fi
          tip=$(git rev-parse "$base_ref")
          for depth in 50 100 200; do
            if git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
              break
            fi
            if [ "$(git rev-parse --is-shallow-repository)" != true ]; then
              break
            fi
            git fetch --no-tags --deepen="$depth" "$HEAD_REPOSITORY_URL" "$PR_HEAD_SHA"
            git fetch --no-tags --deepen="$depth" "$BASE_REPOSITORY_URL" "$tip"
          done
          if ! git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow "$HEAD_REPOSITORY_URL" "$PR_HEAD_SHA"
            fi
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow "$BASE_REPOSITORY_URL" "$tip"
            fi
          fi
          if ! git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
            echo "::error::No merge base between the current base tip and pull request head"
            exit 1
          fi
          git config user.name "CI"
          git config user.email "$(printf '%s@%s' 'ci' 'example.invalid')"
          git checkout --detach "$tip"
          if ! git merge --no-ff --no-edit "$PR_HEAD_SHA"; then
            echo "::error::Cannot merge the pull request head into the current base tip"
            git merge --abort
            exit 1
          fi
          tested=$(git rev-parse HEAD)
          parent_text=$(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p' | tr '\n' ' ')
          read -r -a parents <<< "$parent_text"
          if [ "${#parents[@]}" -ne 2 ] || [ "${parents[0]:-missing}" != "$tip" ] || \
             [ "${parents[1]:-missing}" != "$PR_HEAD_SHA" ]; then
            echo "::error::Local merge must have exactly the current tip and pull request head as parents"
            exit 1
          fi
          tree=$(git rev-parse 'HEAD^{tree}')
          printf 'tested=%s first_parent=%s second_parent=%s tip=%s event_base=%s tree=%s\n' \
            "$tested" "${parents[0]}" "${parents[1]}" "$tip" "$EVENT_BASE_SHA" "$tree"
          printf 'tip=%s\n' "$tip" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          UV_NO_SOURCES=true uv pip install -e .
          uv pip install pytest pytest-cov ruff bandit pyyaml loguru click

      - name: Check engineering register changes
        env:
          # Manual runs check the selected revision against its first parent;
          # fetch-depth: 0 above provides that parent, including merge history.
          REGISTER_BASE: ${{ github.event_name == 'pull_request' && steps.build_merge.outputs.tip || github.event_name == 'workflow_dispatch' && 'HEAD^' || github.event.before }}
        run: |
          set -euo pipefail
          test -n "$REGISTER_BASE"
          python scripts/enforcement/check-engineering-register.py --diff "$REGISTER_BASE"

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Quality Gates
        run: |
          python -m digitalmodel.workflows.automation.quality_gates_cli check --json
        continue-on-error: false

      - name: Upload quality gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-results-${{ matrix.python-version }}
          path: |
            reports/quality_gates_results.json
            reports/bandit_report.json
            reports/quality-gates-pytest-full.log
            coverage.json
          retention-days: 30

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            try {
              const results = JSON.parse(fs.readFileSync('reports/quality_gates_results.json', 'utf8'));

              const statusEmoji = {
                'pass': '✅',
                'warning': '⚠️',
                'failure': '❌',
                'skipped': '⏭️'
              };

              let comment = '## Quality Gates Report\n\n';
              comment += `**Overall Status:** ${statusEmoji[results.overall_status]} ${results.overall_status.toUpperCase()}\n\n`;
              comment += `**Summary:**\n`;
              comment += `- ✅ Passed: ${results.gates_passed}\n`;
              comment += `- ⚠️ Warned: ${results.gates_warned}\n`;
              comment += `- ❌ Failed: ${results.gates_failed}\n`;
              comment += `- ⏭️ Skipped: ${results.gates_skipped}\n\n`;
              comment += `**Gate Results:**\n\n`;

              results.results.forEach(result => {
                comment += `### ${statusEmoji[result.status]} ${result.gate_name}\n`;
                comment += `${result.message}\n\n`;

                if (Object.keys(result.metrics).length > 0) {
                  comment += '**Metrics:**\n';
                  for (const [key, value] of Object.entries(result.metrics)) {
                    comment += `- ${key}: ${typeof value === 'number' ? value.toFixed(2) : value}\n`;
                  }
                  comment += '\n';
                }
              });

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.error('Failed to post comment:', error);
            }
