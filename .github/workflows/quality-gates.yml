# Quality Gates CI/CD Workflow
name: Quality Gates

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  quality-gates-aggregate:
    name: Run Quality Gates
    permissions: {}
    needs: quality-gates
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify matrix result
        env:
          QUALITY_GATES_RESULT: ${{ needs.quality-gates.result }}
        run: test "$QUALITY_GATES_RESULT" = success

  quality-gates:
    name: Quality Gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Resolve current pull request merge
        id: resolve_merge
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          attempts=${MERGE_RESOLVE_ATTEMPTS:-10}
          delay=${MERGE_RESOLVE_DELAY:-6}
          for ((attempt=1; attempt<=attempts; attempt++)); do
            tip=$(gh api "repos/${REPOSITORY}/git/ref/heads/${BASE_REF}" --jq .object.sha)
            pull=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")
            mergeable=$(jq -r '.mergeable' <<< "$pull")
            sha=$(jq -r '.merge_commit_sha // empty' <<< "$pull")
            if [ "$mergeable" = false ] || [ -z "$sha" ]; then
              echo "::error::Pull request is not mergeable or has no merge commit: tip=$tip head=$PR_HEAD_SHA merge=$sha"
              exit 1
            fi
            parent_text=$(gh api "repos/${REPOSITORY}/commits/${sha}" --jq '.parents | map(.sha) | join(" ")')
            read -r -a parents <<< "$parent_text"
            if [ "${#parents[@]}" -eq 2 ] && [ "${parents[0]}" = "$tip" ] && [ "${parents[1]}" = "$PR_HEAD_SHA" ]; then
              printf 'sha=%s\ntip=%s\nhead=%s\n' "$sha" "$tip" "$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              sleep "$delay"
            fi
          done
          echo "::error::No matching merge after $attempts attempts: tip=$tip head=$PR_HEAD_SHA merge=$sha parents=$parent_text"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_merge.outputs.sha || github.sha }}
          fetch-depth: 0  # need history so the abs-path guard can diff vs base

      - name: Guard tested merge identity
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          MERGE_SHA: ${{ steps.resolve_merge.outputs.sha }}
          BASE_TIP: ${{ steps.resolve_merge.outputs.tip }}
          PR_HEAD_SHA: ${{ steps.resolve_merge.outputs.head }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          tested=$(git rev-parse HEAD)
          parent_text=$(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p' | tr '\n' ' ')
          read -r -a parents <<< "$parent_text"
          tree=$(git rev-parse 'HEAD^{tree}')
          printf 'tested=%s first_parent=%s second_parent=%s tip=%s event_base=%s tree=%s\n' \
            "$tested" "${parents[0]:-missing}" "${parents[1]:-missing}" "$BASE_TIP" "$EVENT_BASE_SHA" "$tree"
          if [ "$tested" != "$MERGE_SHA" ] || [ "${#parents[@]}" -ne 2 ] || \
             [ "${parents[0]:-missing}" != "$BASE_TIP" ] || [ "${parents[1]:-missing}" != "$PR_HEAD_SHA" ]; then
            echo "::error::Tested merge identity mismatch: expected=$MERGE_SHA tip=$BASE_TIP head=$PR_HEAD_SHA tested=$tested parents=$parent_text"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          UV_NO_SOURCES=true uv pip install -e .
          uv pip install pytest pytest-cov ruff bandit pyyaml loguru click

      - name: Check engineering register changes
        env:
          REGISTER_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || github.event.before }}
        run: python scripts/enforcement/check-engineering-register.py --diff "$REGISTER_BASE"

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Quality Gates
        run: |
          python -m digitalmodel.workflows.automation.quality_gates_cli check --json
        continue-on-error: false

      - name: Upload quality gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-results-${{ matrix.python-version }}
          path: |
            reports/quality_gates_results.json
            reports/bandit_report.json
            reports/quality-gates-pytest-full.log
            coverage.json
          retention-days: 30

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            try {
              const results = JSON.parse(fs.readFileSync('reports/quality_gates_results.json', 'utf8'));

              const statusEmoji = {
                'pass': '✅',
                'warning': '⚠️',
                'failure': '❌',
                'skipped': '⏭️'
              };

              let comment = '## Quality Gates Report\n\n';
              comment += `**Overall Status:** ${statusEmoji[results.overall_status]} ${results.overall_status.toUpperCase()}\n\n`;
              comment += `**Summary:**\n`;
              comment += `- ✅ Passed: ${results.gates_passed}\n`;
              comment += `- ⚠️ Warned: ${results.gates_warned}\n`;
              comment += `- ❌ Failed: ${results.gates_failed}\n`;
              comment += `- ⏭️ Skipped: ${results.gates_skipped}\n\n`;
              comment += `**Gate Results:**\n\n`;

              results.results.forEach(result => {
                comment += `### ${statusEmoji[result.status]} ${result.gate_name}\n`;
                comment += `${result.message}\n\n`;

                if (Object.keys(result.metrics).length > 0) {
                  comment += '**Metrics:**\n';
                  for (const [key, value] of Object.entries(result.metrics)) {
                    comment += `- ${key}: ${typeof value === 'number' ? value.toFixed(2) : value}\n`;
                  }
                  comment += '\n';
                }
              });

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.error('Failed to post comment:', error);
            }
