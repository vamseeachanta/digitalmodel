# Quality Gates -- the fast pull-request lint gate (maintainer ruling, 28 Oct 2026).
#
# Required check "Run Quality Gates" = lint only: engineering-register check on
# changed prose plus ruff on changed Python files, failing only on findings the
# pull request adds (scripts/ci/lint_changed.py). Minutes, not hours.
#
# The full quality-gates CLI (documentation, coverage, bandit, both Python
# versions) moved to the "Main full run" workflow (full-matrix-sweep.yml), which
# our own cron dispatches once a day on main. No push or schedule trigger here.
name: Quality Gates

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality-gates-aggregate:
    name: Run Quality Gates
    permissions: {}
    needs: quality-gates
    if: always()
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","Linux"]') }}
    steps:
      - name: Verify lint result
        env:
          QUALITY_GATES_RESULT: ${{ needs.quality-gates.result }}
        run: test "$QUALITY_GATES_RESULT" = success

  quality-gates:
    name: Lint changed files
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","Linux"]') }}
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0  # need history so the lint and register checks can diff vs base

      - name: Build and guard local pull request merge
        id: build_merge
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPOSITORY_URL: ${{ github.event.pull_request.base.repo.clone_url }}
          HEAD_REPOSITORY_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git config gc.auto 0
          git config maintenance.auto false
          if [ "$(git rev-parse HEAD)" != "$PR_HEAD_SHA" ]; then
            echo "::error::Checkout does not match the pull request head"
            exit 1
          fi
          base_ref="refs/remotes/base/${BASE_REF}"
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --depth=50 "$BASE_REPOSITORY_URL" "+refs/heads/${BASE_REF}:${base_ref}"
          else
            git fetch --no-tags "$BASE_REPOSITORY_URL" "+refs/heads/${BASE_REF}:${base_ref}"
          fi
          tip=$(git rev-parse "$base_ref")
          for depth in 50 100 200; do
            if git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
              break
            fi
            if [ "$(git rev-parse --is-shallow-repository)" != true ]; then
              break
            fi
            git fetch --no-tags --deepen="$depth" "$HEAD_REPOSITORY_URL" "$PR_HEAD_SHA"
            git fetch --no-tags --deepen="$depth" "$BASE_REPOSITORY_URL" "$tip"
          done
          if ! git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow "$HEAD_REPOSITORY_URL" "$PR_HEAD_SHA"
            fi
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow "$BASE_REPOSITORY_URL" "$tip"
            fi
          fi
          if ! git merge-base "$tip" "$PR_HEAD_SHA" >/dev/null; then
            echo "::error::No merge base between the current base tip and pull request head"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --detach "$tip"
          if ! git merge --no-ff --no-edit "$PR_HEAD_SHA"; then
            echo "::error::Cannot merge the pull request head into the current base tip"
            git merge --abort
            exit 1
          fi
          tested=$(git rev-parse HEAD)
          parent_text=$(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p' | tr '\n' ' ')
          read -r -a parents <<< "$parent_text"
          if [ "${#parents[@]}" -ne 2 ] || [ "${parents[0]:-missing}" != "$tip" ] || \
             [ "${parents[1]:-missing}" != "$PR_HEAD_SHA" ]; then
            echo "::error::Local merge must have exactly the current tip and pull request head as parents"
            exit 1
          fi
          tree=$(git rev-parse 'HEAD^{tree}')
          printf 'tested=%s first_parent=%s second_parent=%s tip=%s event_base=%s tree=%s\n' \
            "$tested" "${parents[0]}" "${parents[1]}" "$tip" "$EVENT_BASE_SHA" "$tree"
          printf 'tip=%s\n' "$tip" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check engineering register changes
        env:
          REGISTER_BASE: ${{ github.event_name == 'pull_request' && steps.build_merge.outputs.tip || github.event.before }}
        run: python scripts/enforcement/check-engineering-register.py --diff "$REGISTER_BASE"

      - name: Lint changed Python files (new findings only)
        env:
          LINT_BASE: ${{ steps.build_merge.outputs.tip }}
        run: uv run --no-project --with ruff==0.6.9 python scripts/ci/lint_changed.py --base "$LINT_BASE"
