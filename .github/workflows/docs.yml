name: Build API Docs

on:
  push:
    branches: [main]
    # The generated-HTML freshness check regenerates docs/api/** from the
    # generators, so it has to fire when a generator or a generator input
    # changes -- not only when a page does (#1888).
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'docs/api/**'
      - 'assets/logo/**'
      - 'atlases/**'
      - 'data/**'
      - 'tests/asset_integrity/test_data/**'
      - 'tests/drilling_riser/fixtures/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'docs/api/**'
      - 'assets/logo/**'
      - 'atlases/**'
      - 'data/**'
      - 'tests/asset_integrity/test_data/**'
      - 'tests/drilling_riser/fixtures/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Brand token guard
        run: python scripts/brand_guard.py

      - name: Generated HTML freshness
        run: python scripts/check_generated_html.py --check

      - name: Build docs
        env:
          UV_NO_SOURCES: "true"
        run: uv run --group docs mkdocs build --strict
