name: Build API Docs

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'docs/api/**'
      - 'atlases/**'
      - 'assets/logo/digitalmodel_logo_compact.svg'
      - 'tests/drilling_riser/fixtures/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'docs/api/**'
      - 'atlases/**'
      - 'assets/logo/digitalmodel_logo_compact.svg'
      - 'tests/drilling_riser/fixtures/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install documentation dependencies
        env:
          UV_NO_SOURCES: "true"
        run: uv sync --group docs

      - name: Brand token guard
        run: .venv/bin/python scripts/brand_guard.py

      - name: Check generated HTML freshness
        run: .venv/bin/python scripts/check_generated_html.py --check

      - name: Build docs
        run: .venv/bin/python -m mkdocs build --strict
