name: Build API Docs

on:
  push:
    branches: [main]
    # The generated-HTML freshness check regenerates docs/api/** from the
    # generators, so it has to fire when a generator or a generator input
    # changes -- not only when a page does (#1888).
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'docs/api/**'
      - 'docs/standards/**'
      - 'docs/domains/**'
      - 'tests/repo_structure/**'
      - 'config/markdown-link-check.json'
      - 'assets/logo/**'
      - 'atlases/**'
      - 'data/**'
      - 'tests/asset_integrity/test_data/**'
      - 'tests/drilling_riser/fixtures/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'docs/api/**'
      - 'docs/standards/**'
      - 'docs/domains/**'
      - 'tests/repo_structure/**'
      - 'config/markdown-link-check.json'
      - 'assets/logo/**'
      - 'atlases/**'
      - 'data/**'
      - 'tests/asset_integrity/test_data/**'
      - 'tests/drilling_riser/fixtures/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Brand token guard
        run: python scripts/brand_guard.py

      - name: Validate docs routing
        run: >-
          uv run --no-project --with pytest --with pytest-asyncio --with pyyaml
          python -m pytest tests/docs/test_digitalmodel_routing_contract.py
          -q -p no:cacheprovider --basetemp="$RUNNER_TEMP/docs-routing-tests"

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Validate structure standard links
        # Keep the version aligned with the configured markdown-link-check hook.
        run: >-
          npx --yes markdown-link-check@3.11.2
          --config config/markdown-link-check.json docs/standards/repo-structure.md

      # Runs inside the project environment, not the bare interpreter: the
      # generators import numpy, scipy, pandas, matplotlib, pydantic and yaml
      # transitively through src/digitalmodel, all of which are already declared
      # in [project] dependencies. Taking the set from there rather than listing
      # packages here is what stops this step drifting from what the generators
      # actually need. Same --group docs as the build step below, so one
      # environment is resolved and reused.
      - name: Generated HTML freshness
        env:
          UV_NO_SOURCES: "true"
        run: uv run --group docs python scripts/check_generated_html.py --check

      - name: Build docs
        env:
          UV_NO_SOURCES: "true"
        run: uv run --group docs mkdocs build --strict
