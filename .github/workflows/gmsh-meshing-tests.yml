name: Gmsh and OpenFOAM Bridge Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "src/digitalmodel/solvers/gmsh_meshing/**"
      - "src/digitalmodel/solvers/openfoam/**"
      - "tests/solvers/gmsh_meshing/**"
      - "tests/solvers/openfoam/**"
      - "tests/scripts/test_cfd_python_install.py"
      - "tests/scripts/test_dispatch_cfd_run.py"
      - "tests/scripts/test_synthetic_tank_3d_smoke.py"
      - "scripts/cfd/run_synthetic_tank_3d_smoke.py"
      - "scripts/setup/dispatch-cfd-run.py"
      - "scripts/setup/provision-cfd-box.sh"
      - "scripts/setup/verify-cfd-box.sh"
      - "examples/cfd/synthetic_l_tank/input.yml"
      - "docs/api/cfd/synthetic-l-tank-smoke.json"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/gmsh-meshing-tests.yml"
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "src/digitalmodel/solvers/gmsh_meshing/**"
      - "src/digitalmodel/solvers/openfoam/**"
      - "tests/solvers/gmsh_meshing/**"
      - "tests/solvers/openfoam/**"
      - "tests/scripts/test_cfd_python_install.py"
      - "tests/scripts/test_dispatch_cfd_run.py"
      - "tests/scripts/test_synthetic_tank_3d_smoke.py"
      - "scripts/cfd/run_synthetic_tank_3d_smoke.py"
      - "scripts/setup/dispatch-cfd-run.py"
      - "scripts/setup/provision-cfd-box.sh"
      - "scripts/setup/verify-cfd-box.sh"
      - "examples/cfd/synthetic_l_tank/input.yml"
      - "docs/api/cfd/synthetic-l-tank-smoke.json"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/gmsh-meshing-tests.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: repos/digitalmodel
    steps:
      - name: Resolve current pull request merge
        id: resolve_merge
        if: github.event_name == 'pull_request'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          attempts=${MERGE_RESOLVE_ATTEMPTS:-10}
          delay=${MERGE_RESOLVE_DELAY:-6}
          for ((attempt=1; attempt<=attempts; attempt++)); do
            tip=$(gh api "repos/${REPOSITORY}/git/ref/heads/${BASE_REF}" --jq .object.sha)
            pull=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")
            mergeable=$(jq -r '.mergeable' <<< "$pull")
            sha=$(jq -r '.merge_commit_sha // empty' <<< "$pull")
            if [ "$mergeable" = false ] || [ -z "$sha" ]; then
              echo "::error::Pull request is not mergeable or has no merge commit: tip=$tip head=$PR_HEAD_SHA merge=$sha"
              exit 1
            fi
            parent_text=$(gh api "repos/${REPOSITORY}/commits/${sha}" --jq '.parents | map(.sha) | join(" ")')
            read -r -a parents <<< "$parent_text"
            if [ "${#parents[@]}" -eq 2 ] && [ "${parents[0]}" = "$tip" ] && [ "${parents[1]}" = "$PR_HEAD_SHA" ]; then
              printf 'sha=%s\ntip=%s\nhead=%s\n' "$sha" "$tip" "$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              sleep "$delay"
            fi
          done
          echo "::error::No matching merge after $attempts attempts: tip=$tip head=$PR_HEAD_SHA merge=$sha parents=$parent_text"
          exit 1

      - name: Checkout digitalmodel
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_merge.outputs.sha || github.sha }}
          path: repos/digitalmodel
          persist-credentials: false

      - name: Guard tested merge identity
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          MERGE_SHA: ${{ steps.resolve_merge.outputs.sha }}
          BASE_TIP: ${{ steps.resolve_merge.outputs.tip }}
          PR_HEAD_SHA: ${{ steps.resolve_merge.outputs.head }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          tested=$(git rev-parse HEAD)
          parent_text=$(git cat-file -p HEAD | sed -n '1,/^$/s/^parent //p' | tr '\n' ' ')
          read -r -a parents <<< "$parent_text"
          tree=$(git rev-parse 'HEAD^{tree}')
          printf 'tested=%s first_parent=%s second_parent=%s tip=%s event_base=%s tree=%s\n' \
            "$tested" "${parents[0]:-missing}" "${parents[1]:-missing}" "$BASE_TIP" "$EVENT_BASE_SHA" "$tree"
          if [ "$tested" != "$MERGE_SHA" ] || [ "${#parents[@]}" -ne 2 ] || \
             [ "${parents[0]:-missing}" != "$BASE_TIP" ] || [ "${parents[1]:-missing}" != "$PR_HEAD_SHA" ]; then
            echo "::error::Tested merge identity mismatch: expected=$MERGE_SHA tip=$BASE_TIP head=$PR_HEAD_SHA tested=$tested parents=$parent_text"
            exit 1
          fi

      - name: Checkout pinned assetutilities sibling
        uses: actions/checkout@v4
        with:
          repository: vamseeachanta/assetutilities
          ref: 993f1b5ddc90b56ecf531bedb1b84f5efe096700
          path: repos/assetutilities
          persist-credentials: false

      - name: Verify assetutilities identity
        run: |
          test "$(git -C ../assetutilities rev-parse HEAD)" = \
            "993f1b5ddc90b56ecf531bedb1b84f5efe096700"
          test "$(git -C ../assetutilities rev-parse 'HEAD^{tree}')" = \
            "5f7434fcb3a348a7e04bf9de228e6ce2c49a87cb"

      - name: Install pinned actionlint
        run: >-
          go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca

      - name: Lint workflow syntax
        run: |
          "$(go env GOPATH)/bin/actionlint" .github/workflows/gmsh-meshing-tests.yml

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Gmsh runtime libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libglu1-mesa

      - name: Sync locked environment
        run: uv sync --frozen --extra cfd --extra test

      - name: Verify Gmsh import
        run: >-
          uv run --frozen --extra cfd python -c
          'import gmsh; assert gmsh.__version__ == "4.15.1"'

      - name: Validate committed smoke evidence
        run: >-
          uv run --frozen --extra cfd python -m digitalmodel.solvers.openfoam.smoke_evidence docs/api/cfd/synthetic-l-tank-smoke.json

      - name: Run bridge tests
        run: |
          uv run --frozen --extra cfd --extra test pytest -q \
            tests/solvers/gmsh_meshing/test_tank_fixture.py \
            tests/solvers/openfoam/test_poly_mesh_contract.py \
            tests/solvers/openfoam/test_gmsh_bridge.py \
            tests/solvers/openfoam/test_runner.py \
            tests/solvers/openfoam/test_runner_prebuilt.py \
            tests/solvers/openfoam/test_smoke.py \
            tests/solvers/openfoam/validation/test_sloshing_3d.py \
            tests/scripts/test_cfd_python_install.py \
            tests/scripts/test_dispatch_cfd_run.py \
            tests/scripts/test_synthetic_tank_3d_smoke.py

      - name: Lint bridge paths
        run: |
          uv run --frozen --extra cfd ruff check \
            src/digitalmodel/solvers/gmsh_meshing/_msh2_contract.py \
            src/digitalmodel/solvers/gmsh_meshing/_tank_fixture_gmsh.py \
            src/digitalmodel/solvers/gmsh_meshing/tank_fixture.py \
            src/digitalmodel/solvers/openfoam/gmsh_bridge.py \
            src/digitalmodel/solvers/openfoam/poly_mesh_contract.py \
            src/digitalmodel/solvers/openfoam/prebuilt_mesh.py \
            src/digitalmodel/solvers/openfoam/runner.py \
            src/digitalmodel/solvers/openfoam/smoke.py \
            src/digitalmodel/solvers/openfoam/validation/sloshing_3d.py \
            scripts/cfd/run_synthetic_tank_3d_smoke.py \
            scripts/setup/dispatch-cfd-run.py \
            tests/solvers/gmsh_meshing/test_tank_fixture.py \
            tests/solvers/openfoam/test_poly_mesh_contract.py \
            tests/solvers/openfoam/test_gmsh_bridge.py \
            tests/solvers/openfoam/test_runner_prebuilt.py \
            tests/solvers/openfoam/test_smoke.py \
            tests/scripts/test_cfd_python_install.py \
            tests/scripts/test_dispatch_cfd_run.py \
            tests/scripts/test_synthetic_tank_3d_smoke.py
