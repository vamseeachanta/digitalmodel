name: Repository Structure

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Only pull request updates cancel superseded runs.
# GitHub Actions workflow syntax, concurrency (unversioned):
# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# PR_GATE_RUNNER accepts self-hosted-arm64; unset/unknown values keep hosted defaults.
# Fork pull requests always stay on hosted runners.
jobs:
  repo-structure:
    name: Repository structure contract
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.PR_GATE_RUNNER == 'self-hosted-arm64' && fromJSON('["self-hosted","Linux","ARM64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - name: Validate repository structure
        run: >-
          uv run --no-project --with pyyaml python
          scripts/maintenance/verify_repo_structure.py
          --repo . --config config/repo_structure.yml
      - name: Test structure contract and enforcement
        run: >-
          uv run --no-project --with pytest --with pytest-asyncio --with pyyaml
          python -m pytest tests/repo_structure
          -q -p no:cacheprovider --basetemp="$RUNNER_TEMP/repo-structure-tests"
