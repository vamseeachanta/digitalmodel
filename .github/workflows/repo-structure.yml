name: Repository Structure

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# Read-only checks can stop superseded runs within the same workflow/ref.
# GitHub Actions workflow syntax, concurrency (unversioned):
# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo-structure:
    name: Repository structure contract
    # No paths filter: a file added anywhere can break the structure contract.
    # Draft pull requests wait: the gates start when the pull request is marked ready.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    # Pull requests run on a GitHub-hosted runner (the repository is public, so the minutes are free);
    # pushes and schedules stay on our own runners. Setting the repository variable
    # DM_PR_RUNNER to self-hosted routes same-repository pull requests back to them.
    runs-on: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && vars.DM_PR_RUNNER == 'self-hosted')) && fromJSON('["self-hosted","Linux"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - name: Validate repository structure
        run: >-
          uv run --no-project --with pyyaml python
          scripts/maintenance/verify_repo_structure.py
          --repo . --config config/repo_structure.yml
      - name: Test structure contract and enforcement
        run: >-
          uv run --no-project --with pytest --with pytest-asyncio --with pyyaml
          python -m pytest tests/repo_structure
          -q -p no:cacheprovider --basetemp="$RUNNER_TEMP/repo-structure-tests"
