name: Workflow Automation Tests

on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'src/digitalmodel/workflows/workflow_automation/**'
      - 'tests/workflows/workflow_automation/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.coveragerc'
      - 'pytest.ini'
      - '.github/workflows/workflow-automation-tests.yml'
  pull_request:
    paths:
      - '.github/workflows/workflow-automation-tests.yml'
      - 'src/digitalmodel/workflows/workflow_automation/**'
      - 'tests/workflows/workflow_automation/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.coveragerc'
      - 'pytest.ini'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Create virtual environment
      run: |
        uv venv --python "${{ matrix.python-version }}"

    - name: Install dependencies
      run: |
        uv pip install --no-sources -e ".[dev,test]"

    - name: Run workflow automation tests
      run: |
        uv run --no-sync pytest tests/workflows/workflow_automation/ -v --cov=digitalmodel.workflows.workflow_automation --cov-config=pyproject.toml --cov-fail-under=0 --cov-report=xml --cov-report=term

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        flags: workflow-automation
        name: workflow-automation-coverage

    - name: Test CLI commands
      if: ${{ !cancelled() }}
      run: |
        uv run --no-sync workflow-automation list

    - name: Verify package installation
      if: ${{ !cancelled() }}
      run: |
        uv run --no-sync python -c "from digitalmodel.workflows.workflow_automation import WorkflowOrchestrator, CompleteRiserAnalysisWorkflow; print('Workflow automation module installed')"

    - name: Enforce coverage threshold
      if: ${{ !cancelled() }}
      run: |
        uv run --no-sync coverage report --rcfile=pyproject.toml
