name: Workflow Automation Tests

on:
  push:
    paths:
      - 'src/digitalmodel/workflows/workflow_automation/**'
      - 'tests/workflows/workflow_automation/**'
      - '.github/workflows/workflow-automation-tests.yml'
  pull_request:
    paths:
      - 'src/digitalmodel/workflows/workflow_automation/**'
      - 'tests/workflows/workflow_automation/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# PR_GATE_RUNNER accepts self-hosted-arm64; unset/unknown values keep hosted defaults.
# Fork pull requests always stay on hosted runners.
jobs:
  test:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.PR_GATE_RUNNER == 'self-hosted-arm64' && fromJSON('["self-hosted","Linux","ARM64"]') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || matrix.os) }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Create virtual environment
      run: |
        uv venv --python "${{ matrix.python-version }}"

    - name: Install dependencies
      run: |
        uv pip install --no-sources -e ".[dev]"

    - name: Run workflow automation tests
      run: |
        uv run --no-sync pytest tests/workflows/workflow_automation/ -v --cov=digitalmodel.workflows.workflow_automation --cov-report=xml --cov-report=term

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        flags: workflow-automation
        name: workflow-automation-coverage

    - name: Test CLI commands
      run: |
        uv run --no-sync workflow-automation list

    - name: Verify package installation
      run: |
        uv run --no-sync python -c "from digitalmodel.workflows.workflow_automation import WorkflowOrchestrator, CompleteRiserAnalysisWorkflow; print('Workflow automation module installed')"
