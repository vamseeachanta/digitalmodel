catalog_id: synthetic-steel-shapes
owner: digitalmodel
synthetic: true
readiness_status: tests-only
intended_use: Software tests of nominal geometry, lookup and unit conversion only.
publication: Hand-written synthetic test profiles
origin: The committed sample is synthetic and was written by hand for testing. It is not derived from any publisher table.
real_values: Real values come only from a file the user obtains from the publisher and imports locally under the publisher's terms. Nothing imported is committed.
redistribution: The repository redistributes no publisher data.
publisher_url: https://www.aisc.org/aisc/publications/steel-construction-manual/aisc-shapes-database-v160/
naming_rule: All synthetic canonical names and aliases begin with SYN-. Normalisation preserves this prefix; these names cannot collide with publisher catalogue designations. SYN-METRIC- names are test aliases, not publisher metric names.
units: Dimensions are hand-selected round inch values. Geometry in mm is computed with exactly 25.4 mm per inch; area scales by 25.4 squared.
properties:
  dimensions: Eight plausible profiles were made up independently for the eight supported section families, without copying or perturbing publisher rows.
  area: Each stored square-inch area is _construct_geometry(library, family, dimensions).geom.area from digitalmodel.steel_shapes, using sectionproperties 3.10.2. The polygon area is stored without display rounding.
  other_properties: No weight, inertia, capacity, material or other unsupported tabulated property is supplied.
geometry_basis:
  W: Parallel-flange I-section; root radius kdes-tf, n_r=16.
  HP: Bearing-pile I-section; same constructor and root-radius rule as W, n_r=16.
  S: Tapered-flange I-section; approximate slope 2/12, mid-outstand tf, sharp toes, n_r=16.
  C: Tapered-flange channel; same approximate slope and tangency construction as S, n_r=16.
  L: Equal-leg angle; root radius kdes-t, sharp toes, n_r=16.
  HSS_RECT: Rectangular hollow section; outer corner radius 2*t, inner radius t, n_r=16.
  HSS_ROUND: Circular hollow section; outside diameter d, wall t, 64 polygon segments.
  PIPE: Circular hollow section; same constructor as round HSS, 64 polygon segments.
  taper_derivation: 's=2/12; alpha=atan(s) in degrees; tf_root=tf+s*outstand/2; r=(kdes-tf_root)/(sqrt(1+s*s)-s). The radius is not fitted to area.'
limitations: Synthetic area agreement verifies model self-consistency only. S/C geometry emits an approximation warning; original rolled-profile validation remains required for real sections. The importer has been exercised only on synthetic workbooks, never on the publisher's real file.
