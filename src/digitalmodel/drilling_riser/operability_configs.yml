# Generic drilling-riser operability configurations (#1283, epic #1279 child E).
#
# The categorical `config` axis of the drilling_riser_operability atlas. Each
# entry is a GENERIC, public, BANDED configuration — NOT a client rig/field.
# Governance (T2): tokens are from the reviewed allowlist in
# operability_atlas.ALLOWED_TOKENS; every numeric constant is on a coarse public
# band grid (operability_atlas.BAND_GRID) so no real project depth/tension can be
# fingerprinted (k-anonymity: each band is shared by many real assets). The
# criteria are the published standard factors (API RP 16Q flex-joint operating
# limits; API STD 2RD von-Mises design factor) — public values, not a licensed
# table.
provenance:
  source: synthetic / generic — nominal banded riser configurations for a public operability screening atlas
  licence: synthetic — no client, field, well or vendor data
  standards:
    - {id: API-RP-16Q, edition: "1993"}
    - {id: API-STD-2RD, edition: "2e-2013"}
  note: >
    Generic nominal configurations (nominal 21-in riser, 500 m water-depth bands,
    coarse MN tension bands). No real project values. Criteria are the published
    public standard factors.

# Public standard-factor criteria (same for every config here; API RP 16Q 2/4 deg
# flex-joint operating limits, API STD 2RD 0.67 von-Mises design factor).
criteria:
  flexjoint_angle_mean_deg: 2.0
  flexjoint_angle_max_deg: 4.0
  von_mises_design_factor: 0.67

# Continuous sweep axes (banded knots). offset % of water depth; surface current m/s.
axes:
  offset_pct: [0.0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.25, 2.5, 2.75, 3.0, 3.25, 3.5, 3.75, 4.0, 4.25, 4.5, 4.75, 5.0, 5.25, 5.5, 5.75, 6.0, 6.25, 6.5, 6.75, 7.0, 7.25, 7.5, 7.75, 8.0, 8.25, 8.5, 8.75, 9.0, 9.25, 9.5, 9.75, 10.0]
  current_speed_mps: [0.0, 0.0625, 0.125, 0.1875, 0.25, 0.3125, 0.375, 0.4375, 0.5, 0.5625, 0.625, 0.6875, 0.75, 0.8125, 0.875, 0.9375, 1.0, 1.0625, 1.125, 1.1875, 1.25, 1.3125, 1.375, 1.4375, 1.5, 1.5625, 1.625, 1.6875, 1.75, 1.8125, 1.875, 1.9375, 2.0]

# Generic banded stack-ups. section = nominal riser OD/wt (m); water_depth/length (m);
# tension (N); rig limits (m). If a moonpool_half_min_m is given it must be > 0.5 (DEFAULT_MOONPOOL_CLEARANCE_MARGIN_M); omitted here (see operability_atlas.governing_utilisation).
stackups:
  rsu_a:
    outer_diameter_m: 0.5334      # nominal 21 in
    wall_thickness_m: 0.0254      # nominal 1 in
    water_depth_m: 1500.0         # 500 m band
    length_m: 1500.0
    tension_n: 3000000.0        # 0.5 MN band
    tj_stroke_m: 12.0
  rsu_b:
    outer_diameter_m: 0.5334
    wall_thickness_m: 0.0254
    water_depth_m: 2000.0
    length_m: 2000.0
    tension_n: 4000000.0        # 0.5 MN band
    tj_stroke_m: 15.0

# The (stackup x mode) product forms the categorical config tokens "{stackup}__{mode}".
modes: [drilling, connected, hang_off]
