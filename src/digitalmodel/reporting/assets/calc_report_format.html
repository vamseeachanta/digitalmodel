<!-- ABOUTME: Vendored presentation layer for the standard calculation report. -->
<!-- ABOUTME: Shared CSS + scrollspy; keeps every report visually identical. -->
<style>
  /* ============================ TOKENS ============================ */
  :root{
    --paper:#f5f7f7; --surface:#ffffff; --surface-2:#eef2f2;
    --ink:#0d2230; --ink-2:#3f5563; --ink-muted:#6b8291; --hairline:#d8e0e2;
    --sea:#0d2a36; --sea-ink:#eaf2f2;
    --cfd:#009B84; --ro:#2563C9; --proj:#D9820A;
    --cfd-soft:rgba(0,155,132,.12); --ro-soft:rgba(37,99,201,.12); --proj-soft:rgba(217,130,10,.14);
    --good:#0f9d6b; --pend:#D9820A;
    --shadow:0 1px 2px rgba(13,34,48,.05), 0 8px 28px -12px rgba(13,34,48,.18);
    --maxw:1080px;
    --mono:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#0a1a22; --surface:#0f2530; --surface-2:#132e3a;
      --ink:#e8f0f0; --ink-2:#a9c0c8; --ink-muted:#7593a0; --hairline:#1e3a45;
      --sea:#081419; --sea-ink:#eaf2f2;
      --cfd:#12A38C; --ro:#5B8DEF; --proj:#BC8024;
      --cfd-soft:rgba(18,163,140,.16); --ro-soft:rgba(91,141,239,.16); --proj-soft:rgba(188,128,36,.18);
      --good:#37c08a; --pend:#e0a13a;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="light"]{
    --paper:#f5f7f7; --surface:#ffffff; --surface-2:#eef2f2;
    --ink:#0d2230; --ink-2:#3f5563; --ink-muted:#6b8291; --hairline:#d8e0e2;
    --sea:#0d2a36; --sea-ink:#eaf2f2;
    --cfd:#009B84; --ro:#2563C9; --proj:#D9820A;
    --cfd-soft:rgba(0,155,132,.12); --ro-soft:rgba(37,99,201,.12); --proj-soft:rgba(217,130,10,.14);
    --good:#0f9d6b; --pend:#D9820A;
    --shadow:0 1px 2px rgba(13,34,48,.05), 0 8px 28px -12px rgba(13,34,48,.18);
  }
  :root[data-theme="dark"]{
    --paper:#0a1a22; --surface:#0f2530; --surface-2:#132e3a;
    --ink:#e8f0f0; --ink-2:#a9c0c8; --ink-muted:#7593a0; --hairline:#1e3a45;
    --sea:#081419; --sea-ink:#eaf2f2;
    --cfd:#12A38C; --ro:#5B8DEF; --proj:#BC8024;
    --cfd-soft:rgba(18,163,140,.16); --ro-soft:rgba(91,141,239,.16); --proj-soft:rgba(188,128,36,.18);
    --good:#37c08a; --pend:#e0a13a;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -12px rgba(0,0,0,.6);
  }

  /* ============================ BASE ============================ */
  *{box-sizing:border-box}
  .doc{background:var(--paper);color:var(--ink);font-family:var(--sans);
    line-height:1.62;font-size:17px;-webkit-font-smoothing:antialiased;
    font-feature-settings:"kern" 1;overflow-x:hidden}
  .doc :where(p,li){color:var(--ink-2)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(18px,5vw,40px)}
  h1,h2,h3{color:var(--ink);text-wrap:balance;line-height:1.15;letter-spacing:-.02em;margin:0}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-muted);font-weight:600}
  .num{font-variant-numeric:tabular-nums}
  var{font-style:italic;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
  a{color:var(--cfd);text-underline-offset:2px}

  /* ============================ MASTHEAD ============================ */
  .masthead{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 86%,transparent);
    backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--hairline)}
  .masthead .wrap{display:flex;align-items:center;gap:16px;height:56px}
  .brand{font-family:var(--mono);font-weight:700;letter-spacing:-.01em;font-size:14px;color:var(--ink);white-space:nowrap}
  .brand b{color:var(--cfd)}
  .mh-legend{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .lg{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;color:var(--ink-muted);letter-spacing:.02em}
  .lg .sw{width:11px;height:11px;border-radius:3px;flex:none}

  /* ============================ HERO ============================ */
  .hero{position:relative;background:
      radial-gradient(120% 80% at 82% -10%, var(--cfd-soft), transparent 60%),
      radial-gradient(90% 70% at 10% 0%, var(--ro-soft), transparent 55%);
    border-bottom:1px solid var(--hairline)}
  .hero .wrap{padding-top:clamp(40px,7vw,76px);padding-bottom:clamp(30px,5vw,48px)}
  .kicker{display:inline-flex;gap:9px;align-items:center;padding:5px 12px;border:1px solid var(--hairline);
    border-radius:999px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:22px}
  .kicker .dot{width:7px;height:7px;border-radius:50%;background:var(--cfd);box-shadow:0 0 0 4px var(--cfd-soft)}
  .kicker span{font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2)}
  h1{font-size:clamp(30px,5.4vw,52px);font-weight:800}
  .lede{font-size:clamp(17px,2.2vw,21px);max-width:60ch;margin-top:18px;color:var(--ink-2)}
  .lede b{color:var(--ink);font-weight:600}

  /* KPI strip */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:38px;
    background:var(--hairline);border:1px solid var(--hairline);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .kpi{background:var(--surface);padding:18px 20px}
  .kpi .v{font-family:var(--mono);font-size:clamp(22px,3vw,30px);font-weight:700;color:var(--ink);letter-spacing:-.02em;line-height:1.05}
  .kpi .v .u{font-size:.5em;color:var(--ink-muted);font-weight:500;margin-left:2px}
  .kpi .k{font-size:12.5px;color:var(--ink-muted);margin-top:8px;line-height:1.35}
  .kpi.teal .v{color:var(--cfd)} .kpi.amber .v{color:var(--proj)}
  @media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}

  /* ============================ SECTIONS ============================ */
  section{padding:clamp(40px,6vw,68px) 0;border-bottom:1px solid var(--hairline)}
  .sec-head{display:flex;gap:16px;align-items:baseline;margin-bottom:26px}
  .sec-no{font-family:var(--mono);font-size:13px;color:var(--cfd);font-weight:700;letter-spacing:.05em;flex:none}
  h2{font-size:clamp(22px,3.4vw,32px);font-weight:750}
  .sec-head p{margin:8px 0 0;max-width:64ch}
  .prose{max-width:68ch}
  .prose p{margin:0 0 16px}
  .prose p:last-child{margin-bottom:0}

  /* device layout */
  .split{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,4vw,48px);align-items:center}
  @media(max-width:820px){.split{grid-template-columns:1fr}}
  .steps{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:14px}
  .steps li{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
  .steps .n{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--cfd);background:var(--cfd-soft);
    width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none}
  .steps b{color:var(--ink)}

  /* formula */
  .formula{font-family:var(--mono);background:var(--surface-2);border:1px solid var(--hairline);border-radius:10px;
    padding:14px 16px;font-size:15px;color:var(--ink);overflow-x:auto;letter-spacing:.01em}
  .formula .lbl{color:var(--ink-muted);font-size:12px}
  .def{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px;font-family:var(--mono);font-size:12.5px;color:var(--ink-muted)}
  .def b{color:var(--ink-2);font-weight:600}

  /* figure / card */
  .card{background:var(--surface);border:1px solid var(--hairline);border-radius:16px;box-shadow:var(--shadow);
    padding:clamp(16px,2.4vw,26px)}
  .fig-cap{font-size:13.5px;color:var(--ink-muted);margin-top:14px;padding-top:14px;border-top:1px solid var(--hairline);
    display:flex;gap:10px}
  .fig-cap .tag{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
    padding:2px 8px;border-radius:6px;flex:none;height:fit-content}
  .tag.cfd{background:var(--cfd-soft);color:var(--cfd)} .tag.proj{background:var(--proj-soft);color:var(--proj)}
  .chart-legend{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:6px;justify-content:flex-end}
  .chart-legend .lg{font-size:12px;color:var(--ink-2)}
  .chart-title{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:4px}
  svg .grid{stroke:var(--hairline);stroke-width:1}
  svg .axis{stroke:var(--ink-muted);stroke-width:1}
  svg text{fill:var(--ink-muted);font-family:var(--mono);font-size:11px}
  svg .axtitle{fill:var(--ink-2);font-size:12.5px;font-weight:600}

  /* stat callouts row */
  .callrow{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
  @media(max-width:760px){.callrow{grid-template-columns:1fr}}
  .call{background:var(--surface);border:1px solid var(--hairline);border-radius:13px;padding:18px 18px;box-shadow:var(--shadow)}
  .call .v{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--cfd);letter-spacing:-.02em}
  .call .k{font-size:13px;color:var(--ink-2);margin-top:6px} .call .s{font-size:12px;color:var(--ink-muted);margin-top:4px}

  /* tables */
  .tbl-wrap{overflow-x:auto;margin-top:20px;border:1px solid var(--hairline);border-radius:12px}
  table{border-collapse:collapse;width:100%;font-size:14px;min-width:440px}
  th,td{padding:11px 15px;text-align:right;border-bottom:1px solid var(--hairline);font-variant-numeric:tabular-nums;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  thead th{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted);font-weight:600;background:var(--surface-2)}
  tbody tr:last-child td{border-bottom:none}
  td.hl{color:var(--ink);font-weight:600}
  tbody tr:hover{background:var(--surface-2)}

  /* status list */
  .status{display:grid;gap:12px;margin-top:8px}
  .st{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--surface);
    border:1px solid var(--hairline);border-radius:12px;padding:15px 18px;box-shadow:var(--shadow)}
  .st .icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;font-family:var(--mono);font-weight:700;font-size:15px}
  .st.ok .icon{background:var(--cfd-soft);color:var(--cfd)}
  .st.proj .icon{background:var(--proj-soft);color:var(--proj)}
  .st.pend .icon{background:var(--surface-2);color:var(--ink-muted);border:1px dashed var(--hairline)}
  .st .lab{color:var(--ink);font-weight:600;font-size:15px}
  .st .sub{color:var(--ink-muted);font-size:13px;margin-top:2px}
  .st .pill{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:5px 11px;border-radius:999px;flex:none}
  .st.ok .pill{background:var(--cfd-soft);color:var(--cfd)}
  .st.proj .pill{background:var(--proj-soft);color:var(--proj)}
  .st.pend .pill{background:var(--surface-2);color:var(--ink-muted)}

  .note{background:var(--proj-soft);border:1px solid color-mix(in srgb,var(--proj) 35%,transparent);border-radius:12px;
    padding:16px 18px;margin-top:22px;font-size:14.5px;color:var(--ink-2);display:flex;gap:12px}
  .note .b{font-family:var(--mono);color:var(--proj);font-weight:700;font-size:12px;letter-spacing:.05em;flex:none;padding-top:1px}

  /* footer */
  footer{background:var(--sea);color:var(--sea-ink);border-bottom:none}
  footer .wrap{padding:44px clamp(18px,5vw,40px)}
  footer h3{color:var(--sea-ink);font-size:16px;margin-bottom:14px;font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase}
  .foot-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:32px}
  @media(max-width:760px){.foot-grid{grid-template-columns:1fr;gap:24px}}
  footer p,footer li{color:color-mix(in srgb,var(--sea-ink) 72%,transparent);font-size:13.5px;line-height:1.6}
  footer ul{list-style:none;padding:0;margin:0;display:grid;gap:7px}
  footer .k{font-family:var(--mono);color:color-mix(in srgb,var(--sea-ink) 55%,transparent);font-size:11px}
  .foot-bar{border-top:1px solid rgba(255,255,255,.1);margin-top:30px;padding-top:18px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
    font-family:var(--mono);font-size:11.5px;color:color-mix(in srgb,var(--sea-ink) 55%,transparent)}

  /* tooltip */
  #tip{position:fixed;pointer-events:none;z-index:60;background:var(--ink);color:var(--paper);font-family:var(--mono);
    font-size:12px;padding:8px 11px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;transform:translateY(4px);
    transition:opacity .1s;max-width:240px;line-height:1.5}
  #tip.on{opacity:1;transform:none}
  #tip .t{color:#fff;font-weight:700}
  .hit{cursor:crosshair}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  :focus-visible{outline:2px solid var(--cfd);outline-offset:2px;border-radius:4px}

  /* ============================ STANDARD-REPORT SHELL ============================ */
  html{scroll-behavior:smooth}
  .shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:0;align-items:start}
  .toc{position:sticky;top:56px;align-self:start;max-height:calc(100vh - 56px);overflow-y:auto;
    padding:26px 20px 40px 0;border-right:1px solid var(--hairline)}
  .toc .tt{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 12px 4px}
  .toc ol{list-style:none;margin:0;padding:0;counter-reset:l1}
  .toc>ol>li{counter-increment:l1;margin:2px 0}
  .toc a{display:block;text-decoration:none;color:var(--ink-2);font-size:13.5px;padding:5px 10px;border-radius:7px;border-left:2px solid transparent;line-height:1.3}
  .toc>ol>li>a::before{content:counter(l1) ".  ";color:var(--ink-muted);font-family:var(--mono);font-size:12px}
  .toc a:hover{background:var(--surface-2);color:var(--ink)}
  .toc a.active{color:var(--cfd);border-left-color:var(--cfd);background:var(--cfd-soft);font-weight:600}
  .toc .sub{list-style:none;margin:0 0 6px;padding:0;counter-reset:l2}
  .toc .sub li{counter-increment:l2}
  .toc .sub a{font-size:12.5px;color:var(--ink-muted);padding:3px 10px 3px 22px}
  .toc .sub a::before{content:counter(l1) "." counter(l2) "  ";font-family:var(--mono);font-size:11px;opacity:.8}
  .main{min-width:0;padding:8px 0 0 clamp(20px,3vw,44px)}
  @media(max-width:900px){
    .shell{grid-template-columns:1fr}
    .toc{position:static;max-height:none;border-right:none;border-bottom:1px solid var(--hairline);padding:18px 0 22px}
    .toc ol{columns:2;column-gap:20px} .toc .sub{columns:1}
    .main{padding-left:0}
  }

  /* numbered L1 / L2 sections */
  .main>section{counter-increment:sec;border-bottom:1px solid var(--hairline);padding:38px 0 40px;scroll-margin-top:72px}
  .main{counter-reset:sec}
  .main>section:last-child{border-bottom:none}
  .l1head{display:flex;gap:14px;align-items:baseline;margin-bottom:6px}
  .l1head .secnum{font-family:var(--mono);font-weight:700;color:var(--cfd);font-size:15px;flex:none}
  .l1head .secnum::after{content:counter(sec)}
  .main>section>h2{font-size:clamp(21px,3vw,30px);font-weight:750}
  .l1sub{color:var(--ink-muted);font-size:15px;max-width:66ch;margin:2px 0 0}
  .l2{counter-increment:sub;padding-top:26px;scroll-margin-top:72px}
  section{counter-reset:sub}
  .l2head{display:flex;gap:11px;align-items:baseline;margin-bottom:14px;padding-bottom:10px;border-bottom:1px dashed var(--hairline)}
  .l2head .n{font-family:var(--mono);font-size:12.5px;color:var(--cfd);font-weight:700;flex:none}
  .l2head .n::after{content:counter(sec) "." counter(sub)}
  .l2head h3{font-size:clamp(16px,2vw,20px);font-weight:700}

  /* objective callout */
  .objective{background:var(--cfd-soft);border:1px solid color-mix(in srgb,var(--cfd) 30%,transparent);border-radius:14px;padding:20px 22px;display:grid;gap:10px}
  .objective .oh{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cfd);font-weight:700}
  .objective p{color:var(--ink);margin:0;font-size:16px}
  .objective .scope{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .chip{font-family:var(--mono);font-size:11.5px;background:var(--surface);border:1px solid var(--hairline);border-radius:999px;padding:5px 11px;color:var(--ink-2)}

  /* data / definition tables */
  .datagrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:4px}
  .kv{border:1px solid var(--hairline);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
  .kv .cap{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);
    padding:11px 15px;background:var(--surface-2);border-bottom:1px solid var(--hairline);font-weight:600}
  .kv table{min-width:0}
  .kv td{border-bottom:1px solid var(--hairline)}
  .kv tr:last-child td{border-bottom:none}
  .kv td:first-child{color:var(--ink-2)}
  .kv td:last-child{color:var(--ink);font-weight:600;font-family:var(--mono);font-size:13px}
  .kv td .un{color:var(--ink-muted);font-weight:400;font-size:11px}

  /* equation cards */
  .eq{display:grid;grid-template-columns:1fr auto;align-items:center;gap:18px;background:var(--surface);
    border:1px solid var(--hairline);border-left:3px solid var(--cfd);border-radius:11px;padding:16px 20px;margin:14px 0;box-shadow:var(--shadow)}
  .eq .m{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:20px;color:var(--ink);
    overflow-x:auto;line-height:2;letter-spacing:.01em}
  .eq .m var{font-size:1em}
  .eq .eno{font-family:var(--mono);font-size:13px;color:var(--ink-muted);flex:none}
  .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .18em;font-size:.86em}
  .frac>.n{border-bottom:1.6px solid currentColor;padding:0 .4em 1px}
  .frac>.d{padding:1px .4em 0}
  .rad{white-space:nowrap}
  .rad>.rc{border-top:1.6px solid currentColor;padding:0 .18em;margin-left:-.08em}
  .op{color:var(--ink-muted);margin:0 .12em}
  .defs{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px 22px}
  .defs .d{display:flex;gap:9px;font-size:13.5px;color:var(--ink-2);align-items:baseline}
  .defs .d var{color:var(--ink);font-weight:600;min-width:2.4em;font-family:"Iowan Old Style",Palatino,Georgia,serif}
  .defs .d .u{color:var(--ink-muted);font-family:var(--mono);font-size:11px;margin-left:auto;white-space:nowrap}

  /* flowchart */
  .flow{background:var(--surface);border:1px solid var(--hairline);border-radius:14px;padding:20px;box-shadow:var(--shadow);overflow-x:auto}
  .flow svg{display:block;min-width:560px;margin:0 auto}
  .flow .fb{fill:var(--surface-2);stroke:var(--ink-muted);stroke-width:1.5}
  .flow .fb.cfd{fill:var(--cfd-soft);stroke:var(--cfd)}
  .flow .fb.ro{fill:var(--ro-soft);stroke:var(--ro)}
  .flow .fb.proj{fill:var(--proj-soft);stroke:var(--proj);stroke-dasharray:5 3}
  .flow .fl{fill:var(--ink);font-family:var(--sans);font-size:12.5px;font-weight:600}
  .flow .fs{fill:var(--ink-muted);font-family:var(--mono);font-size:10.5px}
  .flow .fa{stroke:var(--ink-muted);stroke-width:1.6;fill:none}
  .flow .fd{fill:var(--ink-muted)}

  .refs{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:10px}
  .refs li{display:grid;grid-template-columns:auto 1fr;gap:12px;font-size:14px;color:var(--ink-2);align-items:baseline}

<script>
/* scrollspy */
(function(){var links={},targets=[];document.querySelectorAll('.toc a[href^="#"]').forEach(function(a){var id=a.getAttribute('href').slice(1);links[id]=a;var t=document.getElementById(id);if(t)targets.push(t);});if(!('IntersectionObserver' in window)||!targets.length)return;var seen={};var io=new IntersectionObserver(function(es){es.forEach(function(e){seen[e.target.id]=e.isIntersecting?e.intersectionRatio:0;});var best=null,br=0;Object.keys(seen).forEach(function(id){if(seen[id]>br){br=seen[id];best=id;}});if(best){Object.keys(links).forEach(function(id){links[id].classList.toggle('active',id===best);});}},{rootMargin:"-64px 0px -55% 0px",threshold:[0,.25,.5,1]});targets.forEach(function(t){io.observe(t);});})();
</script>
