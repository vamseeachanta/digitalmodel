industries:

  - id: pipelines-midstream
    title: Pipelines (onshore and offshore transmission, gathering, hazardous liquid)
    intro: "Frameworks: ASME B31.8S (22 root causes in 9 threat categories), API RP 1160, API RP 1176 (cracking), NACE SP0502 / SP0206 (direct assessment). Subsea design screens (free span, on-bottom stability, global buckling) are in the design-screen section, not here. Defect taxonomy cross-checked against PDAM: defect-free pipe, corrosion, gouges, plain and kinked dents, dents on welds, dent-gouge, manufacturing defects, girth and seam weld defects, cracking, environmental cracking, defect interaction, fittings, leak-vs-rupture."
    inspection_codes: [asme-b31-8s, api-rp-1160, api-rp-1176, nace-sp0502, nace-sp0206]
    assets:
      - asset: steel pipeline body
        defects:
          - {mechanism: "general / local metal loss (external, internal corrosion)", codes: [asme-b31g, dnv-rp-f101, api-579-1], parts: [4, 5], engines: [corroded-pipe, rstreng-2d, dnv-f101, ffs-metal-loss], tiers: [T1, T2], status: validated}
          - {mechanism: river-bottom profile metal loss, codes: [asme-b31g, dnv-rp-f101], engines: [rstreng-2d], tiers: [T2], status: live, caveat: "pipeline-corroded-defect-screen covers MAX projection only; area-weighted mode remains a sensitivity calculation"}
          - {mechanism: circumferential metal loss / net-section, codes: [api-579-1, dnv-rp-f101], parts: [5], engines: [circumferential], tiers: [T2], status: validated, caveat: "F101 combined-loading factor stubbed (#1146)"}
          - {mechanism: interacting defect colonies, codes: [dnv-rp-f101, api-579-1], parts: [4], engines: [dnv-f101], tiers: [T2], status: engine, caveat: "#1094 finding 1"}
          - {mechanism: pitting, codes: [api-579-1], parts: [6], engines: [pitting], tiers: [T1, T2], status: engine}
          - {mechanism: plain dents / dent on weld, codes: [api-579-1, pdam, asme-b31-8], parts: [12], engines: [dents], tiers: [T1, T2], status: engine}
          - {mechanism: dent-gouge / gouges, codes: [api-579-1, pdam], parts: [12], engines: [dents], tiers: [T1, T2], status: engine, caveat: "gouge-only PDAM path not implemented"}
          - {mechanism: "crack-like flaws (SCC, seam weld, girth weld, fatigue cracks, hook cracks)", codes: [api-579-1, bs-7910, api-rp-1176], parts: [9], engines: [crack-fad, part9-level2, part9-level1], tiers: [T1, T2, T3], status: engine}
