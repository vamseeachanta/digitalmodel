    inspection_codes: [api-510, api-570, api-653, api-rp-580, api-rp-581]
    damage_taxonomy: api-rp-571
    assets:
      - asset: pressure vessel (API 510 -> API 579)
        defects:
          - {mechanism: general / local metal loss, codes: [api-579-1, api-510], parts: [4, 5], engines: [ffs-metal-loss], tiers: [T1, T2], status: validated, note: "L1 t_min includes ASME VIII"}
          - {mechanism: pitting, codes: [api-579-1], parts: [6], engines: [pitting], tiers: [T1, T2], status: engine}
          - {mechanism: hydrogen blisters / HIC / SOHIC, codes: [api-579-1], parts: [7], engines: [parts-3-7-10], tiers: [T1, T2], status: planned}
          - {mechanism: brittle fracture susceptibility (MAT), codes: [api-579-1], parts: [3], engines: [parts-3-7-10], tiers: [T1, T2], status: planned}
          - {mechanism: "weld misalignment, out-of-roundness, bulges", codes: [api-579-1], parts: [8], engines: [parts-8-11-13-14], tiers: [T2, T3], status: planned}
          - {mechanism: "crack-like flaws (weld cracks, SCC, fatigue)", codes: [api-579-1, bs-7910], parts: [9], engines: [crack-fad, part9-level2], tiers: [T2, T3], status: engine}
          - {mechanism: creep / creep-fatigue, codes: [api-579-1], parts: [10], engines: [parts-3-7-10], tiers: [T2, T3], status: planned}
          - {mechanism: fire damage, codes: [api-579-1], parts: [11], engines: [parts-8-11-13-14], tiers: [T1, T2], status: planned}
          - {mechanism: "fatigue (crack initiation, cyclic-service screen)", codes: [api-579-1], parts: [14], engines: [parts-8-11-13-14, sn-fatigue], tiers: [T1, T2], status: planned, caveat: "S-N library exists; Part 14 screening not wired"}
          - {mechanism: re-rate / MAWP reduction, codes: [api-579-1, api-510], parts: [4, 5], engines: [ffs-metal-loss], tiers: [T2], status: validated}
      - asset: process piping (API 570 -> API 579)
        defects:
          - {mechanism: "CUI, injection point, deadleg, soil-to-air, mixing point, erosion thinning", codes: [api-570, api-579-1], parts: [4, 5], engines: [ffs-metal-loss], tiers: [T1, T2], status: validated}
          - {mechanism: pitting, codes: [api-579-1], parts: [6], engines: [pitting], tiers: [T1, T2], status: engine}
          - {mechanism: crack-like flaws at branch / weldolet welds, codes: [api-579-1, bs-7910], parts: [9], engines: [crack-fad, part9-level2], tiers: [T2, T3], status: engine, note: "weldolet FE benchmark in plan #2157 / PR #2194"}
          - {mechanism: composite repair, codes: [asme-pcc-2, iso-24817], engines: [composite-repair], tiers: [T2], status: engine}
      - asset: heat exchangers and fired heaters
        defects:
          - {mechanism: exchanger tube bundle thinning / pitting / tube plugging limits, codes: [api-660, tema, api-579-1], parts: [4, 5, 6], engines: [], tiers: [T1, T2], status: none}
