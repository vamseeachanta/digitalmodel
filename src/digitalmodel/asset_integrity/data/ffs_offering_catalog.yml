  - id: downstream-fixed-equipment
    title: Refining and petrochemical fixed equipment
    intro: "Inspection codes: API 510 (vessels), API 570 (piping), API 653 (tanks), API 660 / TEMA (exchangers), API 560 / RP 573 (fired heaters); risk: API RP 580/581; damage taxonomy: API RP 571 (crosswalk data in ffs_damage_mechanism_crosswalk.yml)."
