      - asset: atmospheric storage tank (API 653 -> API 579)
        defects:
          - {mechanism: "bottom plate underside / topside corrosion, critical zone", codes: [api-653, api-579-1], parts: [4, 5, 6], engines: [ffs-metal-loss, pitting], tiers: [T1, T2], status: engine, caveat: "no tank-specific t_min rules"}
          - {mechanism: shell course thinning / fill-height re-rate, codes: [api-653, api-579-1], parts: [4, 5], engines: [ffs-metal-loss], tiers: [T1, T2], status: engine, caveat: "API 650 one-foot method not wired"}
          - {mechanism: "settlement (planar tilt, out-of-plane differential, edge, bottom)", codes: [api-653], engines: [tank-settlement-screen], tiers: [T1], status: planned, issue: 2172}
          - {mechanism: "settlement beyond Annex B limits (strain limit, buckling, collapse)", codes: [api-579-1], engines: [tank-level3, calculix-nonlinear, annex-f-material], tiers: [T3], status: planned, issue: 2174, note: "Annex B1 (2007) / Annex 2D (2016+)"}
