          - {mechanism: "scour, subsidence, marine growth beyond design", codes: [api-rp-2sim], engines: [scour], tiers: [T1], status: engine, note: "scour capacity only; no SIM verdict"}
          - {mechanism: structural health monitoring alerts, codes: [api-rp-2sim, dnv-st-0126], engines: [structural-health], tiers: [T1], status: engine}
      - asset: conductors, caissons, boat landings, risers guards
        defects:
          - {mechanism: "conductor / caisson wall loss, guide wear, fatigue", codes: [api-rp-2sim, api-rp-17g, dnv-rp-c203], engines: [], tiers: [T1, T2], status: none}

  - id: upstream-offshore-floating
    title: Floating production systems (FPSO, semi, TLP, spar) and their moorings and risers
    intro: "Frameworks: API RP 2MIM, API RP 2FSIM, API RP 2I, DNV-OS-E301, DNV-OS-E303. Chain pitting is classed small / medium / mega in industry practice (Chain FEARS); class boundaries are inputs on #2199 with their public source."
    asset_column: true
    inspection_codes: [api-rp-2mim, api-rp-2fsim, api-rp-2i, dnv-os-e301]
    assets:
      - asset: mooring chain, wire and fibre rope, connectors
        defects:
          - {mechanism: general corrosion (uniform diameter loss) against discard criterion, codes: [api-rp-2mim, dnv-os-e301], engines: [mooring-chain-degradation, mooring-screen], tiers: [T1, T2], status: planned}
          - {mechanism: pitting classes (small / medium / mega) and discard guidance, codes: [api-rp-2mim, chain-fears-jip], engines: [mooring-chain-degradation], tiers: [T1, T2], status: planned}
          - {mechanism: wear at interlink / fairlead, codes: [api-rp-2mim, api-rp-2i, dnv-os-e301], engines: [mooring-chain-degradation], tiers: [T1], status: planned}
          - {mechanism: "chain fatigue (tension-tension, out-of-plane bending)", codes: [api-rp-2mim, dnv-os-e301, dnv-rp-c203], engines: [mooring-fatigue, sn-fatigue], tiers: [T2], status: engine}
          - {mechanism: link ovalization / loose studs / cracks, codes: [api-rp-2mim, api-rp-2i], engines: [mooring-chain-degradation], tiers: [T1], status: planned}
          - {mechanism: wire rope broken wires / corrosion / diameter loss, codes: [api-rp-2i], engines: [], tiers: [T1], status: none}
          - {mechanism: "fibre rope creep, abrasion, particle ingress", codes: [dnv-os-e303], engines: [synthetic-rope-fatigue], tiers: [T1, T2], status: engine, caveat: "fatigue only; no condition-based discard"}
          - {mechanism: anchor holding capacity after seabed change / drag, codes: [dnv-os-e301], engines: [], tiers: [T2], status: none}
      - asset: steel catenary / top-tensioned production risers
        defects:
          - {mechanism: "metal loss, pitting, cracks", codes: [api-std-2rd, dnv-st-f201, api-579-1, bs-7910], parts: [4, 5, 6, 9], engines: [ffs-metal-loss, crack-fad], tiers: [T1, T2], status: engine}
          - {mechanism: "fatigue (wave, VIV)", codes: [dnv-st-f201, dnv-rp-c203], engines: [riser-fatigue], tiers: [T2], status: workflow}
      - asset: drilling / completion riser joints and wellhead fatigue
        defects:
          - {mechanism: metal loss / weld flaws / collapse-limited depth, codes: [asme-b31g, dnv-rp-f101, bs-7910], engines: [riser-joint-ffs], tiers: [T1, T2], status: workflow, note: "real C-scan fixtures; bounded composition validation"}
          - {mechanism: wellhead / conductor fatigue from riser loads, codes: [api-rp-17g, dnv-rp-c203], engines: [], tiers: [T2], status: none}
      - asset: unbonded flexible pipe
        defects:
          - {mechanism: outer sheath damage / annulus flooding, codes: [api-rp-17b], engines: [flexible-pipe-screen], tiers: [T1], status: planned}
          - {mechanism: tensile armour wire corrosion / rupture (end-fitting fatigue), codes: [api-rp-17b], engines: [flexible-pipe-screen], tiers: [T2], status: planned}
          - {mechanism: "carcass collapse, pressure sheath creep / rupture", codes: [api-rp-17b], engines: [flexible-pipe-screen], tiers: [T2], status: planned}

  - id: wells
    title: Well tubulars
    asset_column: true
    inspection_codes: [api-tr-5c3]
    assets:
      - asset: casing and tubing
        defects:
          - {mechanism: "casing wear (drillstring contact) and corrosion, remaining collapse / burst with ovality", codes: [api-tr-5c3], engines: [casing-capacity], tiers: [T2], status: planned}

  - id: offshore-wind
    title: Offshore wind support structures
    inspection_codes: [dnv-st-0126, dnv-st-0262, dnv-rp-c203]
    assets:
      - asset: monopile / transition piece / jacket
        defects:
          - {mechanism: circumferential weld fatigue cracks, codes: [dnv-st-0126, dnv-rp-c203, bs-7910], engines: [sn-fatigue, crack-fad], tiers: [T2, T3], status: engine}
          - {mechanism: corrosion pitting to crack transition, codes: [dnv-rp-c203, bs-7910], engines: [pitting, crack-growth], tiers: [T2], status: engine}
          - {mechanism: grouted connection slippage / cracking, codes: [dnv-st-0126], engines: [], tiers: [T2], status: none}
          - {mechanism: bolted flange preload loss, codes: [dnv-st-0126], engines: [], tiers: [T1], status: none}
          - {mechanism: scour, codes: [dnv-st-0126], engines: [scour], tiers: [T1], status: engine}
          - {mechanism: "lifetime extension assessment (remaining fatigue life, load re-evaluation)", codes: [dnv-st-0262, dnv-rp-c203], engines: [], tiers: [T2], status: none, note: "S-N library exists but no lifetime-extension engine"}

  - id: marine-ships
    title: Ships and floating hulls (class rules)
    intro: "Frameworks: IACS CSR Ch 13 renewal criteria (wastage allowance, substantial-corrosion band, hull girder section modulus limits; values are inputs on #2202), IACS Rec. 84."
    inspection_codes: [iacs-csr, iacs-rec-84]
    assets:
      - asset: hull plating and stiffeners
        defects:
          - {mechanism: "thickness diminution vs renewal thickness (wastage allowance, substantial-corrosion band)", codes: [iacs-csr], engines: [hull-wastage], tiers: [T1], status: planned}
          - {mechanism: buckling of thinned plates / panels, codes: [iacs-csr, dnv-rp-c201], engines: [plate-panel-buckling], tiers: [T2], status: workflow, note: "plate metal-loss FFS on the capabilities page"}
          - {mechanism: pitting intensity on plating, codes: [iacs-rec-84], engines: [pitting], tiers: [T1], status: engine}
          - {mechanism: hull girder section modulus loss against class limits, codes: [iacs-csr], engines: [hull-girder, hull-wastage], tiers: [T2], status: engine}
          - {mechanism: fatigue cracks at details, codes: [iacs-csr, bs-7910], engines: [sn-fatigue, crack-fad], tiers: [T2], status: engine}

  - id: power-generation
    title: Power boilers and high-temperature pressure parts
    inspection_codes: [nbic, asme-i]
    assets:
      - asset: headers, tubes, steam piping
        defects:
          - {mechanism: "tube / header wall thinning (erosion, fireside corrosion)", codes: [api-579-1, nbic], parts: [4, 5], engines: [ffs-metal-loss], tiers: [T1, T2], status: engine, caveat: "2026-06-27 record covers pipe/vessel t_min, not ASME I / NBIC tube rules"}
          - {mechanism: "creep damage / remaining life (Larson-Miller, Omega)", codes: [api-579-1], parts: [10], engines: [parts-3-7-10], tiers: [T2, T3], status: planned}
          - {mechanism: thermal fatigue / creep-fatigue, codes: [api-579-1], parts: [14, 10], engines: [parts-8-11-13-14], tiers: [T2], status: planned}
          - {mechanism: crack-like flaws in headers / nozzles, codes: [api-579-1, bs-7910], parts: [9], engines: [crack-fad], tiers: [T2, T3], status: engine}

