# ABOUTME: FFS offering catalog — industries x asset classes x damage mechanisms x governing
# ABOUTME: codes x digitalmodel engine status. Data only; no clause text. Epic #1057 Phase 4.
#
# Status vocabulary (readiness review 2026-09-25, docs/domains/asset-integrity/ffs-readiness-review-2026-09-25.md, PR #2186):
#   live       engine + tests + validation record + registered durable workflow with a committed example
#   workflow   engine + tests + registered durable workflow with a committed example, but NO validation record
#   validated  engine + tests + validation record, no registered workflow yet
#   engine     engine + tests, no validation record
#   planned    GitHub issue exists, no engine
#   none       no engine, no issue (candidate for the offering roadmap)
# A row's status says what can be delivered today for that mechanism: never stronger than the strongest
# engine it lists; 'none' rows list no engines; 'live' rows lean only on live/validated engines.
# Tier vocabulary:
#   T1  field screen (API 579 Level 1 or code screening rule; inspector-facing verdict)
#   T2  office Level 2 (closed-form; engineer-facing report)
#   T3  Level 3 (numerical: FEA, fracture mechanics, collapse)
# Rights: publisher identifiers and public overviews only. No clause text, tables, figures, formulas or
# licensed numeric thresholds; thresholds live in each issue's rights card as user inputs with public defaults.
# Enforced by tests/asset_integrity/test_offering_catalog.py.
# Design screens that are not FFS verdicts (owner decision D5, 2026-09-25) live in ffs_design_screen_catalog.yml.

schema_version: 2
generated: 2026-09-25
epic: "vamseeachanta/digitalmodel#1057"

