          - {mechanism: "wrinkles, buckles, ovality, ripples", codes: [api-579-1], parts: [8], engines: [parts-8-11-13-14], tiers: [T2, T3], status: planned}
          - {mechanism: manufacturing defects in pipe body, codes: [pdam], engines: [], tiers: [T2], status: none}
          - {mechanism: geohazard / ground-movement strain demand, codes: [api-rp-1133], engines: [], tiers: [T2], status: none}
          - {mechanism: direct-assessment programme support (ECDA / ICDA region and indication ranking), codes: [nace-sp0502, nace-sp0206], engines: [], tiers: [T1], status: none}
