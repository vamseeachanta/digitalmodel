# Engine base config for the openfoam_run_batch workflow (issue #1560).
#
# Loaded by assetutilities ApplicationManager.configure (pkgutil from the
# installed package: base_configs/modules/<basename>/<basename>.yml) and
# deep-merged UNDER the user's input.yml (update_deep_dictionary — user
# values always win). Without this file the canonical
# `python -m digitalmodel <input.yml>` invocation dies in configure with
# FileNotFoundError before ever reaching the workflow router.
#
# Keep the defaults minimal and identical to the code defaults in
# src/digitalmodel/workflows/openfoam_run_batch.py so merge order can never
# change behaviour.
basename: openfoam_run_batch

openfoam_run_batch:
  # `base` intentionally defaults to EMPTY (#1575). It is deep-merged UNDER the
  # user's input, so any semantic key defaulted here would be injected into a
  # canonical `case_definition:` request and rejected as a legacy/canonical mix.
  # The two forms of base are:
  #   legacy   — flat keys (case_type, solver, mesh_utility, run_snappy,
  #              to_vtk, run_set_fields). Defaults are supplied by
  #              normalisation, not here: mesh_utility blockMesh, to_vtk false.
  #   canonical — case_definition (schema_version/kind/authored) + execution.
  #              See examples/workflows/openfoam-run-batch/input.yml.
  # Exactly one form per input; mixing them is refused.
  base: {}
  cases: []                # explicit case list (mutually exclusive w/ variants)
  variants: {}             # parametric_run sweep schema
  mapping: {}              # knob name -> dotted settings path
  run_batch:
    mode: pool             # pool | mpi
    workers: null          # null -> floor(0.9 x host cores), min 1 (dm#1553)
    mock: false
    reconstruct: true      # mpi only: reconstructPar then prune processor*
    resume: false          # mpi only: restart the solver from latestTime.
                           # LEAVE THIS false FOR NORMAL RUNS. It does NOT
                           # fall back to a fresh build -- it FAILS the run
                           # unless a matching decomposition already exists,
                           # so a persistently-true value fails every run
                           # including the first, and a retry cannot
                           # self-heal. Set it true only to restart a
                           # specific interrupted run, then set it back.
                           # Accepted only when processor0..processor{workers-1}
                           # are all present as real directories, system/
                           # decomposeParDict says numberOfSubdomains: workers,
                           # every rank's latest time agrees and is non-empty,
                           # and system/controlDict does not resolve outside
                           # the case. Otherwise the run is refused BEFORE
                           # controlDict is touched, naming the failed check
                           # (dm#1968). The previous behaviour silently
                           # deleted and rebuilt the case instead.
    timeout_seconds: 43200
    output_dir: results
    work_dir: batch_runs

default:
  log_level: INFO
  config:
    overwrite:
      output: true
