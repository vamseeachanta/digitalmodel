<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="What the fender design guide holds: inputs, methods, fender check and sensitivity"><defs><marker id="gs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b6a64"/></marker></defs><rect width="900" height="560" fill="#fff"/><text x="20" y="30" font-size="21" font-weight="700" text-anchor="start" fill="#0b0b0b">What the guide holds</text><rect x="20" y="50" width="200" height="150" rx="8" fill="#f3f6fb" stroke="#1f4e8c" stroke-width="1.5"/><text x="34" y="78" font-size="18" font-weight="700" text-anchor="start" fill="#1f4e8c">1 Inputs</text><text x="34" y="104" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">Ship: size, draught</text><text x="34" y="125" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">Berth: depth, structure</text><text x="34" y="146" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">Approach: angle, contact</text><text x="34" y="167" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">Conditions and tugs</text><rect x="250" y="50" width="200" height="150" rx="8" fill="#f3f6fb" stroke="#1f4e8c" stroke-width="1.5"/><text x="264" y="78" font-size="18" font-weight="700" text-anchor="start" fill="#1f4e8c">2 Berthing energy</text><text x="264" y="104" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">8 methods</text><text x="264" y="125" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">6 governing bodies</text><text x="264" y="146" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">Each coefficient with</text><text x="264" y="167" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">its source</text><rect x="480" y="50" width="200" height="150" rx="8" fill="#f3f6fb" stroke="#1f4e8c" stroke-width="1.5"/><text x="494" y="78" font-size="18" font-weight="700" text-anchor="start" fill="#1f4e8c">3 Fender check</text><text x="494" y="104" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">Energy against capacity</text><text x="494" y="125" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">Reaction against limit</text><text x="494" y="146" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">Hull pressure against</text><text x="494" y="167" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">limit</text><rect x="710" y="50" width="170" height="150" rx="8" fill="#f7f6f2" stroke="#6b6a64" stroke-width="1.5"/><text x="724" y="78" font-size="18" font-weight="700" text-anchor="start" fill="#1f4e8c">Database</text><text x="724" y="104" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">4,652 rows</text><text x="724" y="125" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">6 vendors</text><text x="724" y="146" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">26 fender types</text><text x="724" y="167" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">Size ranges</text><line x1="220" y1="125" x2="248" y2="125" stroke="#6b6a64" stroke-width="2.5" marker-end="url(#gs-arrow)"/><line x1="450" y1="125" x2="478" y2="125" stroke="#6b6a64" stroke-width="2.5" marker-end="url(#gs-arrow)"/><line x1="710" y1="125" x2="682" y2="125" stroke="#6b6a64" stroke-width="2.5" marker-end="url(#gs-arrow)"/><text x="20" y="240" font-size="16" font-weight="600" text-anchor="start" fill="#0b0b0b">Generic case: PIANC WG33 (2002), design energy 680.8 kNm, utilisation 1.081</text><text x="20" y="290" font-size="19" font-weight="700" text-anchor="start" fill="#1f4e8c">4 Sensitivity: what moves the answer, in three groups</text><rect x="20" y="306" width="274" height="190" rx="8" fill="#fff" stroke="#eb6834" stroke-width="2.5"/><rect x="20" y="306" width="274" height="36" rx="8" fill="#eb6834"/><text x="34" y="331" font-size="18" font-weight="700" text-anchor="start" fill="#fff">Project and design</text><text x="34" y="366" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">Choices of the design:</text><text x="34" y="387" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">design factor, berth</text><text x="34" y="408" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">structure, fender size,</text><text x="34" y="429" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">fenders in contact.</text><text x="34" y="450" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">Settle them early: they</text><text x="34" y="471" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">change the design.</text><rect x="313" y="306" width="274" height="190" rx="8" fill="#fff" stroke="#2a78d6" stroke-width="2.5"/><rect x="313" y="306" width="274" height="36" rx="8" fill="#2a78d6"/><text x="327" y="331" font-size="18" font-weight="700" text-anchor="start" fill="#fff">Operational</text><text x="327" y="366" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">Seen in operation:</text><text x="327" y="387" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">velocity, angle, contact</text><text x="327" y="408" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">point, displacement,</text><text x="327" y="429" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">water depth.</text><text x="327" y="450" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">Largest: berthing velocity</text><text x="327" y="471" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">(span 214 points).</text><rect x="606" y="306" width="274" height="190" rx="8" fill="#fff" stroke="#1baf7a" stroke-width="2.5"/><rect x="606" y="306" width="274" height="36" rx="8" fill="#1baf7a"/><text x="620" y="331" font-size="18" font-weight="700" text-anchor="start" fill="#fff">Method (code)</text><text x="620" y="366" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">The code chosen:</text><text x="620" y="387" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">8 methods, same ship</text><text x="620" y="408" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">and berth.</text><text x="620" y="429" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">Lowest to highest:</text><text x="620" y="450" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">+122 % design energy.</text><text x="620" y="471" font-size="15" font-weight="400" text-anchor="start" fill="#0b0b0b">Select one; show the rest.</text><text x="20" y="530" font-size="15" font-weight="400" text-anchor="start" fill="#6b6a64">A sensitivity is the change in the result when one input moves alone over its stated range.</text><text x="20" y="550" font-size="15" font-weight="400" text-anchor="start" fill="#6b6a64">A robust selection still meets every check after a project or design change.</text></svg>