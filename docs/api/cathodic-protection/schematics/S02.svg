<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" role="img" aria-labelledby="schematic-title" data-scale-x="366.667" data-scale-y="366.667"><title id="schematic-title">Monopile: geometry data gap and proportional anode detail</title><style>text{font-family:system-ui,sans-serif} .leader{stroke-dasharray:3 2}</style><text x="35" y="28" fill="#123047" font-size="13">Monopile: geometry data gap and proportional anode detail</text><text x="35" y="90" fill="#123047" font-size="13">NOT_EVALUATED: overall dimensions and coordinates are not recorded</text><text x="35" y="120" fill="#123047" font-size="13">No overall structure geometry or anode allocation is inferred from surface area</text><rect x="100" y="210" width="330" height="44" fill="#e8f3f7" stroke="#123047" stroke-width="1.5" /><line class="dimension" x1="100" y1="180" x2="430" y2="180" stroke="#087e8b" stroke-width="1"/><line class="leader" x1="100" y1="173" x2="100" y2="187" stroke="#087e8b" stroke-width="1"/><line class="leader" x1="430" y1="173" x2="430" y2="187" stroke="#087e8b" stroke-width="1"/><text x="100" y="168" fill="#123047" font-size="13">Anode length 0.9 m</text><line class="dimension" x1="460" y1="210" x2="460" y2="254" stroke="#087e8b" stroke-width="1"/><line class="leader" x1="453" y1="210" x2="467" y2="210" stroke="#087e8b" stroke-width="1"/><line class="leader" x1="453" y1="254" x2="467" y2="254" stroke="#087e8b" stroke-width="1"/><text x="472" y="232" fill="#123047" font-size="13">Anode diameter 0.12 m</text><text x="35" y="500" fill="#123047" font-size="13">Anode detail only; exterior structure dimensions are required for its elevation</text></svg>
