# ABOUTME: Machine source of truth for the capability information
# ABOUTME: architecture -- section ids, titles, and the links each owns.
#
# Extracted from docs/api/capabilities/index.html at 2ff0f72c^ (dm#1637).
# That page was doing two jobs: rendering the gallery AND declaring the IA.
# #1573 (C10 / workspace-hub#3485) correctly retired the rendering job by
# redirecting to aceengineer.com/capabilities -- and took the declaration
# with it, which is what broke the census. The data now lives here, where
# a presentation decision cannot delete it.
#
# `id`     -- URL anchor. STABLE: external links cite these (see the
#             anchor-stability contract in capabilities-ia-spec-1444.md).
# `title`  -- human label used in the generated spec tables. Plain text, NOT
#             HTML: the entities the extraction inherited (&amp;, &mdash;)
#             were an artefact of the markup this data used to live in, and
#             are decoded here. test_titles_are_plain_text keeps them out.
# `hrefs`  -- every link the section owns, page-relative to
#             docs/api/capabilities/. These drive the explorer<->section
#             join, `unlinked_explorers`, and the standards-grounding
#             ratchet, so pruning one silently drops real coverage.
#
# Adding a capability: append a section here, map it in
# capabilities-clusters.yml, add its sec-* SPECS entry, then regenerate:
#   .venv/bin/python scripts/capabilities/build_capabilities_inventory.py

schema_version: "1.0"
