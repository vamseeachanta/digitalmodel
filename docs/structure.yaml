  - path: benchmarks/
    purpose: Holds reproducible solver comparisons with inputs, reference values and recorded outputs.
  - path: benchmarks/fe10_nafems_le1/
    purpose: Compares finite-element stresses for the NAFEMS LE1 elliptic membrane and a constant-stress patch case.
  - path: benchmarks/fe10_nafems_le1/console/
    purpose: Records the commands and console output for deck preparation, solver execution and result comparison.
  - path: benchmarks/fe10_nafems_le1/inputs/
    purpose: Supplies finite-element input decks for three membrane meshes and a patch case.
  - path: benchmarks/fe10_nafems_le1/native/
    purpose: Retains native solver listings and error logs for the benchmark meshes.
  - path: benchmarks/fe10_nafems_le1/preflight/
    purpose: Records readiness checks and their results before benchmark execution.
  - path: benchmarks/fe10_nafems_le1/run-requests/
    purpose: Stores the machine-readable request to run the membrane benchmark.
  - path: benchmarks/fe10_nafems_le1/sources/
    purpose: Retains the reference code excerpt used to construct the benchmark.
  - path: benchmarks/fe10_nafems_le1/tools/
    purpose: Provides scripts to build and validate decks, extract stresses and check expected results.
