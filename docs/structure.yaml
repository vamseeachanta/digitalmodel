version: 1
depth: 3
ignore: [.git, .venv, node_modules, __pycache__, .pytest_cache]
entries:
  - path: .claude/
    purpose: Collects repository guidance, skills, hooks and configuration for Claude-assisted development.
  - path: .claude/cli/
    purpose: Implements interactive commands and progress reporting for the agent CLI.
  - path: .claude/context/
    purpose: Defines project patterns and team conventions used as agent context.
  - path: .claude/helpers/
    purpose: Provides setup and checkpoint scripts for local agent workflows.
  - path: .claude/hooks/
    purpose: Runs pre-task preparation and captures corrections during agent sessions.
  - path: .claude/instructions/
    purpose: Describes how to analyze the product, plan work and execute tasks.
  - path: .claude/integration/
    purpose: Provides Python helpers for assembling context, updating prompts and refreshing workflows.
  - path: .claude/knowledge/
    purpose: Collects reusable observations drawn from repository changes.
  - path: .claude/knowledge/patterns/
    purpose: Records the development patterns identified in a reviewed commit.
  - path: .claude/learning/
    purpose: Configures how agent learnings are captured and reported.
  - path: .claude/memory/
    purpose: Retains repository-specific context for use in later sessions.
  - path: .claude/product/
    purpose: Describes the product mission, architecture, technology stack and roadmap.
  - path: .claude/progress/
    purpose: Provides the template for recording work progress.
  - path: .claude/requirements/
    purpose: Documents the requirements process and user-story format.
  - path: .claude/resources/
    purpose: Catalogs agent definitions and templates available for reuse.
  - path: .claude/rules/
    purpose: Defines repository rules for engineering prose, formatting, geometry validation and package releases.
  - path: .claude/skills/
    purpose: Indexes repository skills and provides workflow and engineering instructions.
  - path: .claude/skills/converted-agents/
    purpose: Stores skill definitions converted from existing agent descriptions.
  - path: .claude/skills/engineering/
    purpose: Provides engineering skills for solver modeling, CAD, meshing and cathodic protection.
  - path: .claude/specs/
    purpose: Directs readers to the central location for repository specifications.
  - path: .claude/standards/
    purpose: Defines conventions for code, data files, tests and repository maintenance.
  - path: .claude/sub-agents/
    purpose: Defines the development subagent role.
  - path: .claude/work-queue/
    purpose: Retains review evidence for queued work.
  - path: .claude/work-queue/assets/
    purpose: Stores a work item's review iteration record.
  - path: .claude/workflows/
    purpose: Describes development workflows and how to document their execution.
  - path: .claude/workflows/implementation/
    purpose: Provides planning, change documentation and implementation tracking templates.
  - path: .codex/
    purpose: Records the repository's pointer to shared skills for Codex.
  - path: .gemini/
    purpose: Records the repository's pointer to shared skills for Gemini.
  - path: .githooks/
    purpose: Stores the repository's pre-commit hook.
  - path: .github/
    purpose: Configures dependency updates, code scanning and GitHub Actions workflows.
  - path: .github/ci/
    purpose: Tracks flaky checks for continuous integration.
  - path: .github/codeql/
    purpose: Configures the scope of CodeQL analysis.
  - path: .github/workflows/
    purpose: Defines automation for tests, documentation, releases and repository checks.
  - path: .planning/
    purpose: Collects issue implementation plans and supporting review evidence.
  - path: .planning/plan-approved/
    purpose: Retains issue plans filed under the plan-approved workflow stage.
  - path: .planning/quick/
    purpose: Preserves focused review notes and test output for individual changes.
