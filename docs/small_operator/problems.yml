  # --- C. Supply chain & procurement (the pooling idea) --------------------

  - id: so-supply-001
    category: supply_chain
    status: open
    title: "Every small operator carries its own spares list, and nobody pools them"
    operator: neal-turluck
    evidence:
      post: 'Guide wires, deadman, rods, tubing, rod subs, tubing subs, mud anchor, insert pump, seat nipple, rod boxes, tubing collars, gas anchor, barrel, "word salad."'
      posted: "~2026-08-04 (1 day before capture)"
    the_real_problem: >
      That post title IS the bill of materials for a rod-pump workover. Each
      individual operator holds (or fails to hold) that inventory alone. A single
      missing seat nipple or rod sub idles a rig day. Pooled spares across
      neighbouring operators in one basin turns per-operator dead stock into a
      shared buffer.
    pooling_thesis:
      - "Standardise the BOM: one canonical rod-pump workover parts list with sizes/grades."
      - "Map who holds what within a basin (Illinois Basin, Gulf Coast, etc.)."
      - "Shared reorder points, so the group holds one buffer instead of N partial ones."
      - "Group price discovery — small operators individually have no leverage on service/vendor pricing."
    status_note: >
      Pooling is OUR proposal, not something an operator asked for. Label it as a
      proposal in any outreach; do not present it as community consensus.
      inference: true
    our_capability:
      note: >
        This is not a physics problem — it is a catalogue + reorder-point problem.
        Closest existing substrate: the artificial-lift reference catalogue
        (src/digitalmodel/marine_ops/artificial_lift/reference_catalog.py,
        _reference_catalog_schema.py) which already models equipment catalogues.
      deliverable: "Canonical rod-lift workover BOM as a data file + a shared-inventory reorder model."

