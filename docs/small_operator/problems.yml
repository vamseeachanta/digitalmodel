#
# Source-of-truth list of problems that individual small / marginal operators
# actually voiced, captured from Collide (app.collide.io) plus public research.
# Companion to docs/collide_pe/ (that one solves the "PE Problem of the Day"
# quiz series; this one solves *operators' real field problems*).
#
# Discipline carried over from docs/collide_pe/ and the 2026-07-27 peer-review
# lesson: every named piece of equipment is quoted, never inferred; anything we
