problems:

  # --- A. Artificial lift & well performance -------------------------------

  - id: so-lift-001
    category: lift
    status: open
    title: "Pump-off progression over 5 minutes with no pump-off controller"
    operator: reed-goodman
    evidence:
      post: "Pump cards - dynamometer - what happened?!"
      url: https://app.collide.io/posts/pump-cards-dynamometer-what-happened
      posted: "2026-08-05"
      engagement: {comments: 22, likes: 13}
      operator_quotes:
        - "What happened to my pump card over the course of this 5 minutes?!"
        - "Not on a controller yet"
        - "This is on a C66 and we are designing a clutch kick out... Actually Amplified already did everything On their end. Just waiting on me to go install it."
        - "One of the fun things about these wells is they don't pump off slowly... when they go for it, they..."
    community_answer_summary: >
      Andrew Aday: full barrel -> near-empty barrel across the 5 min; rectangular
      cards = full pump, "pot with a handle" cards = incomplete fillage; remedy is
      slow the unit or set a controller shutdown below a fillage threshold, "usually
      between 65 and 75%". Chance Salinas and Yogashri Pradhan independently said
      slow the unit / reduce runtime. Yogashri also read fluid pound on the downhole card.
    what_is_still_unanswered:
      - "What fillage setpoint and what slow-down schedule for THIS well, from its own cards?"
      - "Does a clutch kick-out (mechanical) get the same result as a fillage-based POC, and where does it differ?"
      - "What is the production loss vs. rod/pump life gained at each setpoint?"
    our_capability:
      module: src/digitalmodel/marine_ops/artificial_lift/dynacard/
      functions:
        - "solver.py — Everitt-Jennings surface->downhole card conversion (the only solver in the repo that genuinely does the conversion; see issue #1857)"
        - "solver.py alarm/setpoint block — emits setpoints + reference"
        - "models.py PumpFillageAnalysis — fillage percent, gross stroke"
        - "diagnostics.py — failure-mode classification with confidence"
        - "lift_capacity.py, power_consumption.py, torque_balance.py, gear_box_loading.py"
      example: docs/small_operator/examples/pumpoff_diagnosis.py
      deliverable: "Per-well fillage-setpoint study: card sequence in, recommended shutdown fillage + expected runtime/production delta out."
    defect_found_and_FIXED_2026_08_05:
      severity: "high — failed toward 'healthy', silently"
      what: >
        Reported pump fillage falls monotonically as the barrel empties (88% full-pump
        anchor, then 64 -> 39 -> 19% through the pounding range) and then JUMPS to
        99.590% and pins there for every more-severe condition.
      root_cause: >
        calculate_corners() (dynacard/corners.py) picks a bottom-right corner index on
        the wrong branch of the card once pounding is severe. calculate_pump_fillage()
        then computes net_stroke from that index, net collapses onto gross, and
        fillage = ~100%.
      reproducer: "docs/small_operator/examples/pumpoff_diagnosis.py — prints ANALYSIS LIMIT FOUND"
      why_uncovered: >
        The artificial_lift suite (997 tests, all passing) asserts only
        `pump_fillage > 0` and `0 <= fillage <= 100`. 99.590 satisfies both. No test
        pins monotonicity of fillage against pump-off severity.
      operational_consequence: >
        Severe fast pump-off is exactly the regime a POC setpoint exists to catch, and
        exactly where this reads "full". Reed stated his wells "don't pump off slowly...
        when they go for it, they go". DO NOT SHIP A SETPOINT until this is fixed.
      status: "FIXED 2026-08-05."
      fix:
        where: src/digitalmodel/marine_ops/artificial_lift/dynacard/corners.py
        what: >
          CornerDetector._reject_untransferred_knee(). A BR corner is rejected
          unless at least 35% of the downstroke's available load drop has
          occurred there, and the search is then repeated over the part of the
          downstroke where load genuinely has transferred.
        threshold_is_measured_not_guessed:
          vendor_wells_realise: [0.675, 0.814, 0.863, 0.866]
          well_formed_synthetic: 1.000
          failure_mode_realises: 0.000
          chosen: 0.35
          note: "Sits in the empty band; cannot fire on any card we have evidence for."
        tests: tests/marine_ops/artificial_lift/dynacard/test_corners.py::TestBottomRightCornerUnderSeverePumpOff
        verification:
          - "Sweep now monotonic: 88.1 -> 64.2 -> 38.9 -> 18.8 -> 16.4 -> 11.9 (was 18.8 -> 99.6 -> 99.6)"
          - "Vendor agreement preserved: wells 2/3/4/5 within +0.13, +0.61, +0.85, -0.01 fillage points"
          - "Full suite 1132 passed"
      rejected_approach:
        what: "Normalising remaining_load over the downstroke's own load span instead of the whole card's."
        why_rejected: >
          Cleaner in principle and it did fix the pounded case — but it broke
          vendor well 4 by 17.5 fillage points. On real cards the load MINIMUM on
          the downstroke sits well past the transfer point because of rod
          undershoot (well 2: transfer at 94% position, minimum at 33%), so
          normalising to it penalises the true corner. Recorded because it is the
          obvious fix and someone will try it again.
    notes:
      - inference: true
        text: >
          "C66" is quoted verbatim from Reed. Do NOT restate it as a gearbox
          rating — the 2026-07-27 review established C-66 is an Arrow gas ENGINE
          designation. Ask Reed what the gearbox is before any torque work.

  - id: so-lift-002
    category: lift
    status: open
    title: "Noise in the bottom-left corner of the downhole card — real signal or processing artefact?"
    operator: reed-goodman
    evidence:
      post: "Pump cards - dynamometer - what happened?!"
      url: https://app.collide.io/posts/pump-cards-dynamometer-what-happened
      operator_quotes:
        - "could the noise in this corner be from gas In The pump decompressing and giving a little lift? Or a delay in valves closing?"
        - "There isn't really any noise here when the pump is full!"
    community_answer_summary: >
      Walter Phillips (3dwellbore.com): if it is an accelerometer-based dyno, do not
      over-read that corner — position is integrated twice from acceleration, so
      per-stroke error accumulates and the derived pump card is especially prone to
      that positional discontinuity; reprocess before concluding. Longer answer: could
      be a pump tag, an echo from the pound, or a fluid-pound-induced pump tag. Later
      correction: gas expansion IS visible, but at the TOP left, not the bottom left;
      the bottom-left is noisy because it is right after the stroke-to-stroke
      discontinuity, before the wave equation settles.
      Andrew Aday: slope near fluid/plunger contact does suggest some gas interference,
      and the shape may be a tag present only when the pump isn't full.
    what_is_still_unanswered:
      - "An objective test that separates accelerometer integration drift from a real pump tag, runnable on the operator's own card file."
      - "Error budget on the derived downhole card — how much of that corner is numerically untrustworthy?"
    our_capability:
      module: src/digitalmodel/marine_ops/artificial_lift/dynacard/
      functions:
        - "feature_extraction.py, load_analysis.py — corner/segment features"
        - "solver.py — wave-equation settling behaviour is explicit, so start-of-stroke transient can be flagged rather than interpreted"
      prior_art: docs/collide_pe/dynacard-undulations/  # digitize.py + error budget precedent
      deliverable: "Card-quality / trust-band report: which parts of a derived downhole card carry enough numerical confidence to diagnose on."
    notes:
      - inference: true
        text: "We have not confirmed Reed's dyno is accelerometer-based; Walter asked and it was not answered in-thread. Ask before assuming."

  - id: so-lift-003
    category: lift
    status: analysed
    title: "Repeated tubing splits, never the same joint"
    operator: reed-goodman
    evidence:
      post: "Tubing Wear - Rod pump"
      url: https://app.collide.io/posts/tubing-wear-rod-pump
      read_on: "2026-08-05"
      operator_quotes:
        - "Regular holes in tubing, typically splits. Never on the same joint. No scale or corrosion issues."
        - "Looking at tubing rotators, lined tubing, better rod guides, optimizing pump off etc etc."
        - "Now the embarrassing question.. does J55 wear faster than L or N80??"
    hypothesis:
      claim: >
        The tubing wear and the pump-off (so-lift-001) are one problem. Fluid pound
        drives the lower rods into compression on the downstroke; compression
        buckles them; buckled rods bear on tubing. "Never the same joint" fits a
        neutral point that MOVES with fillage rather than a fixed defect.
      status: "HYPOTHESIS — must be labelled as one in all outreach. Not yet tested."
      cheap_test: "Ask for the depths of the last several splits and correlate against the computed neutral point."
      if_false: "Look at side load from wellbore deviation instead."
    j55_answer: >
      Directionally yes — wear resistance tracks hardness and J55 is the softest of
      the three. But grade is second-order: side load is the driver, and no grade
      survives a buckled rod indefinitely. Do not give a wear-rate ratio; we have
      no data to support a number.
    our_capability:
      module: src/digitalmodel/well/tubulars/sucker_rod.py
      deliverable: "Side load + neutral-point calculation from card-derived loads, correlated against reported split depths."

  - id: so-lift-004
    category: lift
    status: open
    title: "Under-pressured gas/condensate wildcat — analogue hunt, not a lift problem"
    operator: reed-goodman
    evidence:
      post: "Under pressured/ Low BHP Gas Fields"
      url: https://app.collide.io/posts/under-pressured-low-bhp-gas-fields
      read_on: "2026-08-05"
      operator_quotes:
        - "Can anyone give me examples of Natural Gas/ Condensate Fields that have produced from very low virgin Bottom Hole Pressure?"
        - "I'm looking at a wildcat field that has a massive petroleum system in place, but is lacking reservoir pressure. Lots of gas and condensate. No pressure."
        - "Not even normally pressured, its actually under pressured. It has me scratching my head."
    reclassified: >
      Filed under `lift` from the title alone; on reading, it is not an artificial-lift
      question at all. He is asking for FIELD ANALOGUES for an underpressured
      gas-condensate wildcat — a basin-analysis / petroleum-systems question.
    our_position: >
      Honest answer: analogue selection is not a strength of ours and we should not
      bluff it. Underpressure mechanisms (uplift and erosion, gas expansion during
      exhumation, palaeo-pressure loss, thermal contraction) are well documented, but
      naming specific producing analogues requires basin data we do not hold.
      Better move: point at the mechanism list and say plainly that the analogue
      search is someone else's expertise. Do not include this in the brochure.
    status_note: "Do not answer this one unless we can cite specific fields with sources."

  - id: so-lift-005
    category: lift
    status: analysed
    title: "Undulation on the top end of the card (the original thread)"
    operator: reed-goodman
    evidence:
      post: "Dynamometer Discussions"
      url: https://app.collide.io/posts/dynamometer-discussions
      analysed_on: "2026-07-27"
      re_read_on: "2026-08-05"
      operator_question: "Why is there so much undulation on the top end of the card?"
      well_data_stated_verbatim:
        stroke_at_surface_in: 41
        pump_depth_ft: 4300
        spm: 6.4
        prime_mover: "C-66"    # HIS WORD: "prime mover". An ENGINE. Not a gearbox.
        pump: '1-1/4" top hold down insert pump'
        rod_string: "4200' of 3/4\" steel rods"   # from his in-thread comment
        production: "23 Bbls of oil yesterday. No water"
        casing_psi: 25
        baird_valve_psi: 150
      corrections_received:
        - "Walter Phillips on section 3b ('Those peaks should be equally...')"
        - "Reed supplied the rod string, which changed the conclusions"
      our_two_errors:
        - >
          Quoted a gearbox rating derived from "C-66". Reed's own post calls it the
          PRIME MOVER — an engine designation carrying no gearbox rating. The
          information needed to avoid this error was inside the post we were answering.
        - "Fillage computed off surface stroke instead of plunger stroke."
    still_owed: "A corrected re-issue, run against the raw card file rather than a digitized image."
    still_blocked_on: "A real gearbox make/model/rating. Without it there is no torque or counterbalance work."
    lesson: >
      The C-66 error was avoidable by reading the operator's own words. Hence the
      STATED / ASSUMED split in examples/pumpoff_diagnosis.py.

