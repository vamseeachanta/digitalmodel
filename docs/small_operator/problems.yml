  - id: so-reg-003
    category: regulatory
    status: analysed
    title: "Well-by-well economics for the marginal-well decision, with P&A liability carried"
    operator: [neal-turluck, reed-goodman]
    evidence:
      derived_from: [so-reg-001, so-capital-001, so-maint-002]
      note: >
        Not a single quoted post — it is the question underneath the bonding
        thread, the investor thread and the attention-list thread. An operator
        with 152 wellbores facing a rising bonding regime needs to know, well by
        well: keep, work over, shut in, or plug.
    the_real_problem: >
      Marginal-well decisions get made on gut feel or on a single field-wide
      LOE-per-barrel number, because per-well economics is tedious. Meanwhile the
      P&A liability is usually left out of the comparison entirely, which
      systematically biases the answer toward "keep producing".
    the_insight_that_makes_it_worth_doing: >
      Plugging cost is NOT avoided by producing — it is DEFERRED. So a marginal
      well is not competing against zero, it is competing against paying the P&A
      bill today. Deferral has real time value. That is why wells that lose money
      every month can still rationally stay online, and it is also why a well can
      be worth shutting in rather than either producing OR plugging. Any model
      that omits P&A from the "keep" branch gets this backwards.
    our_capability:
      module: src/digitalmodel/production_engineering/marginal_well_economics.py
      status: "BUILT 2026-08-05 — 34/34 tests passing"
      tests: tests/production_engineering/test_marginal_well_economics.py
      functions:
        - "evaluate_well() — scores KEEP / WORKOVER / SHUT_IN / PLUG_NOW on one comparable basis (every branch ends with the well plugged)"
        - "economic_limit_month() — first month net operating cash goes negative"
        - "price_breakeven() — benchmark oil price at which month-1 cash is zero"
        - "monthly_rate() — Arps exponential/hyperbolic decline"
      inputs_modelled:
        - "fixed opex, variable opex per bbl oil, water disposal per bbl"
        - "annual carry (bond premium, insurance, ad-valorem, reporting) — charged whether or not the well produces"
        - "shut-in / idle-well holding cost"
        - "plugging cost, and bond release as a separate optional inflow"
        - "royalty, severance tax, working interest, price differential"
        - "workover cost / uplift / success probability (probability scales the uplift, not the cost — a failed job still gets invoiced)"
      worked_example_2026_08_05:
        deck: "$65/bbl benchmark, $5 differential, 12.5% royalty, 4.6% severance, $900/mo fixed, $4/bbl oil, $0.75/bbl water, $1,800/yr carry, $45k plugging, 8%/yr decline, 10% discount"
        results:
          - {rate_bopd: 8.0, water_bwpd: 30, month1_cash_usd: 9412, breakeven_usd_bbl: 18.38, decision: KEEP}
          - {rate_bopd: 4.0, water_bwpd: 60, month1_cash_usd: 3154, breakeven_usd_bbl: 33.76, econ_limit_months: 127, decision: KEEP}
          - {rate_bopd: 1.5, water_bwpd: 90, month1_cash_usd: -1014, breakeven_usd_bbl: 91.79, decision: SHUT_IN}
          - {rate_bopd: 0.6, water_bwpd: 120, month1_cash_usd: -2953, breakeven_usd_bbl: 260.03, decision: SHUT_IN}
        reading: >
          The two marginal wells need $92 and $260 oil to break even on operating
          cash, so producing them destroys value — but shutting in still beats
          plugging by about $16k each, purely from deferring the $45k P&A bill.
          That $16k is the number that explains the entire US stripper-well fleet.
        caveat: "Illustrative cost deck, NOT a real operator's numbers. Every input must be replaced with the operator's own before any decision."
    defect_found_and_fixed:
      what: >
        First implementation reported KEEP for a well whose economic limit was
        month 1 — i.e. a well with zero cash-positive months — because deferring
        the P&A bill by a single month scores fractionally better than plugging
        today. A discounting artefact presented as a recommendation.
      fix: "KEEP is withdrawn as an option when no month is cash-positive; a warning says so. Regression test pins it."
    honest_limits:
      - "Screening economics. Not a reserve report, not tax advice, not legal advice."
      - "Deterministic prices. Use price_breakeven() rather than guessing a price deck."
      - "Bond refundability is a REGULATORY question — the module defaults bond_release to zero and warns if you set it."
      - "Shut-in branch evaluates only the horizon endpoint. That is provably sufficient for a constant carry (the NPV is monotonic in plug date, so the optimum is at an endpoint) but NOT for a time-varying carry — e.g. a bonding regime that steps up in 2027."
    follow_on:
      - "Multi-well roll-up: run all 152 wellbores, rank by NPV-at-risk, and show the fleet-level plugging liability against the bond posted."
      - "Step-change carry: model a bonding increase at a known future date, which breaks the endpoint shortcut above and needs a search over plug dates."

