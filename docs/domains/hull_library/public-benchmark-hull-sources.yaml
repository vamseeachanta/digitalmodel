meta:
  description: public benchmark hull source register
  issue_reference: https://github.com/vamseeachanta/digitalmodel/issues/1839
  source_statement: research note on the issue, checked 2026-10-11
  source_comment: https://github.com/vamseeachanta/digitalmodel/issues/1839#issuecomment-6111980881
  date_checked: '2026-10-11'
  grade_legend:
    verified: '**Verified** = geometry location and the quoted particulars were read on a page or repository listing opened during this check.'
    partial: '**Partial** = the files or pages were confirmed, but some particulars could not be read from a primary source (flagged "unverified" in the cell).'
    unverified: '**Unverified** = from memory or a search-result summary only; do not seed the registry from these rows without a second check.'
  terms_legend: '"Terms" quotes the source. Where a source says nothing, the cell says "terms not stated", which is not the same as permission: treat those as cite-and-reference, do not redistribute the files.'
  counts:
    verified: 10
    partial: 6
    unverified: 2
  grade_ids:
    verified: [S1, S2, S3, S4, S5, O1, O3, O4, O5, O6]
    partial: [S6, S7, O2, O7, O8, O9]
    unverified: [S8, S9]
  note_inconsistencies:
  - id: O2
    note: Counts lists O2 as Partial; the Status cell reads "Verified (files, licence); particulars unverified". grade follows Counts; status_note preserves the cell.
  recommendations:
    hydrostatics:
    - {ids: [S1], reason: 'IGES plus offsets, and the source page publishes volume, wetted surface, Cb, Cm, LCB, GM and gyradii, so every hydrostatic output has a published target.'}
    - {ids: [S2], reason: 'same completeness for a full form (Cb 0.81), which exercises the bilge and bulb integration differently from KCS.'}
    - {ids: [O3], reason: 'the reference WAMIT listing prints volume, centre of buoyancy and the restoring coefficients for the exact mesh that is published, which gives a like-for-like multi-column check.'}
    first_order_diffraction_rao:
    - {ids: [O1], reason: 'open mesh, reference coefficients from two solvers, benchmark output in three formats, permissive licence, and it is the case named in this epic.'}
    - {ids: [O3], reason: 'reference inputs and outputs are both published, including all headings at 10 degree spacing.'}
    - {ids: [O2], reason: 'axisymmetric and deep, so it isolates heave and pitch behaviour; run it first as the simplest case. Once its particulars are read from the report it moves to fully verified.'}
    multibody_or_moored:
    - {ids: [O1], reason: the hull is open and the definition report is public. The three-line catenary mooring layout is from memory (unverified); the mooring properties were not read during this check and need to be taken from the report.}
    - {ids: [O4], reason: tendon-moored four-column platform with dimensions confirmed in a public manual; rebuild the mesh from those dimensions.}
    - {ids: [O7, O5], reason: 'the first is openly licensed, the second has confirmed dimensions and a known gap resonance. Neither has tabulated reference results confirmed here.'}
  recommendation_notes:
  - For a ship form, KCS (S1) and the 5512 geosim of DTMB 5415 (S3) are the only ones with confirmed measured wave responses, and only the 5512 set includes zero speed.
  - Public multibody and moored references are the thinnest part of this register. None of the three has reference results that were read as numbers during this check.
  unconfirmed_leads:
  - '**Wigley**: no primary page opened. Needs the hull equation and the TU Delft 1992 report located in the university repository.'
  - '**S-175**: no open geometry found; particulars are from a secondary summary.'
  - '**Series 60**: no offsets file found; the pages describe data but do not link the files.'
  - '**DTC**: geometry link confirmed, but particulars and test data were not read from the 2012 paper.'
  - '**DTMB 5415**: the IIHR IGES link did not respond, and the bare-hull archive on the workshop site is only 10.9 kB, so its content needs checking before it is relied on. The 5512 measured data files are not linked from the data pages.'
  - '**OC4 and OC3 definition reports**: located and confirmed as public PDFs, but the text could not be extracted, so draft, volume, water depth and mooring data are flagged unverified in rows O1 and O2.'
  - '**OC5 and OC6**: a definition PDF for OC5 Phase II appeared in search results, and the data portal redirects to a new host whose project page did not render. Dataset contents and access conditions are unconfirmed.'
  - '**SIMMAN 2014 and 2020, Gothenburg 2010**: sites not reachable or not opened. The SIMMAN 2008 site answers on plain HTTP only (its certificate does not match the host name).'
  - '**KVLCC1 and the HSVA tanker**: KVLCC1 is listed on the SIMMAN 2008 site; its geometry page was not opened. Nothing was found for the HSVA tanker.'
  - '**Intact-stability benchmark repository** (shipstab.org data access, including an "ITTC-Box" reference ship): seen in search results only.'
  - '**Classification-society and commercial solver validation manuals** (other than the WAMIT manual): not searched.'
  - '**Reuse terms**: every workshop and university source is silent on terms. Only the four code repositories (Apache-2.0) and the WAMIT demonstration package (restrictive) state anything.'
  suggested_use: 'Suggested use for the registry: seed from the Apache-2.0 rows first (O1, O2, O3, O6), reference the workshop hulls by URL and checksum rather than vendoring the files, and rebuild the box and TLP cases from published dimensions.'
  scope: No geometry was downloaded.
  geometry_availability_legend: Geometry availability describes the source note; it does not establish reuse permission. "dimensions only" identifies the manual-based cases whose demonstration files have restrictive terms.
