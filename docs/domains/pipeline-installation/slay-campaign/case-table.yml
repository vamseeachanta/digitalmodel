  decision: Production anchor spans will use zero-excess weight-only seeds.
    Combined span and arc corrections close both hand-model quantities, as
    recorded per case below; they are counterfactuals, not production designs.
    Stinger length remains a maintainer case-design decision before production.
    Finite bending stiffness, lift-off and reactions are absent from the screen.
    QA shall converge with positive wire length, End A within the lead,
    nonnegative grounded effective tension and maximum overbend strain <= 0.00254.
    This QA screen does not establish installation design acceptance.
  additional_static_suspects: The pipe axis at seabed level and bending/contact
    residuals remain unresolved. Torsion is now excluded using the saved free-end
    form. Prior nonconvergence cannot be attributed to tip angle without residuals.
