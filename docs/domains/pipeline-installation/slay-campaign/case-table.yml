static_equilibrium_screen:
  model: Weight-only, inextensible empty pipe; smooth circular support arc,
    frictionless supports and horizontal touchdown. Bending, contact loss,
    seabed friction and free End A motion are excluded.
  equations:
    weight: Annular steel and coating mass minus displaced water, times gravity.
    tip_tension: T_tip = T_A + w * (z_tip - z_A)
    horizontal_tension: H = T_tip - w * h
    suspended_length: s = sqrt(h*h + 2*(H/w)*h)
    suspended_span: x = (H/w) * acosh(1 + h/(H/w))
    departure: alpha = acos(H/T_tip)
    taut_anchor_span: D = R*sin(S/R) + x + L - S - s
    angle_only: At fixed R, solve (T_A - w*R*(1-cos(theta)))*cos(theta)
      = T_A - w*depth; set S = R*theta and re-evaluate length closure.
  tolerances:
    length_m: 0.1
    angle_deg: 0.1
    meaning: Arithmetic reproduction tolerances only; not physical model accuracy
      or a native convergence criterion. Touchdown is approximated at the seabed
      surface; omitting the coated radius understates excess by 0.2-0.4 m.
  prior_d0_t0_seed:
    submerged_weight_kn_m: 5.2
    pipe_axis_height_m: 34.7
    tip_tension_kn: 390.5
    horizontal_tension_kn: 209.1
    suspended_length_m: 63.1
    suspended_span_m: 49.5
    supported_arc_m: 40.0
    supported_projection_m: 39.5
    grounded_remainder_m: 1871.0
    taut_pipe_length_m: 1974.1
    supplied_pipe_length_m: 2000.0
    excess_m: 25.9
    initial_forward_lead_m: 10.0
    implied_forward_travel_m: 25.9
    travel_beyond_initial_lead_m: 15.9
    taut_anchor_span_m: 1985.9
    taut_anchor_x_m: -2077.0
    tip_angle_deg: 15.3
    departure_angle_deg: 57.6
    length_only: Zero excess at the taut anchor span leaves a 42.3 degree
      tangent mismatch, outside the 0.1 degree tolerance.
    angle_only: Extending the supported arc at radius 150.0 m to 96.5 m
      gives a 36.9 degree tip and departure angle but leaves 31.2 m excess,
      beyond the 10.0 m initial lead. It is a counterfactual, not a design.
    roller_surface: Using the roller surface instead of the pipe axis gives
      26.2 m excess and 57.4 degrees departure. The earlier 57.2 degree
      screen is not reproduced.
