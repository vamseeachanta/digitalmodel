static_equilibrium_screen:
  model: Weight-only, inextensible empty pipe; smooth circular support arc,
    frictionless supports and horizontal touchdown. Bending, contact loss,
    seabed friction and free End A motion are excluded.
  equations:
    weight: Annular steel and coating mass minus displaced water, times gravity.
    tip_tension: T_tip = T_A + w * (z_tip - z_A)
    horizontal_tension: H = T_tip - w * h
    suspended_length: s = sqrt(h*h + 2*(H/w)*h)
    suspended_span: x = (H/w) * acosh(1 + h/(H/w))
    departure: alpha = acos(H/T_tip)
    taut_anchor_span: D = R*sin(S/R) + x + L - S - s
    angle_only: At fixed R, solve (T_A - w*R*(1-cos(theta)))*cos(theta)
      = T_A - w*depth; set S = R*theta and re-evaluate length closure.
  tolerances:
    length_m: 0.1
    angle_deg: 0.1
    meaning: Arithmetic reproduction tolerances only; not physical model accuracy
      or a native convergence criterion. Touchdown is approximated at the seabed
      surface; omitting the coated radius understates excess by 0.2-0.4 m.
  prior_d0_t0_seed:
    submerged_weight_kn_m: 5.2
    pipe_axis_height_m: 34.7
    tip_tension_kn: 390.5
    horizontal_tension_kn: 209.1
    suspended_length_m: 63.1
    suspended_span_m: 49.5
    supported_arc_m: 40.0
    supported_projection_m: 39.5
    grounded_remainder_m: 1871.0
    taut_pipe_length_m: 1974.1
    supplied_pipe_length_m: 2000.0
    excess_m: 25.9
    initial_forward_lead_m: 10.0
    implied_forward_travel_m: 25.9
    travel_beyond_initial_lead_m: 15.9
    taut_anchor_span_m: 1985.9
    taut_anchor_x_m: -2077.0
    tip_angle_deg: 15.3
    departure_angle_deg: 57.6
    length_only: Zero excess at the taut anchor span leaves a 42.3 degree
      tangent mismatch, outside the 0.1 degree tolerance.
    angle_only: Extending the supported arc at radius 150.0 m to 96.5 m
      gives a 36.9 degree tip and departure angle but leaves 31.2 m excess,
      beyond the 10.0 m initial lead. It is a counterfactual, not a design.
    roller_surface: Using the roller surface instead of the pipe axis gives
      26.2 m excess and 57.4 degrees departure. The earlier 57.2 degree
      screen is not reproduced.
  all_cases:
  # Weight-only bound, with unrounded intermediate calculations.
  - {id: d0-t0, excess_m: -5.4, departure_deg: 54.1, angle_only_arc_m: 96.5, angle_only_tip_deg: 36.9, angle_only_excess_m: -2.5, combined_arc_m: 96.5, combined_span_m: 1991.2}
  - {id: d0-t1, excess_m: -3.0, departure_deg: 42.3, angle_only_arc_m: 86.8, angle_only_tip_deg: 33.2, angle_only_excess_m: -1.8, combined_arc_m: 86.8, combined_span_m: 1992.1}
  - {id: d0-t2, excess_m: -1.9, departure_deg: 35.9, angle_only_arc_m: 79.8, angle_only_tip_deg: 30.5, angle_only_excess_m: -1.4, combined_arc_m: 79.8, combined_span_m: 1992.7}
  - {id: d1-t0, excess_m: -5.4, departure_deg: 53.3, angle_only_arc_m: 119.8, angle_only_tip_deg: 45.8, angle_only_excess_m: -3.6, combined_arc_m: 119.8, combined_span_m: 1977.5}
  - {id: d1-t1, excess_m: -2.1, departure_deg: 41.6, angle_only_arc_m: 102.5, angle_only_tip_deg: 39.2, angle_only_excess_m: -1.9, combined_arc_m: 102.5, combined_span_m: 1980.9}
  - {id: d1-t2, excess_m: -1.1, departure_deg: 35.2, angle_only_arc_m: 91.6, angle_only_tip_deg: 35.0, angle_only_excess_m: -1.1, combined_arc_m: 91.6, combined_span_m: 1983.1}
  decision: >-
    Declared End B positions use the stiff hand estimate, Table B.
    The weight-only screen is retained as a bound only, not the design basis.
    The 40 m layout is superseded; Table A reported excessive tip curvature
    and nonzero tip reaction. The revised layout adds a 60 m firing line and
    depth-specific stingers. D/(2R) = 0.00254 is a screen, not a pass criterion.
    Static QA requires a 5-15 m wire, nonnegative End A support reaction,
    S1 strain <= 1.10*D/(2R) with zero last-stinger-support force, lift-off arc
    within 5 m, departure within 3 degrees, and nonnegative grounded tension.
    Touchdown x, sag-bend strain and stiff closure are NOT_EVALUATED:
    published reference pending, #2608. Their future comparison bands are
    touchdown x within 10 m, sag-bend strain within 20 percent of Table B,
    and stiff excess between 0 m and the 10 m lead; no reference is substituted.
    This QA screen does not establish installation design acceptance.
  additional_static_suspects: Native bending/contact residuals require fresh
    readback. Anchored End B is one coated radius above the seabed. Torsion is
    excluded using the saved free-end form.
