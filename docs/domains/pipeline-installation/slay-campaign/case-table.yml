static_equilibrium_screen:
  model: Weight-only, inextensible empty pipe; smooth circular support arc,
    frictionless supports and horizontal touchdown. Bending, contact loss,
    seabed friction and free End A motion are excluded.
  equations:
    weight: Annular steel and coating mass minus displaced water, times gravity.
    tip_tension: T_tip = T_A + w * (z_tip - z_A)
    horizontal_tension: H = T_tip - w * h
    suspended_length: s = sqrt(h*h + 2*(H/w)*h)
    suspended_span: x = (H/w) * acosh(1 + h/(H/w))
    departure: alpha = acos(H/T_tip)
    taut_anchor_span: D = R*sin(S/R) + x + L - S - s
    angle_only: At fixed R, solve (T_A - w*R*(1-cos(theta)))*cos(theta)
      = T_A - w*depth; set S = R*theta and re-evaluate length closure.
  tolerances:
    length_m: 0.1
    angle_deg: 0.1
    meaning: Hand-model compatibility only; not a native convergence criterion.
  d0_t0:
    submerged_weight_kn_m: 5.2
    pipe_axis_height_m: 34.7
    tip_tension_kn: 390.5
    horizontal_tension_kn: 209.1
    suspended_length_m: 63.1
    suspended_span_m: 49.5
    supported_arc_m: 40.0
    supported_projection_m: 39.5
    grounded_remainder_m: 1871.0
    taut_pipe_length_m: 1974.1
    supplied_pipe_length_m: 2000.0
    excess_m: 25.9
    initial_forward_lead_m: 10.0
    implied_forward_travel_m: 25.9
    travel_beyond_initial_lead_m: 15.9
    taut_anchor_span_m: 1985.9
    taut_anchor_x_m: -2077.0
    tip_angle_deg: 15.3
    departure_angle_deg: 57.6
    length_only: Zero excess at the taut anchor span leaves a 42.3 degree
      tangent mismatch, outside the 0.1 degree tolerance.
    angle_only: Extending the supported arc at radius 150.0 m to 96.5 m
      gives a 36.9 degree tip and departure angle but leaves 31.2 m excess,
      beyond the 10.0 m initial lead. It is a counterfactual, not a design.
    roller_surface: Using the roller surface instead of the pipe axis gives
      26.2 m excess and 57.4 degrees departure. The earlier 57.2 degree
      screen is not reproduced.
  all_cases:
  # Computed without rounding intermediate values; displayed figures only.
  # Angle-only holds radius fixed and extends the supported arc.
  - {id: d0-t0, excess_m: 25.9, departure_deg: 57.6, angle_only_arc_m: 96.5, angle_only_tip_deg: 36.9, angle_only_excess_m: 31.2}
  - {id: d0-t1, excess_m: 29.4, departure_deg: 45.8, angle_only_arc_m: 86.8, angle_only_tip_deg: 33.2, angle_only_excess_m: 32.1}
  - {id: d0-t2, excess_m: 31.1, departure_deg: 39.1, angle_only_arc_m: 79.8, angle_only_tip_deg: 30.5, angle_only_excess_m: 32.7}
  - {id: d1-t0, excess_m: 49.3, departure_deg: 58.9, angle_only_arc_m: 119.8, angle_only_tip_deg: 45.8, angle_only_excess_m: 57.5}
  - {id: d1-t1, excess_m: 57.0, departure_deg: 47.0, angle_only_arc_m: 102.5, angle_only_tip_deg: 39.2, angle_only_excess_m: 60.9}
  - {id: d1-t2, excess_m: 60.7, departure_deg: 40.3, angle_only_arc_m: 91.6, angle_only_tip_deg: 35.0, angle_only_excess_m: 63.1}
  decision: Neither isolated correction closes both hand-model quantities.
    The initial lead is a separation, not an enforced travel bound; forward
    travel changes the supported arc and wire geometry. Finite bending stiffness,
    lift-off and reactions are absent from the hand model. No governing native
    constraint is established. The six production layouts remain unchanged.
  additional_static_suspects: Existing zero twisting restraint with torsion
    included, and anchor axis at seabed level, may affect convergence. The probe
    preserves both so that anchor span is the only controlled variable;
    nonconvergence cannot be attributed to the tip angle without residuals.
  probe:
    id: d0-t0-anchor-span
    production_case: false
    generator: digitalmodel.solvers.orcaflex.modular_generator.slay_probe.prepare_anchor_span_probe
    variant: probes/d0-t0-anchor-span.yml
    manifest: probes/d0-t0-anchor-span.json
    control: Only End B x changes, from -2051.1 m to -2077.0 m; continue
      the initial 1960.0 m anchor span toward 1985.9 m with loads and supports fixed.
      Full precision comes from the generator, not these rounded figures.
    required_readings:
    - End A displacement relative to its initial position and the tensioner lead
    - Wire direction and positive wire length
    - Active roller contacts and departure slope
    - Whole-system force residuals, including torsional residuals
    - Tip contact force and curvature, and maximum overbend strain against 0.00254
    - Effective tension along the grounded pipe, including any compression
    interpretation: Convergence with positive wire length and the intended
      force/contact state would show that length closure is sufficient for this
      configuration. Failure alone does not establish the angle as governing.
      Native load and statics remain unverified; no execution or queue is prepared.
