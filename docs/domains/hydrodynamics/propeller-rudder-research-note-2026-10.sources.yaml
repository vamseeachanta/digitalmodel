equations:
- number: eq. 1
  name: Rudder normal force
  text: F_N = 0.5 rho A_R V_R^2 C_N
  printed_in: Liu, Quadvlieg and Hekkenberg 2016
  attributed_to: Yasukawa and Yoshimura
  primary_opened: false
- number: eq. 2
  name: Normal-force coefficient
  text: C_N = 6.13 sin(alpha_R) Lambda / (Lambda + 2.25), with Lambda the geometric aspect ratio
  printed_in: Liu, Quadvlieg and Hekkenberg 2016
  attributed_to: Fujii; Fujii and Tsuda
  primary_opened: false
- number: eq. 13
  name: Rudder forces on the ship
  text: X_R = -(1 - t_R) F_N sin(delta); Y_R = -(1 + a_H) F_N cos(delta); N_R = -(x_R + a_H x_H) F_N cos(delta)
  printed_in: Liu, Quadvlieg and Hekkenberg 2016
  attributed_to: Yasukawa and Yoshimura
  primary_opened: false
- number: eq. 14
  name: Effective rudder angle
  text: alpha_R = delta - arctan(v_R / u_R)
  printed_in: Liu, Quadvlieg and Hekkenberg 2016
  attributed_to: Yasukawa and Yoshimura
  primary_opened: false
- number: eq. 15
  name: Longitudinal inflow
  text: u_R = u (1 - w_R) sqrt( eta [ 1 + kappa ( sqrt(1 + 8 K_T / (pi J^2)) - 1 ) ]^2 + (1 - eta) ), where w_R is the wake factor at the rudder, kappa "an experimental constant" and eta the ratio of propeller diameter to rudder span
  printed_in: Liu, Quadvlieg and Hekkenberg 2016
  attributed_to: Yasukawa and Yoshimura
  primary_opened: false
- number: eq. 16
  name: Lateral inflow
  text: v_R = V gamma_R (beta - l'_R r'), gamma_R the flow-straightening factor, different to port and starboard
  printed_in: Liu, Quadvlieg and Hekkenberg 2016
  attributed_to: Yasukawa and Yoshimura
  primary_opened: false
- number: eqs. 11, 12
  name: Propeller wake in manoeuvring
  text: beta_P = beta - x'_P r'; (1 - w_P) / (1 - w_P0) = 1 + [1 - exp(-C_1 |beta_P|)] (C_2 - 1)
  printed_in: Liu, Quadvlieg and Hekkenberg 2016
  attributed_to: Yasukawa and Yoshimura
  primary_opened: false
