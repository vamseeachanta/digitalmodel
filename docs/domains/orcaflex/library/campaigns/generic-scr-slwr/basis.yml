    locator: https://github.com/vamseeachanta/digitalmodel/pull/2469
    revision: 14998ee8a2d28ed7bcf3f0d8ad209504bad714fa
  ndbc_2002:
    title: NOAA National Data Buoy Center, station 42001, standard meteorological observations, 2002
    locator: https://www.ndbc.noaa.gov/data/historical/stdmet/42001h2002.txt.gz
    sha256: 3ac189473a1fabda16fed87d3ce8ee0c8cb91136ef728f89dddbb95522940d4a
    record: 2002-10-02 21:00 UTC; source line 6599; WVHT 11.20 m; DPD 12.90 s
    ordinary_record: 2002-01-01 00:00 UTC; source line 2; WVHT 2.13 m; DPD 7.69 s
    qualification: Retained compressed bytes match the source manifest. Observation pairs only; neither
      return-period estimates nor fatigue exposure.
    observed_at: '2026-10-14'
    live_access: Station page returned HTTP 403; archive fetch returned cache miss. Retained source
      read instead.
  generator_defaults:
    title: Existing typed schema and builder numeric defaults
    revision: c9ae7591129b40732846b50661045f99ab249aba
    locator: src/digitalmodel/solvers/orcaflex/modular_generator/
    reason: Unspecified environmental, line, vessel and simulation properties are inherited unchanged
      from the existing generator; they are illustrative assumptions, not qualified engineering input.
  criteria_titles:
    title: Repository criteria references and method outline
    revision: c9ae7591129b40732846b50661045f99ab249aba
    locator: src/digitalmodel/structural/analysis/wall_thickness_codes/dnv_st_f201.py
    reason: The 2021 edition and Bursting clause title are read from the repository. Other code titles
      identify the requested future checks; their editions and clauses remain unknown.
