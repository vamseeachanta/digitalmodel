schema_version: generic-steel-riser-basis-v1
summary: Generic steel catenary and distributed-buoyancy lazy-wave inputs with solver-free analytical
  references.
revision_history:
- revision: '0'
  date: '2026-10-14'
  change: Initial parameter basis and analytical calibration inputs; native equilibrium and design
    acceptance remain unverified.
readiness: prepared; not qualified for design or outward use
pipe_grade: X65
host:
  selection: Solver example vessel type; public hull alternative remains unmerged.
  type_name: Vessel Type1
  motion: None; RAOs and coupled host motion are not established.
  rights: Example-derived inputs; redistribution terms require confirmation before outward model
    sharing.
hangoff: Ideal pinned flex-joint approximation; zero rotational stiffness.
metocean:
  agency: NOAA National Data Buoy Center
  station: '42001'
  region: Gulf of Mexico
  extreme: Observed storm pair only; no return period assigned.
  fatigue: Illustrative ordinary observation only; no scatter diagram or exposure weights established.
  current: Assumed scaled template profile; calibration models use zero current.
  wind: Omitted from static reference.
analytical_scope: Zero mean host offset, quiescent water, inextensible OO geometry and elastic general
  catenary segment checks. Pipe centre at contact radius above seabed. No pressure, bending/contact
  soil response, wave dynamics, VIV or code acceptance.
