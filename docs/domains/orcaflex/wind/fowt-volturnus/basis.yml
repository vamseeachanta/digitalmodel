  reason: 'Both readings of published F24:K24 are propagated: at the RNA CG, or at
    tower top with CG tensor F-P. The tower-top reading is adopted as assumed because
    swapping the source tensor labels gives the lower relative identity residual.
    Retaining F rather than L as the trusted endpoint is an additional assumption;
    L24:Q24 remains the independent published comparator. Neither resolves the source
    discrepancy.'
