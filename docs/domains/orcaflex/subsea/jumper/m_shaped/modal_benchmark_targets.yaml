  mj02:
    spec_file: docs/domains/orcaflex/library/model_library/mj02_zhu2022_m_jumper_fullscale/spec.yml
    reference_kind: published numerical result
    requested_modes_minimum: 1
    citation: &mj02_citation |
      Zhu, Hu, Tang, Ji, Zhou, "Evolution of Gas-Liquid Two-Phase Flow in an
      M-Shaped Jumper and the Resultant Flow-Induced Vibration Response",
      Processes 10(10):2133, 2022 (open access):
      https://www.mdpi.com/2227-9717/10/10/2133
    citation_source: {file: docs/domains/orcaflex/library/model_library/mj02_zhu2022_m_jumper_fullscale/spec.yml, line_start: 5, line_end: 8}
    frequency_sources: &mj02_frequency_sources
      - {file: docs/domains/orcaflex/library/model_library/mj02_zhu2022_m_jumper_fullscale/spec.yml, line_start: 18, line_end: 19}
    direction_availability: first mode out-of-plane
    shape_availability: not held in the repository
    assumptions:
      - text: |
          A1: water depth not published; 100 m assumed, jumper flanges at z=-95
          (mid-span dip 3 m above seabed)
        source: {file: docs/domains/orcaflex/library/model_library/mj02_zhu2022_m_jumper_fullscale/spec.yml, line_start: 23, line_end: 24}
      - text: |
          A2: end fixity assumed clamped (flanged connections to subsea equipment)
        source: {file: docs/domains/orcaflex/library/model_library/mj02_zhu2022_m_jumper_fullscale/spec.yml, line_start: 25, line_end: 25}
      - text: |
          A3: drag/added-mass coefficients not published (paper is internal-flow
          FIV); Cd=1.2 / Ca=1.0 standard bare-pipe values assumed
        source: {file: docs/domains/orcaflex/library/model_library/mj02_zhu2022_m_jumper_fullscale/spec.yml, line_start: 26, line_end: 27}
      - text: |
          A4: contents density not tabulated (gas-oil multiphase at 6 MPa);
          ContentsDensity 0 placeholder — set per analysis load case
        source: {file: docs/domains/orcaflex/library/model_library/mj02_zhu2022_m_jumper_fullscale/spec.yml, line_start: 28, line_end: 29}
    modes:
      - {mode: 1, frequency_hz: 1.464, direction: out-of-plane,
         availability: approximate published value, citation: *mj02_citation, sources: *mj02_frequency_sources}
