# Typed riser example: lazy wave with the buoyant section given as a zone.
#
# Derived from library/templates/riser_lazy_wave/spec.yml (public OrcaFlex
# example A01 Lazy wave riser). The bare line is given as three sections
# (50 m at 4 m, 120 m at 1 m, 20 m at 4 m mesh) and the buoyant section as
# buoyancy_zone 80 m to 130 m from End A. The generator splits the section
# table at the zone ends (digitalmodel #3973), which reproduces the native
# A01 table: 50/4, 30/1, 50/1 (floats), 40/1, 20/4.
#
# Generate:
#   python -m digitalmodel.solvers.orcaflex.modular_generator generate \
#       --input spec.yml --output modular/

metadata:
  name: riser_lazy_wave_zone
  description: Lazy wave riser with the buoyant section given as a buoyancy zone
  structure: riser
  operation: production
  project: OrcaFlex Templates
  version: '1.0'
environment:
  water:
    depth: 100
    density: 1.025
  seabed:
    type: flat
    stiffness:
      normal: 100
      shear: 100
  waves:
    type: dean_stream
    height: 6
    period: 7
    direction: 90
    stream_order: 5
  current:
    speed: 0.7
    direction: 180
    profile:
    - - 0
      - 1.0
    - - 70
      - 0.9
    - - 100
      - 0.3
  wind:
    speed: 0
    direction: 0
riser:
  vessel:
    name: FPSO
    type_name: Vessel Type1
    length: 103
    position:
    - -35
    - 0
    - 0
    orientation:
    - 0
    - 0
    - 270
    primary_motion: None
    superimposed_motion: RAOs + harmonics
    included_in_statics: None
  line_types:
  - name: 10in_flexible
    description: 10 inch flexible riser pipe
    outer_diameter: 0.3556
    inner_diameter: 0.254
    mass_per_length: 0.1842262
    bending_stiffness: 124.87
    axial_stiffness: 711200
    torsional_stiffness: 10
    poisson_ratio: 0.5
    added_mass_coefficient: 1.0
    drag_coefficient: 1.2
    axial_drag_coefficient: 0.008
    allowable_tension: 5000
    min_bend_radius: 3.675
  - name: 10in_flexible_with_floats
    description: 10 inch flexible with distributed buoyancy (smeared)
    outer_diameter: 0.8074
    inner_diameter: 0.254
    contact_diameter: 1.2
    mass_per_length: 0.3593
    bending_stiffness: 124.87
    axial_stiffness: 711200
    torsional_stiffness: 10
    poisson_ratio: 0.5
    added_mass_coefficient: 1.0
    drag_coefficient: 1.2
    axial_drag_coefficient: 0.008
    allowable_tension: 5000
    min_bend_radius: 3.675
    stress_od: 0.3556
    stress_id: 0.254
  clump_types: []
  lines:
  - name: 10in Lazy Wave Distributed
    configuration: lazy_wave
    end_a:
      type: vessel
      name: FPSO
      position:
      - 36
      - 1.732
      - -7.5
      declination: 170
      azimuth: 60
      bending_stiffness: 0
    end_b:
      type: anchor
      position:
      - 89.5
      - -35
      - 0.178
      declination: 90
      azimuth: 0
      bending_stiffness: 0
    sections:
    - line_type: 10in_flexible
      length: 50
      segment_length: 4
    - line_type: 10in_flexible
      length: 120
      segment_length: 1
    - line_type: 10in_flexible
      length: 20
      segment_length: 4
    contents:
      density: 1.0
      pressure: 0
    statics_method: Catenary
    statics_step2: Full statics
    lay_azimuth: 180.5
    buoyancy_zone:
      start_arc_length: 80
      end_arc_length: 130
      line_type: 10in_flexible_with_floats
simulation:
  duration: 42
  time_step: 0.1
