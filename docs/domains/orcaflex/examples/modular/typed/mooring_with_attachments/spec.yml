# Typed mooring example: chain-polyester-chain legs with a clump weight and a
# submerged buoy on each leg (digitalmodel #3975).
#
# Generating the full model needs the generic host vessel accepted next to a
# typed mooring (digitalmodel #3972). The tests for #3975 exercise the schema
# and the mooring router on the `mooring` section of this file.
#
# Leg (anchor = End A to fairlead = End B): 300 m R3 76 mm chain, 500 m
# polyester 160 mm, 100 m R3 76 mm chain. Attachments, arc length from the
# anchor: clump weight at 250 m, submerged buoy at 300 m (chain-polyester
# joint). All values are illustrative input data, not a design.
# Chain and polyester line-type properties are the router defaults (see #3981
# and #3982); they are not qualified by this example.
#
# Constants and sources (retrieved 2026-11-13):
#   [1] g = 9.80665 m/s2, standard acceleration of gravity (exact), NIST
#       CODATA: https://physics.nist.gov/cgi-bin/cuu/Value?gn
#   [2] Orcina public example "A01 Catenary and wave systems",
#       https://www.orcina.com/resources/examples/ ; committed copy
#       docs/domains/orcaflex/examples/modular/A01/A01 Lazy wave riser/.
#       Its sea density (03_environment.yml, Density) is 1.025 te/m3, the
#       value of environment.water.density below. Its clump type "Module"
#       (01_general.yml) gives Cd [0.6444, ~, 1.027879287] and
#       Ca [1, ~, 0.5]; both clump types below use these (normal, axial)
#       values. "Module" is a riser buoyancy module, not the cylinders
#       below: the coefficients are traceable example values, not
#       hydrodynamic coefficients qualified for these bodies.
#
# Hand checks (seawater density from environment.water.density [2], g [1]):
#   Clump20te: mass 20 te, volume 2.548 m3 (input; equal to 20 / 7.85, a
#     steel density of 7.85 te/m3 assumed, based on previous experience,
#     only to choose the volume); submerged weight
#     (20 - 1.025 x 2.548) g = 170.5 kN.
#   SubBuoy: mass 5 te, volume 25 m3; net upthrust (1.025 x 25 - 5) g
#     = 202.3 kN.
#   Drag areas are the side and end areas of the stated cylinders.
#   Without #3972 the tests generate the model by placing the routed mooring
#   in a generic-only specification with the host vessel below.
#   Anchor positions are those of the mooring_spread_catenary example; the
#   attachments change the static shape, so no anchor-radius check is claimed.
#
# Generate (after #3972):
#   python -m digitalmodel.solvers.orcaflex.modular_generator generate \
#       --input spec.yml --output modular/

metadata:
  name: "mooring_with_attachments"
  description: "Chain-polyester-chain legs with clump weights and submerged buoys"
  structure: mooring
  operation: inplace
  project: "OrcaFlex typed examples"
  version: "1.0"

environment:
  water:
    depth: 200
    density: 1.025
  seabed:
    stiffness:
      normal: 100
      shear: 100

mooring:
  clump_types:
    - name: "Clump20te"
      mass: 20
      volume: 2.548
      height: 1.5
      drag_area: [2.2, 1.7]         # cylinder 1.47 m dia x 1.5 m: side, end (m2)
      drag_coefficient: [0.6444, 1.027879287]   # [2] Module clump type
      added_mass_coefficient: [1.0, 0.5]        # [2] Module clump type
    - name: "SubBuoy"
      mass: 5
      volume: 25
      height: 3.6
      drag_area: [10.7, 6.9]        # cylinder 2.97 m dia x 3.6 m: side, end (m2)
      drag_coefficient: [0.6444, 1.027879287]   # [2] Module clump type
      added_mass_coefficient: [1.0, 0.5]        # [2] Module clump type
  lines:
    - name: "Leg1"
      segments:
        - {type: chain, diameter: 0.076, length: 300, grade: R3, segment_length: 10}
        - {type: polyester, diameter: 0.160, length: 500, segment_length: 10}
        - {type: chain, diameter: 0.076, length: 100, grade: R3, segment_length: 5}
      anchor: {type: anchor, position: [848.0, 212.0, -200]}
      fairlead: {type: fairlead, position: [40, 10, -10], vessel: "FPSO"}
      attachments:
        - {clump_type: "SubBuoy", arc_length: 300}
        - {clump_type: "Clump20te", arc_length: 250}
    - name: "Leg2"
      segments:
        - {type: chain, diameter: 0.076, length: 300, grade: R3, segment_length: 10}
        - {type: polyester, diameter: 0.160, length: 500, segment_length: 10}
        - {type: chain, diameter: 0.076, length: 100, grade: R3, segment_length: 5}
      anchor: {type: anchor, position: [-848.0, 212.0, -200]}
      fairlead: {type: fairlead, position: [-40, 10, -10], vessel: "FPSO"}
      attachments:
        - {clump_type: "Clump20te", arc_length: 250}
        - {clump_type: "SubBuoy", arc_length: 300}
    - name: "Leg3"
      segments:
        - {type: chain, diameter: 0.076, length: 300, grade: R3, segment_length: 10}
        - {type: polyester, diameter: 0.160, length: 500, segment_length: 10}
        - {type: chain, diameter: 0.076, length: 100, grade: R3, segment_length: 5}
      anchor: {type: anchor, position: [-848.0, -212.0, -200]}
      fairlead: {type: fairlead, position: [-40, -10, -10], vessel: "FPSO"}
      attachments:
        - {clump_type: "Clump20te", arc_length: 250}
        - {clump_type: "SubBuoy", arc_length: 300}
    - name: "Leg4"
      segments:
        - {type: chain, diameter: 0.076, length: 300, grade: R3, segment_length: 10}
        - {type: polyester, diameter: 0.160, length: 500, segment_length: 10}
        - {type: chain, diameter: 0.076, length: 100, grade: R3, segment_length: 5}
      anchor: {type: anchor, position: [848.0, -212.0, -200]}
      fairlead: {type: fairlead, position: [40, -10, -10], vessel: "FPSO"}
      attachments:
        - {clump_type: "Clump20te", arc_length: 250}
        - {clump_type: "SubBuoy", arc_length: 300}

generic:
  vessels:
    - name: "FPSO"
      vessel_type: "Vessel Type1"
      connection: "Free"
      initial_position: [0, 0, 0]
      properties:
        InitialHeading: 0
        PrimaryMotion: "None"
        SuperimposedMotion: "None"
        IncludedInStatics: "None"
