# Typed pipelay example: J-lay from a tower (digitalmodel #3978).
#
# 12.75 in X65 pipe, wall 20.6 mm, 3 mm coating at 0.95 te/m3, 3000 m long,
# laid in 1000 m water depth from a tower hang-off 30 m above the waterline,
# 8 deg from vertical, leaning aft. All values are illustrative input data,
# not a design. Related: #2765 (J-lay qualification in the pipelay
# calculation pack), #2431 (pipelay workflow).
#
# Hand check (inextensible catenary, pipe empty, g 9.80665 m/s2, seawater
# 1.025 te/m3). The generated line states ContentsDensity 0 to match the
# empty-pipe seed. Steel density 7.85 te/m3 is the generator's X65 material
# value; the coating density is an illustrative input, not a sourced product:
#   steel 7.85 x pi/4 x (0.3239^2 - 0.2827^2) = 0.15408 te/m; coating
#   0.00293 te/m; displaced 1.025 x pi/4 x 0.3299^2 = 0.08762 te/m;
#   submerged w_wet = 0.6805 kN/m; dry w_dry = 1.5398 kN/m.
#   Wet height 1000 m, dry height 30 m; angle from horizontal phi = 82 deg:
#   Q = w_wet*1000 + w_dry*30; H = Q/(sec(phi) - 1) = 117.5 kN;
#   top tension T = H + Q = 844.2 kN; submerged a = H/w_wet = 172.65 m.
#   Waterline vertical force V_wet = sqrt((H + w_wet*1000)^2 - H^2);
#   top vertical force V_top = H*tan(phi). Wet arc s_wet = V_wet/w_wet
#   = 1159.87 m; dry arc s_dry = (V_top - V_wet)/w_dry = 30.31 m.
#   Suspended s = s_wet + s_dry = 1190.18 m; suspended span is the sum of
#   (H/w_wet)*asinh(V_wet/H) and
#   (H/w_dry)*(asinh(V_top/H) - asinh(V_wet/H)), giving x = 453.82 m.
#   Grounded remainder 1809.82 m; End B span 2263.64 m aft of the hang-off.
#
# Public method and constant basis (accessed 2026-11-13):
# - Classical Mechanics, online edition, section 18.3, equations 18.3.2-18.3.9:
#   https://phys.libretexts.org/Bookshelves/Classical_Mechanics/Classical_Mechanics_(Tatum)/18%3A_The_Catenary/18.03%3A_Equation_of_the_Catenary_in_Rectangular_Coordinates%2C_and_Other_Simple_Relations
#   With the origin at the lowest point, h = a (sec(phi) - 1),
#   s = a tan(phi), x = a asinh(tan(phi)); T = w (a + h), H = w a.
#   Applied separately to the wet and dry arcs, dT = w*dh, ds = dV/w and
#   dx = (H/w)*d(asinh(V/H)), where V^2 = T^2 - H^2. Horizontal and vertical
#   forces are continuous across the waterline; each arc uses its own w.
#   Extending x by the grounded remainder L - s assumes a flat seabed. This flexible,
#   inextensible seed omits bending stiffness, stretch, drag and friction;
#   it is not a solved installation equilibrium or a strength check.
# - NIST SP 811 (2008), appendix B.8, acceleration of free fall, standard:
#   https://www.nist.gov/pml/special-publication-811/nist-guide-si-appendix-b-conversion-factors/nist-guide-si-appendix-b8
#   g = 9.80665 m/s2 is conventional standard gravity, not local gravity.
# Steel and seawater densities are assumed, based on previous experience;
# the material dictionary establishes consistency with the emitted model,
# not independent evidence for the assumed densities. Coating density and
# all geometry remain illustrative. The seed requires uniform coatings;
# declared alternatives that no segment uses do not contribute to weight.
#
# Generate:
#   python -m digitalmodel.solvers.orcaflex.modular_generator generate \
#       --input spec.yml --output modular/

metadata:
  name: "pipeline_jlay"
  description: "12.75 in pipeline J-lay from a tower in 1000 m water depth"
  structure: pipeline
  operation: installation/j-lay
  project: "OrcaFlex typed examples"
  version: "1.0"

environment:
  water:
    depth: 1000
    density: 1.025
  seabed:
    slope: 0
    stiffness: {normal: 100, shear: 10}

pipeline:
  name: "Pipeline"
  material: X65
  dimensions:
    outer_diameter: 0.3239
    wall_thickness: 0.0206
  coatings:
    corrosion: {thickness: 0.003, density: 0.95}
  segments:
    - {type: "X65_12in", length: 3000, segment_length: 5}

equipment:
  vessel:
    name: "LayVessel"
    properties:
      loa: 180
      beam: 40
      depth: 15
      draft: 8
      gmt: 5
      cog: [90, 0, 12]
      gyration_radii: [14, 45, 45]
    position: [0, 0, 0]
  jlay:
    tower_top: [-20, 0, 30]
    tower_angle: 8
