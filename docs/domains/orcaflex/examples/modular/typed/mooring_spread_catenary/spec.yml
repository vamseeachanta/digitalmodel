# Typed mooring example: four-leg catenary chain spread mooring of a vessel.
#
# The typed `mooring` section carries the legs; the `generic` section carries
# the host vessel that the fairleads connect to (digitalmodel #3972).
# Leg data are illustrative input values, not a design: grade R4 76 mm
# chain, 900 m per leg, 200 m water depth, pretension 500 kN per leg.
# Property basis (public preliminary estimates, accessed 2026-11-12):
# [1] Orcina webhelp, "Chain", property table:
#     https://www.orcina.com/webhelp/OrcaFlex/Content/html/Chain.htm
# [2] Orcina webhelp, "Chain: Mechanical properties", Catalogue data and
#     Minimum breaking loads:
#     https://www.orcina.com/webhelp/OrcaFlex/Content/html/Chain,Mechanicalproperties.htm
# [3] Orcina webhelp, "Chain: Drag":
#     https://www.orcina.com/webhelp/OrcaFlex/Content/html/Chain,Drag.htm
# These sources are independent of the router and warn that estimates are
# preliminary; they do not certify a product or qualify the generator defaults.
# With d = 0.076 m, [1,2] give studlink mass 21.9 d^2 te/m (126.5 kg/m),
# but studless mass 19.9 d^2 te/m. The router retains the studlink value.
# EA = 0.854e8 d^2 kN (493270.4 kN) matches the STUDLESS relation [1];
# studlink EA would instead use 1.01e8 d^2. This mixed basis is not a chain design.
# R4 is selected because [2] explicitly gives c = 2.74e4 for
# MBL = c d^2 (44 - 80 d) kN: 6001.3 kN. The output calls this AllowableTension
# without a design factor: it is only a breaking-load comparator, NOT a safe
# working tension. Neither a governing code check nor product strength is proved.
# OD = 2d is retained for generation, whereas [1] gives equivalent OD = 1.80d
# (studless) or 1.89d (studlink). Normal Cd = 2.4 [3] applies with drag diameter
# d, not the emitted OD; axial Cd = 0.008 is unsourced and differs from [3]'s
# studless Cd = 1.15 with axial drag diameter d/pi. The emitted drag diameters
# are not explicit. See #3982; no hydrodynamic equivalence is asserted.
# Remaining defaults (including OD = 2d, axial drag, axial added mass, friction,
# compression and damping) are assumed, based on previous experience, and
# retained solely as serialization fixtures. They are not qualified by [1-3].
# The independent property/arithmetic tests supplement the golden; a golden
# match alone does not establish a numeric-source basis. Licensed load/statics
# and property-source qualification remain unestablished.
#
# Anchor radius (hand check, inextensible catenary, no seabed friction):
#   mass m = 21.9 d^2 te/m [1,2]; assumed OD = 2d = 0.152 m,
#   displaced 1.025 x pi x 0.152^2 / 4 te/m; w = (m - displaced) g,
#   using assumed seawater density 1.025 te/m3 and g = 9.80665 m/s2.
#   Submerged w = 1.058 kN/m under these retained assumptions.
#   h = 190 m (fairlead z -10 m, seabed z -200 m), top tension T = 500 kN:
#   H = T - w h = 299.0 kN; a = H / w = 282.6 m; suspended s = sqrt(h^2 + 2 h a)
#   = 378.8 m; suspended span x = a asinh(s / a) = 311.6 m; grounded 900 - s
#   = 521.2 m; fairlead-to-anchor horizontal distance 832.9 m, placed radially
#   along each fairlead azimuth from the vessel origin. Lay azimuth is left to
#   the generator default: its reference end (anchor = End A here) is not
#   established offline. EndA/EndB load semantics require a licensed run.
#
# Generate:
#   python -m digitalmodel.solvers.orcaflex.modular_generator generate \
#       --input spec.yml --output modular/

metadata:
  name: "mooring_spread_catenary"
  description: "Four-leg catenary chain spread mooring with a generic host vessel"
  structure: mooring
  operation: inplace
  project: "OrcaFlex typed examples"
  version: "1.0"

environment:
  water:
    depth: 200                    # Water depth (m)
    density: 1.025                # Seawater density (te/m3)
  seabed:
    stiffness:
      normal: 100                 # Normal stiffness (kN/m/m2)
      shear: 100                  # Shear stiffness (kN/m/m2)

mooring:
  lines:
    - name: "Leg1"
      segments:
        - {type: chain, diameter: 0.076, length: 900, grade: R4, segment_length: 10}
      anchor: {type: anchor, position: [848.0, 212.0, -200]}
      fairlead: {type: fairlead, position: [40, 10, -10], vessel: "FPSO"}
      pretension: 500
    - name: "Leg2"
      segments:
        - {type: chain, diameter: 0.076, length: 900, grade: R4, segment_length: 10}
      anchor: {type: anchor, position: [-848.0, 212.0, -200]}
      fairlead: {type: fairlead, position: [-40, 10, -10], vessel: "FPSO"}
      pretension: 500
    - name: "Leg3"
      segments:
        - {type: chain, diameter: 0.076, length: 900, grade: R4, segment_length: 10}
      anchor: {type: anchor, position: [-848.0, -212.0, -200]}
      fairlead: {type: fairlead, position: [-40, -10, -10], vessel: "FPSO"}
      pretension: 500
    - name: "Leg4"
      segments:
        - {type: chain, diameter: 0.076, length: 900, grade: R4, segment_length: 10}
      anchor: {type: anchor, position: [848.0, -212.0, -200]}
      fairlead: {type: fairlead, position: [40, -10, -10], vessel: "FPSO"}
      pretension: 500

generic:
  vessels:
    - name: "FPSO"
      vessel_type: "Vessel Type1"
      connection: "Free"
      initial_position: [0, 0, 0]
      properties:
        InitialHeading: 0
        PrimaryMotion: "None"
        SuperimposedMotion: "None"
        IncludedInStatics: "None"
