# Generic illustrative inputs; no site return period or design limit is inferred.
# Sources apply to every numeric field in the corresponding record.
report_date: '2026-10-20'
# Constructed geometry: a full turn divided into eight equal sectors.
headings_source: 'Independent case construction: eight equal sectors of a full turn; no directional probability is assumed'
headings_deg: [0, 45, 90, 135, 180, 225, 270, 315]
conditions:
  - name: still-water
    source: 'Constructed zero-load reference; period retained from templates/mooring_systems/calm_buoy_hybrid/base/calm_buoy_base.yml, General and Environment'
    wave_height_m: 0
    wave_period_s: 12
    current_speed_m_s: 0
    wind_speed_m_s: 0
    current_offset_deg: 0
    wind_offset_deg: 0
  - name: aligned
    source: 'templates/mooring_systems/calm_buoy_hybrid/base/calm_buoy_base.yml, Environment: regular height 3.5 m, period 12 s, current 1 m/s, wind 12 m/s; common heading constructed'
    wave_height_m: 3.5
    wave_period_s: 12
    current_speed_m_s: 1
    wind_speed_m_s: 12
    current_offset_deg: 0
    wind_offset_deg: 0
  - name: crossed
    source: 'Same generic Environment magnitudes as aligned; offsets of plus/minus 30 degrees are constructed sensitivity inputs, with no return-period significance'
    wave_height_m: 3.5
    wave_period_s: 12
    current_speed_m_s: 1
    wind_speed_m_s: 12
    current_offset_deg: -30
    wind_offset_deg: 30
coupling:
  source: 'Independent illustrative geometry: tanker centre at 150 m, connection at minus 50 m gives 100 m horizontal separation; unstretched hawser 120 m and hose 160 m. Hose properties below are constructed unit-scale numerical inputs, not manufacturer data or a physical hose design. Tanker type and response data come from templates/mooring_systems/calm_buoy/includes/04_vessel_types.yml and 06_vessels.yml'
  InitialPosition: [150, 0, 0]
  Orientation: [0, 0, 0]
  hawser:
    Name: Hawser
    EndAConnection: CALM_Buoy
    EndAX: 0
    EndAY: 0
    EndAZ: 0
    EndBConnection: Vessel
    EndBX: -50
    EndBY: 0
    EndBZ: 0
    IncludedInStatics: Yes
    LineType, Length, TargetSegmentLength:
      - [Hawser, 120, 4]
  hose_line_type:
    Name: IllustrativeHose
    Category: General
    OD: 0.3
    ID: 0.2
    MassPerUnitLength: 0.1
    EA: 1000
    EI: [1, 1]
    GJ: 1
    PoissonRatio: 0.3
    Cd: [1, 0, 0]
    Ca: [1, 0, 0]
  hose:
    Name: TransferHose
    EndAConnection: CALM_Buoy
    EndAX: 0
    EndAY: 0
    EndAZ: -2
    EndBConnection: Vessel
    EndBX: -50
    EndBY: 0
    EndBZ: -5
    IncludedInStatics: Yes
    LineType, Length, TargetSegmentLength:
      - [IllustrativeHose, 160, 4]
# No allowables can be qualified from the generic template or public manual.
criteria: {}
