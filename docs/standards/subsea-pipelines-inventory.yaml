# Transcription only: no standards text was opened or copied for this inventory.
# No page/section/clause references, factors or formulas were obtained; issue examples are not copied.
# Brazil and Australia regulator acceptance was not established from a regulator page.
# UK recognition is a search-summary statement (unv.), not regulator-page verification.
# meta: source provenance, note counts, unmet criteria, source-key catalog and graph.
# meta.domain: the research note's domain.
# meta.issue_reference: issue requesting this inventory.
# meta.source_statement: the sole factual source and its date.
# meta.research_note: stable comment link to that source.
# meta.date_checked: the note's date, not a new currency check.
# meta.edition_basis_legend: exact meaning of C, N and U mapped to closed values.
# meta.counts: the note's own Counts table, without reclassifying combined rows.
# meta.acceptance_criteria_not_met: gaps stated by the note (historical note status).
# meta.cross_reference_edges: graph bullet statements verbatim, including unv. marks.
# meta.external_references: references-cell designations with no row or alias here.
# meta.source_keys: all key-table entries, including regulator keys used outside row source cells.
# standards: one entry per numbered note row, in the same order; combined rows stay combined.
# code_id: first designation in the note's Designation cell.
# also_known_as: former or additional designations from that cell or the rename statement.
# designation: complete Designation cell, retaining combined-row context.
# publisher: Issuer cell.
# revision: Current edition / date cell, including all caveats.
# title: Title cell.
# scope: Scope (own words) cell.
# key_methods: Methods cell as a list; a dash becomes an empty list, n/v remains n/v.
# applicability: Applicability limits stated publicly cell; a dash remains a dash.
# links_to: designations extracted from References / pairs with; prose-only cells yield no targets.
# references_statement: full References / pairs with cell with its uncertainty markers.
# group: exact sub-topic heading.
# status: Status cell, not an independently verified closed vocabulary.
# edition_basis: currency-check (C), issuer-page (N), or not-verified (U), from Src.
# edition_verified: false for U or an edition-not-verified cell; true means the note's standing only.
# unverified_statements: affected field names; markers also remain inside source text.
# relation_to_neighbours: Relation to neighbours cell.
# boundary_flags: closed set mooring, risers-viv, flexible-pipe, subsea-production; only named boundary rows.
# boundary_reasons: flag-to-reason mapping from Boundary flags or the boundary group row.
# issue_designation_correction: optional list of issue_text and issuer_page_today from corrections table.
# issue_designation_correction[].issue_text: exact Issue text cell from the corrections table.
# issue_designation_correction[].issuer_page_today: exact Issuer page today cell, without Markdown emphasis.
# sources: row source-cell keys only, each resolved against the note's key table; dash is empty.
# sources[].key: source key from the note.
# sources[].urls: all full https addresses in its key-table cell; absent if none is supplied.
# sources[].remark: complete key-table wording, retaining URL context and caveats.
# date_checked: the note's date for this row.
# accepted_edition_by_regime: only regime incorporation or naming stated in the note; otherwise empty.
# accepted_edition_by_regime[].regime: regime named in the note.
# accepted_edition_by_regime[].edition_or_statement: incorporation/naming statement, including uncertainty.
# accepted_edition_by_regime[].source_key: one cited key resolved in meta.source_keys, not necessarily row sources.
# accepted_edition_by_regime[].source_keys: two or more distinct cited keys resolved in meta.source_keys.
# Each regime entry has either source_key or source_keys, never both.
