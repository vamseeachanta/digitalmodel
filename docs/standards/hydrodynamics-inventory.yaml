# Metadata transcription only; source: the issue research note, 2026-10-11.
# No standards text, page ranges, clause references, factors or formulas were obtained.
# pages_relevant and key formulas remain unavailable without the paid texts.
# Brazil, Australia, United Kingdom: governing hydrodynamics code not established.
# Norway anchoring guidance does not name ISO 19901-7 or DNV-OS-E301 (R3).
# meta: provenance, legends, counts, note limitations and cross-reference graph.
# domain: the note's subject.
# issue_reference: the originating issue link.
# source_statement: sole factual source and its date.
# research_note: the source comment link.
# date_checked: the note's check date; this transcription performs no currency check.
# edition_basis: C/N/U mapped to currency-check/issuer-page/not-verified.
# counts: the note's own Counts table.
# groups: the seven sub-topic headings in note order.
# acceptance_criteria_not_met_by_note: historical gaps verbatim, including no YAML committed.
# cross_reference_edges: graph bullets verbatim, retaining unv. marks.
# regulator_guidance: regime findings verbatim, including findings not established.
# external_references: reference designations/families outside this inventory.
# source_catalog: the note's complete source-key table, without fetching any URL.
# standards: one entry per numbered row, in note order.
# code_id: primary Designation; rows are never split or merged.
# also_known_as: the second designation exactly as given in the Designation cell.
# formerly: the designation in a was remark, exactly as given.
# publisher: Issuer cell.
# revision: Current edition / date cell, including every caveat.
# title: Title cell, including placeholders and uncertainty markers.
# scope: Scope (own words) cell.
# key_methods: a singleton list preserving the full Methods cell and its caveats.
# applicability: Applicability limits stated publicly cell.
# links_to: designation links extracted from References / pairs with, expanding shorthand.
# references_text: the original References / pairs with cell, preserving prose and markers.
# group: the note's sub-topic heading.
# status: Status cell verbatim; not a normalized closed vocabulary.
# edition_verified: false for U or explicit edition not verified; true does not remove caveats.
# unverified_statements: affected field names; original markers also remain in field text.
# relation_to_neighbours: Relation to neighbours cell.
# sources: source-key entries from Scope source; a dash becomes an empty list.
# source_key: the note's source-table key; regime entries resolve in source_catalog.
# urls: all full addresses in the key entry, as a list; no address is inferred.
# remark: the complete source-table cell, retaining all qualifications.
# accepted_edition_by_regime: only explicitly incorporated editions or named-code statements.
# regime: regime named by the note.
# edition_or_statement: edition or incorporation statement from the regulator findings/row.
