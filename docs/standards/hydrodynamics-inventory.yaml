- code_id: DNV-RP-C205
  also_known_as: []
  formerly: []
  publisher: DNV
  revision: 2025-04, amended 2026-03
  title: Environmental conditions and environmental loads
  scope: Design criteria and guidance for assessing wind, wave, current and ice conditions and the loads
    they put on marine structures.
  key_methods:
  - Page states only that it gives rational criteria built on a joint industry project and current computational
    modelling. Wave theories, spectra, Morison and diffraction loading, VIV (unv.).
  applicability: Marine structures generally; no depth or region limit stated.
  links_to:
  - DNV structural standards and RPs
  - NORSOK
  - ISO standards
  references_text: Common reference for DNV structural standards and RPs; page says it can supplement
    NORSOK and ISO standards.
  group: A. Environmental conditions, wave and current kinematics, environmental loads
  status: Active
  edition_basis: currency-check
  edition_verified: true
  unverified_statements:
  - key_methods
  relation_to_neighbours: The working "how to compute" document next to ISO 19901-1 / API RP 2MET, which
    say what conditions to derive.
  sources:
  - *id001
  date_checked: '2026-10-11'
  accepted_edition_by_regime: []
