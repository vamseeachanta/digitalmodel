site_name: digitalmodel API Reference
site_description: Auto-generated API documentation for digitalmodel
docs_dir: docs/api
site_dir: site

nav:
  - Home: index.md

  # ---------------------------------------------------------------------------
  # CFD — Computational Fluid Dynamics
  # ---------------------------------------------------------------------------
  - CFD:
      - Findings:
          - Single Tank Amplitude: cfd/single-tank-amplitude-findings.md
      - Verification Cases:
          - Cylinder Re 100: cfd/cases/cylinder_re100/README.md
          - Dam Break: cfd/cases/dam_break/README.md
          - Flat Plate (Blasius): cfd/cases/flat_plate_blasius/README.md
          - Floating Body Decay: cfd/cases/floating_body_decay/README.md
          - Kleefsman Impact: cfd/cases/kleefsman_impact/README.md
          - MacCamy-Fuchs Cylinder: cfd/cases/maccamy_fuchs/README.md
          - NACA 0012 Airfoil: cfd/cases/naca0012_polar/README.md
          - Turbulent Flat Plate: cfd/cases/turbulent_flat_plate/README.md
          - Wave-Excited Body: cfd/cases/wave_excited_body/README.md
          - Wave Tank: cfd/cases/wave_tank/README.md
      - Report Build: cfd/report_build/README.md

  # ---------------------------------------------------------------------------
  # Contributing / Standards
  # ---------------------------------------------------------------------------
  - Contributing:
      - Page Layout Standard: _assets/LAYOUT.md

plugins:
  - search
  - mkdocstrings:
      enable_inventory: false
      default_handler: python
      handlers:
        python:
          paths: [src]
          inventories: []
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.expand
    - content.code.copy
    - navigation.top
