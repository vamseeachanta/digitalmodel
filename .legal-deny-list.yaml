# ---------------------------------------------------------------------------
# Binary types that carry no inspectable text. Files of these types are
# counted and reported, not read -- but only when their leading bytes ARE that
# type; text renamed to .png is read. Any OTHER binary -- a PDF, a solver
# result, an array or table format that can carry strings -- is uninspectable
# and FAILS the check: content that was not read has not passed. Office
# documents are not listed; their XML is read.
# ---------------------------------------------------------------------------
binary_media_extensions:
  - .png
  - .jpg
  - .jpeg
  - .gif
  - .bmp
  - .ico
  - .webp
  - .woff
  - .woff2
  - .ttf
  - .otf

