# ---------------------------------------------------------------------------
# Binary types that carry no inspectable text. Files of these types are
# counted and reported, not read. Any OTHER binary -- a PDF, an unknown blob --
# is uninspectable and FAILS the check: content that was not read has not
# passed. Office documents are not listed; their XML is read.
# ---------------------------------------------------------------------------
binary_media_extensions:
  - .png
  - .jpg
  - .jpeg
  - .gif
  - .bmp
  - .ico
  - .webp
  - .woff
  - .woff2
  - .ttf
  - .otf
  - .sim
  - .owr
  - .hyd
  - .pyc
  - .npz
  - .npy
  - .parquet
  - .h5

# ---------------------------------------------------------------------------
# Paths excluded from the check, with the reason. Keep this list short and
# justified; an exclusion is how a gate stops being one.
# ---------------------------------------------------------------------------
exclusions:
  - path: .legal-deny-list.yaml
    reason: this file necessarily contains the patterns it matches
  - path: scripts/legal/check_identifiers.py
    reason: the checker's own tests and messages quote example shapes
