# =============================================================================
# Identifier deny list — digitalmodel (PUBLIC repository)
# =============================================================================
# Read by scripts/legal/check_identifiers.py, which is wired into pre-commit.
#
# WHY THIS FILE LOOKS ODD
#
# A deny list of client names, committed to a public repository, is itself a
# list of clients. That is why no rule value was committed here before, and why
# the surviving hook checks only that the census is well formed and matches no
# values at all (see .pre-commit-config.yaml). The consequence was that nothing
# in this repository checked identifiers, and 146 lines binding a client to a
# job code, a CTR number or an internal path reached the public remote.
#
# So the rules come in two kinds.
#
#   structural  Patterns, not names. A job code, a mapped drive, a UNC share, a
#               CTR number, an address at someone else's domain. Publishing the
#               shape of these discloses nothing, and they catch the majority of
#               real cases, because an identifier rarely travels alone.
#
#   hashed      Names, as salted SHA-256 of the lowercased token. The checker
#               hashes each candidate word and compares. A name on this list is
#               caught without this file naming it. The salt is published: it
#               stops accidental matches, not a determined reader with a word
#               list, and pretending otherwise would be the same fail-open
#               thinking that produced the leak. Use it for names that are
#               already public knowledge as companies; put anything genuinely
#               secret in the private list below instead.
#
# An optional private list extends this one. Set DIGITALMODEL_DENY_LIST to a
# path outside the repository and the checker reads plain values from it. When
# the variable is set and the file is missing, the checker FAILS rather than
# continuing without it: a gate that silently degrades is not a gate. With the
# variable unset, ~/.config/digitalmodel/identifier-deny-list.txt is read when
# present. A line "re:<pattern>" is a regular expression, for identifiers that
# are phrases or shapes and must not be published even as a pattern; findings
# name the line of the scanned file, never the private pattern.
#
# CI has no private list. It relies on the structural classes below and on the
# hashed names, which is why every category the owner's C11 decision names
# (operator/client, field/project, vessel, person or Windows user, private
# path, machine hostname) has a public class or hashed entries here.
#
# A line that documents a pattern may carry "identifier-gate: example"; the
# structural rules skip that line and only that line. Names are still checked.
# =============================================================================

version: "1.0"
updated: "2026-09-25"

salt: "digitalmodel-identifier-check-v2-838ee755c8c369fc"

# ---------------------------------------------------------------------------
# Structural patterns. Severity block = fail the check.
# ---------------------------------------------------------------------------
structural:
  - id: job-code
    # Any case, and joined to other text by _ or - (b1234_report): \b does not
    # fire between a digit and an underscore, so file names slipped through.
    pattern: '(?i)(?<![A-Za-z0-9])B1[0-9]{3}(?![A-Za-z0-9])'
    severity: block
    message: >-
      Internal job code. Use a neutral placeholder such as <job-code>.

  - id: ctr-number
    pattern: '\bCTR\s*[0-9]{1,3}\b'
    severity: block
    message: >-
      Contract/CTR number. Identifies a specific engagement.

  - id: mapped-drive-path
    pattern: '\b[D-Zd-z]:\\+[A-Za-z0-9_ .\\-]{6,}'
    severity: block
    message: >-
      Path on a mapped or network drive. Replace with <project-root> or a
      repository-relative path. C: is excluded because vendor install paths
      live there and disclose nothing.

  - id: unc-share
    # Single-quoted YAML keeps backslashes literal. Two shapes are a share: two
    # backslashes, a host, ONE separator and a name (\\server\share, as text or
    # a raw string); and the escaped form, four, a host, two (JSON or a Python
    # literal). Two, a word, two is neither: it is an escaped relative path
    # ("results\\plots\\"), a registry key or LaTeX (\\log, \\Delta\\sigma),
    # and the old rule '\\\\[A-Za-z0-9._-]+\\+' flagged all three. The share
    # must not follow a word character, a backslash, a colon or a dot, which
    # also rules out the inside of C:\\Users\\... and ..\\..\\ (C11). A host may be
    # one character (\\h\share); the separator rule, not the host length, is
    # what keeps LaTeX out.
    pattern: '(?<![\w\\:.])(?:\\\\[A-Za-z0-9][A-Za-z0-9._-]*\\(?=[\w$.-])|\\\\\\\\[A-Za-z0-9][A-Za-z0-9._-]*\\\\(?=[\w$.-]))'
    severity: block
    message: >-
      UNC share path. Names an internal server.

  - id: windows-user-path
    # C: is exempt from mapped-drive-path for vendor installs, and that let
    # every C:\Users\<name>\... through, with the Windows account name in it.
    # Any separator form: \, \\ (escaped) or /.
    pattern: '(?i)\b[A-Z]:(?:\\|/)+Users(?:\\|/)+(?!(?:public|default|all users)(?:[\\/"''\s]|$))(?![<%$])[A-Za-z0-9][A-Za-z0-9._-]*'
    severity: block
    message: >-
      Windows user profile path: names the account. Replace with
      <private-data>/... or a repository-relative path.

  - id: onedrive-org
    pattern: 'OneDrive\s+-\s+(?!<)[A-Za-z]'
    severity: block
    message: >-
      Organisation OneDrive folder ("OneDrive - <organisation>"). Names the
      employer or client.

  - id: solver-export-user
    # OrcaFlex and OrcaWave stamp the saving account into exported YAML
    # headers. "(removed)" is the normalised form.
    pattern: '#\s*User:\s*(?![(<]|&lt;)\S'
    severity: block
    message: >-
      Solver export header names the Windows account. Write "# User: (removed)".

  - id: solver-export-machine
    pattern: '#\s*Machine:\s*(?![(<]|&lt;)\S'
    severity: block
    message: >-
      Solver export header names the machine. Write "# Machine: (removed)".

  - id: windows-hostname
    # Organisation-prefixed Windows host names: a site code is optional, and
    # the role (remote desktop, solver, workstation, host, file server, domain
    # controller) carries a number. Logical labels such as ace-win-1 do not
    # match and are the replacement.
    pattern: '(?i)\b[a-z]{2,6}-(?:[a-z]{2,4}-)?(?:rds|ansys|ws|host|fs|srv|dc)[0-9]{2,}\b'
    severity: block
    message: >-
      Physical machine hostname. Use the logical fleet label (ace-win-1,
      ace-win-2, ...) or "a Windows workstation".

  - id: foreign-domain-email
    pattern: '[A-Za-z0-9._%+-]+@(?!example\.|localhost)[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
    severity: block
    message: >-
      Email address. An address at a client domain identifies both the
      engagement and the person on it.

  - id: project-archive-path
    pattern: '\bacma-projects\b'
    severity: block
    message: >-
      Internal project archive name.

# ---------------------------------------------------------------------------
# Hashed names. Salted SHA-256 of the lowercased token.
#
# Deliberately unannotated. A comment naming each hash would publish the very
# list the hashing exists to withhold, which is the mistake this whole file is
# a response to. To check whether a name is already covered, hash it and look:
#
#   python scripts/legal/check_identifiers.py --hash "<token>"
#
# To add one, append the hash it prints. Do not add a comment saying what it is.
# ---------------------------------------------------------------------------
