[pytest]
minversion = 7.0
testpaths = tests
norecursedirs = docs projects scripts .venv .git __pycache__ node_modules htmlcov tests/data_systems/data_scraping tests/marine_ops/artificial_lift/dynacard/benchmark tests/workflows/integration
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (multiple components)
    slow: Slow tests (>1 second execution)
    llm: LLM/AI tests (external API calls)
    scrapy: Web scraping tests
    selenium: Browser automation tests
    database: Database integration tests
    api: API endpoint tests
    etl: ETL pipeline tests
    benchmark: Performance benchmark tests
    property: Property-based tests (hypothesis)
    performance: Performance tests
    security: Security tests
    flaky: Potentially flaky tests
    external: Tests requiring external services
    load_test: Load tests
    stress_test: Stress tests
    chaos_test: Chaos/fault injection tests
    commit: Fast tests suitable for pre-commit checks (<2 min total)
    task: Moderate tests for task-level CI runs (<15 min total)
    session: Full test suite with no time limit
    contracts: Repo-level contract tests asserting cross-cutting invariants (assetutilities public API stability; force/moment/pressure units per docs/UNITS.md, #1447)
    solver: Tests requiring OrcFxAPI on licensed machine (deselect with '-m "not solver"')

addopts =
    -v
    --tb=short
    --strict-markers
    --import-mode=importlib

# pytest-asyncio is a pinned dependency of the [test] extra and must stay loaded:
# --strict-markers rejects the @pytest.mark.asyncio in tests/test_workflow_checkpoints.py
# unless the plugin registers that marker. Do NOT re-add `-p no:asyncio` (#1923).
#
# strict, NOT auto (#1923). `asyncio_mode = auto` is the real "hypothesis conflict"
# the old `-p no:asyncio` was papering over: in auto mode pytest-asyncio 0.21.1
# evaluates `function.hypothesis.inner_test` for every function carrying
# `is_hypothesis_test`, and hypothesis's `RuleBasedStateMachine.TestCase.runTest`
# (tests/test_engine.py:1258) sets that flag without a `.hypothesis` handle -- which
# aborts collection with INTERNALERROR: AttributeError, taking out the whole shard.
# strict mode never enters that code path, and all 22 async tests in the suite are
# already explicitly decorated with @pytest.mark.asyncio, so nothing is lost.
asyncio_mode = strict
console_output_style = progress

filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
