[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digitalmodel"
version = "0.1.1"
description = "Standardized project configuration for digitalmodel"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Development Team", email = "dev@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # RUNTIME ONLY (#1632). Every entry below is imported at MODULE level, without
    # a try/except or lazy guard, by code that ships in the wheel. Anything used
    # only by tests, scripts or tooling lives in [project.optional-dependencies]
    # or [dependency-groups] instead.
    #
    # This list was previously produced by machine-pasting the vendored dashboard's
    # backend/requirements.txt into it, which is why `pip install digitalmodel`
    # pulled Celery, New Relic, Sentry, boto3 and Poetry at runtime while eleven
    # packages the shipped code actually imports were missing entirely.
    # Verified by AST scan; enforced by tests/contracts/test_runtime_dependencies.py.
    "assetutilities>=0.0.7,<1.0.0",
    "beautifulsoup4>=4.13.0,<5.0.0",
    "click>=8.0.0,<9.0.0",
    "colorama>=0.4.6,<1.0.0",
    "deepdiff>=6.7.0,<8.0.0",
    "fastmcp>=2.12.4,<3.0.0",
    "flask>=3.0.0,<4.0.0",
    "geopandas>=1.1.3,<2.0.0",
    "h5py==3.10.0",
    "imageio>=2.25.0,<3.0.0",
    "imgkit>=1.2.0,<2.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "jsonschema>=4.20.0,<5.0.0",
    "loguru>=0.7.0,<1.0.0",
    "lxml==4.9.3",
    "matplotlib>=3.7.0,<4.0.0",
    "munch>=4.0.0,<5.0.0",
    "numpy>=1.24.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "pandas>=2.0.0,<3.0.0",
    "pillow==10.1.0",
    "pint>=0.25.3,<1.0.0",
    "plotly==5.17.0",
    "psutil==5.9.6",
    "pyarrow==14.0.1",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.6.1,<3.0.0",
    "pylife>=2.2,<3.0",
    "pyproj==3.6.1",
    "python-docx>=0.8.0,<2.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "rainflow>=3.2.0,<4.0.0",
    "requests>=2.31.0,<3.0.0",
    "rich>=13.0.0,<15.0.0",
    "ruamel.yaml>=0.18.0,<1.0.0",
    "scikit-learn==1.3.2",
    "scipy>=1.10.0,<2.0.0",
    "seaborn>=0.13.0,<1.0.0",
    "sectionproperties>=3.4.0,<4.0.0",
    "selenium>=4.15.0,<5.0.0",
    "shapely>=2.0.0,<3.0.0",
    "six>=1.16.0,<2.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "structlog==23.2.0",
    "sympy>=1.12.0,<2.0.0",
    "tabulate>=0.9.0,<1.0.0",
    "tenacity>=8.2.0,<10.0.0",
    "tqdm>=4.67.1,<5.0.0",
    "urllib3>=2.0.0,<3.0.0",
    "validators==0.22.0",
    "webcolors>=1.13,<2.0",
    # NOT imported anywhere -- pandas resolves it by NAME:
    # pd.ExcelWriter(..., engine="xlsxwriter"). See DYNAMIC_RUNTIME in
    # tests/contracts/test_runtime_dependencies.py (#1632).
    "xlsxwriter>=3.1.0,<4.0.0",
    "xarray>=2023.1.0,<2026.0.0",
    "xlrd>=2.0.0,<3.0.0",
    "xmltodict>=0.13.0,<1.0.0",
]

[project.optional-dependencies]
gis-imagery = [
    # Optional Earth Engine support for the gis.imagery timelapse pipeline.
    # Not required: the pipeline falls back to public Planetary Computer STAC.
    "earthengine-api>=0.1.370,<1.0.0",
    "planetary-computer>=0.5.0,<2.0.0",
]
dev = [
    # Linting / typing / release tooling. Invoked as executables, never imported
    # by shipped code -- moved out of [project] dependencies in #1632.
    "black>=24.0.0,<25.0.0",
    "flake8==6.1.0",
    "isort>=5.13.0,<6.0.0",
    "mypy>=1.8.0,<2.0.0",
    "ruff>=0.1.0",
    "bandit==1.7.5",
    "pre-commit==3.6.0",
    "build>=1.0.0,<2.0.0",
    "twine>=4.0.0,<6.0.0",
    "bumpver>=2023.1129,<2024.0",
    "ipython>=8.0.0,<9.0.0",
    "mutmut>=2.4.0,<3.0.0",
]
test = [
    # The full set CI needs (#1632). Domain gates run
    #   uv run ... --with-editable '.[test]' python -m pytest ...
    # so every pytest PLUGIN must be listed here: plugins are loaded by pytest,
    # never imported, so an AST scan cannot see them and they used to survive
    # only by sitting in the runtime dependency list.
    "pytest>=7.4.3,<9.0.0",
    "pytest-asyncio==0.21.1",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "pytest-xdist>=3.5.0,<4.0.0",
    "pytest-benchmark>=4.0.0,<5.0.0",
    "pytest-timeout>=2.1.0,<3.0.0",
    "pytest-randomly>=3.15.0,<4.0.0",
    "pytest-sugar>=0.9.7,<1.0.0",
    "pytest-html>=4.1.0,<5.0.0",
    "pytest-instafail>=0.5.0,<1.0.0",
    "pytest-json-report>=1.5.0,<2.0.0",
    "pytest-metadata>=3.0.0,<4.0.0",
    "coverage==7.3.2",
    "hypothesis>=6.100.0,<7.0.0",
    "factory-boy>=3.3.0",
    "faker==20.1.0",
    "httpx>=0.28.1,<0.29.0",
    # imported directly by tests/ or scripts/, not by shipped code
    "fluids>=1.3.0,<2.0.0",
    "ht>=1.2.0,<2.0.0",
    "pypdf2>=3.0.0,<4.0.0",
    "xlsxwriter>=3.1.0,<4.0.0",
    "websockets>=15.0.1,<16.0.0",
    "pygmt>=0.13.0,<1.0.0",
    # Shipped code imports these lazily (hence the [mesh] extra, not runtime) but
    # tests/ imports them at MODULE level, so collection fails without them:
    # test_meshio_integration, test_pyvista_integration, hull_library/test_coarsen_mesh,
    # hull_library/test_decimation_vtk.
    "meshio>=5.3.0,<6.0.0",
    "pyvista>=0.47.1,<1.0.0",
    # imported by tests/infrastructure/performance/conftest.py -- a conftest
    # import fails COLLECTION, so this is required to run tests, not just to
    # profile them. It is tooling, but [dev] is not installed by the gates.
    "memory-profiler==0.61.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
    "mkdocs>=1.6.0",
    "mkdocstrings[python]>=0.25.0",
    "mkdocs-material>=9.5.0",
]
well = [
    "the_well>=1.2.0",  # CC BY 4.0 — The Well turbulent flow datasets (Polymathic AI)
]
nde = [
    # The Well acoustic scattering datasets for subsea NDE validation (WRK-418)
    # CC BY 4.0, Polymathic AI — install: pip install digitalmodel[nde]
    "the_well>=1.2.0",
]

solvers = ["OrcFxAPI", "gmsh>=4.12.0,<5.0.0"]
# Mesh I/O and 3-D rendering. Imported lazily (inside functions / try-except) by
# the diffraction and mesh pipelines, so they are not needed to import or use the
# rest of the library -- moved out of [project] dependencies in #1632.
mesh = ["meshio>=5.3.0,<6.0.0", "pyvista>=0.47.1,<1.0.0"]
cfd = ["gmsh==4.15.1"]
viz = ["dash>=3.1.0,<4.0.0", "kaleido>=0.2.0,<1.0.0"]
web = ["fastapi>=0.100.0,<1.0.0", "uvicorn>=0.25.0,<1.0.0", "sqlalchemy>=2.0.0,<3.0.0"]
async = ["aiofiles>=23.0.0,<25.0.0", "asyncpg>=0.29.0,<1.0.0"]
markitdown = ["markitdown>=0.0.1,<0.1.0"]

[project.urls]
"Homepage" = "https://github.com/username/digitalmodel"
"Bug Tracker" = "https://github.com/username/digitalmodel/issues"
"Documentation" = "https://github.com/username/digitalmodel#readme"

[project.scripts]
digital_model = "digitalmodel.__main__:main"
run-to-sim = "digitalmodel.solvers.orcaflex.run_to_sim_cli:main"
orcaflex-universal = "digitalmodel.solvers.orcaflex.universal_cli:main"
orcaflex-sim = "digitalmodel.solvers.orcaflex.universal_cli:main"
orcaflex-convert = "digitalmodel.solvers.orcaflex.format_converter.cli:main"
create-go-by = "digitalmodel.workflows.automation.go_by_folder.cli:main"
aqwa = "digitalmodel.hydrodynamics.aqwa.aqwa_cli:main"
diffraction = "digitalmodel.hydrodynamics.diffraction.cli:cli"
structural-analysis = "digitalmodel.structural.structural_analysis.cli:main"
wall-thickness = "digitalmodel.structural.analysis.cli:main"
mooring-analysis = "digitalmodel.subsea.mooring_analysis.cli:main"
viv-analysis = "digitalmodel.subsea.viv_analysis.cli:main"
catenary-riser = "digitalmodel.subsea.catenary_riser.cli:main"
signal-analysis = "digitalmodel.signal_processing.signal_analysis.cli:main"
hydrodynamics = "digitalmodel.hydrodynamics.cli:main"
gmsh-meshing = "digitalmodel.solvers.gmsh_meshing.cli:main"
openfoam = "digitalmodel.solvers.openfoam.cli:main"
workflow-automation = "digitalmodel.workflows.workflow_automation.cli:main"
bemrosetta = "digitalmodel.hydrodynamics.bemrosetta.cli:main"
dynacard = "digitalmodel.marine_ops.artificial_lift.dynacard.cli:main"
imagery-timelapse = "digitalmodel.gis.imagery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["digitalmodel*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
digitalmodel = [
    "base_configs/**/*.yml",
    "base_configs/**/*.deck",
    "data_systems/data/*.yml",
    "foam_system/data/*.yml",
    "orcaflex/data/*.yml",
    "subsea/cross_sections/fixtures/*.yml",
    "naval_architecture/data/*.yml",
    "field_development/data/*.yml",
    "motion_forecast/*.yml",
    "usecase_registry/*.yaml",
    "marine_ops/artificial_lift/reference_data/**/*.csv",
    "marine_ops/artificial_lift/reference_data/**/*.yml",
    "reporting/assets/*.html",
]

[tool.black]
line-length = 88
target-version = ['py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "benchmark: marks tests as performance benchmarks",
    "performance: marks tests as performance tests",
    "property: marks tests as property-based tests",
    "security: marks tests as security tests",
    "flaky: marks tests as potentially flaky",
    "external: marks tests that require external services",
    "load_test: marks tests as load tests",
    "stress_test: marks tests as stress tests",
    "chaos_test: marks tests as chaos/fault injection tests",
    "solver: marks tests requiring OrcFxAPI on licensed machine (deselect with '-m \"not solver\"')",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
minversion = "7.0"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
    "setup.py",
    "*/migrations/*",
    "*/gis/outputlatlongs_wells.py",
]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstract",
    "pass",
    "\\.\\.\\.",
]
show_missing = true
skip_covered = false
skip_empty = false
precision = 2
fail_under = 80.0

[tool.coverage.html]
directory = "htmlcov"
show_contexts = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"
show_contexts = true

# Mutation Testing Configuration
[tool.mutmut]
paths_to_mutate = "src/"
tests_dir = "tests/"
runner = "python -m pytest"
backup = false
show_times = true

# Performance Benchmarking Configuration
[tool.pytest-benchmark]
skip = false
disable_gc = true
min_time = 0.000005
max_time = 1.0
min_rounds = 5
timer = "perf_counter"
calibration_precision = 10
warmup = false
warmup_iterations = 100000

# Hypothesis Configuration
[tool.hypothesis]
max_examples = 100
deadline = 800
database_file = ".hypothesis/examples"
verbosity = "normal"
print_blob = false

[tool.uv]
# UV environment configuration
python = "3.11"
system = false
seed = true
compile = false

[tool.uv.pip]
index-url = "https://pypi.org/simple"
extra-index-url = []
no-cache = false
pre = false

[tool.uv.sources]
assetutilities = { path = "../assetutilities", editable = true }

[tool.uv.workspace]
members = []

# MANDATORY: Parallel Processing Configuration
[tool.parallel]
enabled = true
max_workers = 5
use_threading = false  # Use multiprocessing for CPU-bound tasks
use_asyncio = true     # Use asyncio for I/O-bound tasks
batch_size = 10

[tool.parallel.rules]
# Define when to use parallel processing
file_operations = "always"      # File reading/writing
http_requests = "always"        # API calls
data_processing = "threshold"   # Based on data size
threshold_size = 1000           # Items before parallel kicks in

[tool.scripts]
# Common scripts that use parallel processing
test = "pytest -n auto"
format = "black . && isort ."
lint = "flake8 . & mypy . & pylint ."
install = "uv pip install -e ."
dev-install = "uv pip install -e .[dev]"

[dependency-groups]
dev = [
    "loguru>=0.7.3",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocstrings[python]>=0.25.0",
    "mkdocs-material>=9.5.0",
]

[tool.bandit]
exclude_dirs = ["tests", "docs"]
skips = []
