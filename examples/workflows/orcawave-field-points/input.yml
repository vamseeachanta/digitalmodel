# Conversion-only dispatch input; numeric basis: README.md, Input basis.
# The direct command in README.md runs SpecConverter without a runner.
basename: diffraction

diffraction:
  operation: convert_spec
  spec: spec.yml
  solver: orcawave
  format: single
  output_directory: out

default:
  log_level: INFO
  config:
    overwrite:
      output: true
