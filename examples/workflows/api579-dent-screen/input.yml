# Synthetic formula-check geometry; no published standard table is reproduced.
basename: api579_dent_screen
default:
  log_level: INFO
  config:
    overwrite:
      output: true
dent_assessment:
  component_id: SYNTHETIC-DENT
  od_in: 24.0
  wt_in: 0.5
  dent_depth_in: 1.2
  dent_length_axial_in: 12.0
  dent_length_circ_in: 10.0
  on_weld: false
  restrained: false
  with_gouge_or_metal_loss: false
  output_dir: results
