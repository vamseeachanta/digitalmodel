basename: cathodic_protection
# Regression input for tests/cathodic_protection/test_engine_adapter.py (#2210).

# Subsea manifold / structure — fully submerged sacrificial-anode CP per DNV-RP-B401 (2021).
# Single submerged zone; omitted depth selects the 0-30 m band.
# Physical design depth is unspecified; this is a default-band regression.
inputs:
  calculation_type: DNV_RP_B401_offshore

  design_data:
    design_life: 25.0 # yr
    structure_type: subsea_manifold

  structure:
    zones:
      - zone: submerged
        area_m2: 850.0
        coating_category: III    # standard paint system

  environment:
    seawater_temperature_C: 6.0  # cold-water regression input
    seawater_resistivity_ohm_m: 0.33

  anode:
    material: aluminium
    type: stand_off
    individual_anode_mass_kg: 80.0
    utilization_factor: 0.85
    length_m: 0.6
    radius_m: 0.045

default:
  log_level: INFO
  config:
    overwrite:
      output: true
    cfg_sensitivities: false
