    verification_evidence:
      source_key: published-jacket-paper
      source: *id001
      assumptions:
        One declared assumption set is used unchanged for every comparison; it is
        not the designers' basis. Design life 25 years and seawater temperature 10 °C are adopted
        from the existing three-zone example. The May 2021 edition of DNV-RP-B401, Cathodic
        protection design, supplies seawater aluminium capacity 2000 Ah/kg, long stand-off utilisation
        0.90, protective potential -0.800 V and closed-circuit anode potential -1.050 V (design
        electrochemical capacity, anode utilisation factor and protective potential criterion).
        The published nominal unit mass is interpreted as net alloy mass; the anode is represented
        by a cylindrical long stand-off model of published length 2.020 m. Equivalent radius
        follows r = sqrt(m / (π L ρ)) with the existing aluminium alloy density 2750 kg/m³.
        The printed cross-section expression does not establish net volume or core dimensions,
        so that expression is not used to fit output. Published effective phase densities are
        applied with unity breakdown, without inferring an additional coating law. The unsplit
        nine-well allowance is applied at all phases. No assumption is tuned separately to a
        target.
      targets:
        - quantity: initial_demand
          label: Initial demand
          printed: 2688.3
          unit: A
          locator: p. 242, Section 2
        - quantity: mean_demand
          label: Mean demand
          printed: 1452.5
          unit: A
          locator: p. 242, Section 2
        - quantity: final_demand
          label: Final demand
          printed: 1892.1
          unit: A
          locator: p. 242, Section 2
        - quantity: initial_output
          label: Initial individual output
          printed: 5.01
          unit: A
          locator: p. 242, Section 2
        - quantity: count
          label: Anode count
          printed: 569
          unit: "-"
          locator: p. 242, Section 2
        - quantity: final_output
          label: Final individual output
          printed: 3.63
          unit: A
          locator: p. 242, Section 2
      published_anode_dimensions:
        expression: 2020 mm × (240+270) mm × 270 mm
        nominal_mass_kg: 323.4
        count: 569
        locator: p. 242, Section 2
      limitations:
        - Design life, net alloy mass, original standard edition, capacity, utilisation and separate
          electrode potentials are not published. The declared set is an independent calculation
          basis.
        - Buried area is published but pile geometry, burial depth and sediment resistivity are
          not established. No buried member band is inferred.
        - Member geometry and per-level anode allocation are not published; spatial protection
          and a local retrofit quantity cannot be established from aggregate demand.
        - Completion of the proposed retrofit and post-installation potentials are not established
          by the published remedy section.
      findings:
        - The day-518 discussion reports approximate potentials of -0.925 and -0.950 V versus
          Ag/AgCl at -14 and -40 m, more negative than the report criterion of -0.800 V. At -70.5
          m and -84.1 m, approximately -0.700 and -0.650 V are more positive than that criterion.
          This measured under-protection at the two lowest levels is the spatial finding that
          an aggregate calculation alone would not show [published-jacket-paper, p. 244, Section
          3].
        - The paper attributes the lower-level difficulty to the tropical current-density selection,
          temperature and depth effects on calcareous deposition, current drainage to connected
          buried steel, and a low concentration of bottom anodes [published-jacket-paper, p. 244,
          Section 4].
        - The author's proposed remedy is clamped sacrificial anodes at -70.5 m and -84.1 m [published-jacket-paper,
          p. 244, Section 5]. The report's own recommendations are stated separately.
