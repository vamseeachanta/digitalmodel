    connected_current_allowances:
      - count: 9
        current_A_each: 2
        source: *id001
        phase_basis:
          The unsplit well allowance is applied at every design phase; this is the
          report interpretation.
    verification_evidence:
      source_key: published-jacket-paper
      source: *id001
      assumptions:
        One declared assumption set is used unchanged for every comparison; it is
        not the designers' basis. Design life 25 years and seawater temperature 10 °C are adopted
        from the existing three-zone example. The May 2021 edition of DNV-RP-B401, Cathodic
        protection design, supplies seawater aluminium capacity 2000 Ah/kg, long stand-off utilisation
        0.90, protective potential -0.800 V and closed-circuit anode potential -1.050 V (design
        electrochemical capacity, anode utilisation factor and protective potential criterion).
        The published nominal unit mass is interpreted as net alloy mass; the anode is represented
        by a cylindrical long stand-off model of published length 2.020 m. Equivalent radius
        follows r = sqrt(m / (π L ρ)) with the existing aluminium alloy density 2750 kg/m³.
        The printed cross-section expression does not establish net volume or core dimensions,
        so that expression is not used to fit output. Published effective phase densities are
        applied with unity breakdown, without inferring an additional coating law. The unsplit
        nine-well allowance is applied at all phases. No assumption is tuned separately to a
        target.
      targets:
