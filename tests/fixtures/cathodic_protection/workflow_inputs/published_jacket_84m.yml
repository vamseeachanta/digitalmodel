        - quantity: final_output
          label: Final individual output
          printed: 3.63
          unit: A
          locator: p. 242, Section 2
      published_anode_dimensions:
        expression: 2020 mm × (240+270) mm × 270 mm
        nominal_mass_kg: 323.4
        count: 569
        locator: p. 242, Section 2
      limitations:
        - Design life, net alloy mass, original standard edition, capacity, utilisation and separate
          electrode potentials are not published. The declared set is an independent calculation
          basis.
        - Buried area is published but pile geometry, burial depth and sediment resistivity are
          not established. No buried member band is inferred.
        - Member geometry and per-level anode allocation are not published; spatial protection
          and a local retrofit quantity cannot be established from aggregate demand.
