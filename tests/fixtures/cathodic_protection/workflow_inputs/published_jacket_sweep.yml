base_input: published_jacket_84m.yml
mode: published
parameters:
  - path: environment.seawater_temperature_C
    values: [5, 10, 15, 20, 25]
  - path: design_data.design_life
    values: [20, 25, 30]
  - path: environment.seawater_resistivity_ohm_m
    values: [0.15, 0.22, 0.30, 0.40]
standard_table_zones:
  # Representative depths are derived from the base input's report_geometry.zones
  # bands; the bands are published in DOI 10.26855/ea.2023.06.017 (2023),
  # p. 242, Table 1. The paper does not prescribe the midpoint depths.
  # Depth is positive down: (0 + 30) / 2 = 15 m.
  upper-bare-seawater: 15
  # (30 + 84.1) / 2 = 57.05 m, rounded to 57 m for the table lookup;
  # unrounded and rounded lower depths share the >30-100 m band of
  # DNV-RP-B401 (May 2021), Table 8-1.
  lower-bare-seawater: 57
