source_type: textbook
source_description: "USNA EN400 Principles of Ship Performance (Summer 2020), Chapter 5"
source_url: "https://www.usna.edu/NAOE/_files/documents/Courses/EN400/EN400_Course_Notes,_Summer_2020.pdf"
source_version: "Summer 2020"
source_sha256: "f8f4807492bffcc61cfe1b03bc7a0f457d7ab5209bb0404bba44a4e363be7cec"
extracted_date: "2026-11-16"
category: "naval_architecture"
subcategory: "materials"
equations:
  - name: "Normal stress"
    latex: "\\sigma = F / A, \\quad A = \\pi d^2 / 4"
    description: "Axial force divided by the original circular cross-sectional area"
  - name: "Engineering strain"
    latex: "\\epsilon = e / L_0"
    description: "Elongation divided by original length, expressed in matching units"
inputs:
  - name: "Diameter"
    symbol: "d"
    unit: "in"
    test_value: 1.00
  - name: "Axial force"
    symbol: "F"
    unit: "lb"
    test_value: 25000.0
  - name: "Original length"
    symbol: "L_0"
    unit: "ft"
    test_value: 75.0
  - name: "Elongation"
    symbol: "e"
    unit: "in"
    test_value: 1.0
outputs:
  - name: "Normal stress, Example 5.1"
    symbol: "sigma"
    unit: "psi"
    test_expected: 31800.0
    tolerance: 50.0
  - name: "Engineering strain, Example 5.2"
    symbol: "epsilon"
    unit: "ft/ft"
    test_expected: 0.00111
    tolerance: 0.000005
worked_examples:
  - id: "en400_2020_ch5_ex5_1"
    description: "Example 5.1: Normal stress under axial load"
    inputs:
      diameter_in: 1.00
      axial_force_lb: 25000.0
    input_units:
      diameter_in: "in"
      axial_force_lb: "lb"
    outputs:
      normal_stress_psi: 31800.0
    output_units:
      normal_stress_psi: "psi"
    intermediate_outputs:
      area_in2: 0.785
    intermediate_units:
      area_in2: "in^2"
    absolute_tolerance:
      normal_stress_psi: 50.0
    tolerance_basis: "Half the last retained 100-psi place in the printed stress answer"
    source_url: "https://www.usna.edu/NAOE/_files/documents/Courses/EN400/EN400_Course_Notes,_Summer_2020.pdf"
    source_version: "Summer 2020"
    source_sha256: "f8f4807492bffcc61cfe1b03bc7a0f457d7ab5209bb0404bba44a4e363be7cec"
    printed_page: "5-3"
    pdf_page: 194
    source_section: "5.2.1"
    source_example: "5.1"
    use_as_test: true
  - id: "en400_2020_ch5_ex5_2"
    description: "Example 5.2: Engineering strain from a measured elongation"
    inputs:
      original_length_ft: 75.0
      elongation_in: 1.0
    input_units:
      original_length_ft: "ft"
      elongation_in: "in"
    outputs:
      engineering_strain: 0.00111
    output_units:
      engineering_strain: "ft/ft"
    absolute_tolerance:
      engineering_strain: 0.000005
    tolerance_basis: "Half the final printed increment of 0.00001 in dimensionless strain"
    source_url: "https://www.usna.edu/NAOE/_files/documents/Courses/EN400/EN400_Course_Notes,_Summer_2020.pdf"
    source_version: "Summer 2020"
    source_sha256: "f8f4807492bffcc61cfe1b03bc7a0f457d7ab5209bb0404bba44a4e363be7cec"
    printed_page: "5-4"
    pdf_page: 195
    source_section: "5.2.2"
    source_example: "5.2"
    use_as_test: true
assumptions:
  - "Example 5.1 uses the original circular area; its printed intermediate is retained separately."
  - "Example 5.2 retains elongation in inches; a consumer converts inches to feet before division."
  - "Strain is dimensionless; ft/ft records the source's matching length units."
  - "Absolute tolerances describe printed-answer rounding, not engineering accuracy or material allowables."
references:
  - "USNA EN400 Principles of Ship Performance, Summer 2020, Chapter 5, sections 5.2.1 and 5.2.2"
  - "Example 5.1: printed p. 5-3, PDF page 194 (one-based)"
  - "Example 5.2: printed p. 5-4, PDF page 195 (one-based)"
