superseded_answers:
  - description: "Former verified analytical answer"
    outputs:
      horizontal_tension: 1327168
      vertical_tension_fairlead: 1961959
      total_tension_fairlead: 2368683
      catenary_parameter: 676.44
      elongation: 0.021
    use_as_test: false
    reason: "Its H/w fails the stated chord/arc identity. A nearly touchdown-based solution explains its fairlead vertical load being approximately the whole line weight; with a horizontal anchor tangent the implied rise exceeds the stated rise. The touchdown span/length root is near, rather than exactly equal to, this published answer."
  - description: "Former spreadsheet answer, also duplicated as a dataclass example"
    outputs:
      horizontal_tension: 785000
      vertical_tension_fairlead: 196200
      total_tension_fairlead: 809000
      total_tension_anchor: 785000
      elongation: 12.3
    use_as_test: false
    reason: "Its H/w fails the stated chord/arc identity. The duplicated example implies zero anchor vertical load from T_anchor=H, while V_fairlead is not the full line weight."
assumptions:
  - "Fully suspended line without seabed contact; low point lies between endpoints and below the anchor"
  - "Uniform submerged weight per unit unstretched length and constant axial stiffness"
  - "Linear elastic strain T/EA; both elastic coordinate increments are retained"
  - "Vertical components are signed internal components, not support reaction magnitudes"
  - "The classical physical chord/arc identity applies only in the inextensible limit; the elastic reference uses corrected geometric spans"
  - "Legacy spreadsheet and status-document answers are superseded, not validation targets"
references:
