equations:
  - name: "Signed vertical equilibrium"
    latex: "V(s) = V_a + w s, \\quad V_f - V_a = w L"
    description: "s is unstretched arclength; V is the internal component directed from anchor toward fairlead"
  - name: "Endpoint tension"
    latex: "T_i = \\sqrt{H^2 + V_i^2}"
    description: "Applies at both endpoints"
  - name: "Elastic horizontal span"
    latex: "X = \\frac{H}{w}[\\operatorname{asinh}(V_f/H)-\\operatorname{asinh}(V_a/H)] + \\frac{HL}{EA}"
    description: "Integral of dx/ds = H/T + H/EA"
  - name: "Elastic vertical span"
    latex: "d = \\frac{T_f-T_a}{w} + \\frac{(V_a+wL/2)L}{EA}"
    description: "Integral of dy/ds = V/T + V/EA"
  - name: "Elastic elongation"
    latex: "\\Delta L = \\frac{1}{EA}\\int_0^L \\sqrt{H^2+(V_a+ws)^2}\\,ds"
    description: "Full tension-dependent stretch; H*L/EA is only the horizontal elastic displacement"
  - name: "Inextensible chord/arc identity"
    latex: "\\sqrt{S^2-d_g^2} = 2a\\sinh(X_g/(2a)), \\quad a=H/w"
    description: "S=L, X_g=X-HL/EA, d_g=d-(V_a+wL/2)L/EA; inextensible limit uses physical X and d"
